<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Система ЛНК</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --ink:#1b2430; --muted:#5b6675; --faint:#8a94a2;
    --line:#d6dbe3; --brand:#1f5c8f; --brand-d:#164668; --brand-soft:#e7f0f8;
    --ok:#1c7a4a; --okbg:#e3f3ea; --warn:#b26a00; --warnbg:#fff2dc;
    --danger:#b3261e; --dangerbg:#fbe6e4; --row:#f6f8fb;
    --shadow:0 1px 3px rgba(20,30,50,.12),0 6px 20px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}

  .app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:52px 1fr 30px;
    grid-template-areas:"top top" "side main" "side foot";height:100vh}
  .top{grid-area:top;background:var(--brand);color:#fff;display:flex;align-items:center;
    gap:12px;padding:0 16px;box-shadow:var(--shadow);z-index:3}
  .top .logo{width:26px;height:26px;border-radius:6px;background:#fff;color:var(--brand);
    display:grid;place-items:center;font-weight:800}
  .top h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .top .tag{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px}
  .top .spring{flex:1}
  .top .who{font-size:12px;opacity:.92}

  .side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
    padding:10px 8px;overflow:auto}
  .side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
    padding:12px 10px 4px}
  .nav{display:flex;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    padding:9px 10px;border-radius:8px;margin:1px 0;gap:9px;align-items:center}
  .nav:hover{background:var(--row)}
  .nav.on{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
  .nav .ic{width:18px;text-align:center;opacity:.85}
  .nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--row);
    border-radius:20px;padding:1px 8px}
  .nav.on .cnt{background:#fff}

  .main{grid-area:main;overflow:auto;padding:18px 22px}
  .foot{grid-area:foot;background:var(--panel);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:0 16px;font-size:11.5px;color:var(--muted)}
  .foot b{color:var(--ink);font-weight:600}

  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .head h2{margin:0;font-size:19px;font-weight:650}
  .head .sub{color:var(--muted);font-size:12.5px;margin-left:2px}
  .head .spring{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;
    border-radius:8px;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
  .btn:hover{border-color:#b9c2ce}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}

  .search{flex:1;min-width:200px;max-width:380px;position:relative}
  .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;
    background:#fff;font:inherit}
  .search .ic{position:absolute;left:11px;top:8px;color:var(--faint)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden}
  .tblwrap{overflow:auto;max-height:calc(100vh - 190px)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f2f5f9;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;
    font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:nth-child(even){background:var(--row)}
  tbody tr:hover{background:var(--brand-soft)}
  td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  td.obj{min-width:280px}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;display:inline-block;
    margin:1px 2px 1px 0;background:var(--brand-soft);color:var(--brand-d)}
  .st{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
  .st.ok{background:var(--okbg);color:var(--ok)} .st.work{background:var(--warnbg);color:var(--warn)}
  .st.new{background:var(--brand-soft);color:var(--brand-d)} .st.bad{background:var(--dangerbg);color:var(--danger)}
  .empty{padding:44px;text-align:center;color:var(--muted)}
  .muted{color:var(--muted)}

  /* Детальная карточка справа */
  .veil{position:fixed;inset:0;background:rgba(20,30,50,.35);display:none;z-index:10}
  .veil.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100%);background:#fff;
    box-shadow:-8px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:.22s;
    z-index:11;display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .drawer .dh h3{margin:0;font-size:16px;flex:1}
  .drawer .dh .x{border:0;background:var(--row);border-radius:8px;width:30px;height:30px;color:var(--muted)}
  .drawer .db{padding:6px 20px 24px;overflow:auto}
  .fld{padding:10px 0;border-bottom:1px solid #eef1f5;display:grid;grid-template-columns:150px 1fr;gap:12px}
  .fld .k{color:var(--muted);font-size:12.5px}
  .fld .v{font-size:13.5px;white-space:pre-wrap}
  .sect{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);
    margin:18px 0 2px;font-weight:700}
  .mtab{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
  .mtab td,.mtab th{border:1px solid var(--line);padding:6px 9px;text-align:left}
  .mtab th{background:#f2f5f9;font-size:11px;text-transform:uppercase;color:var(--muted)}

  .toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;
    transition:.25s;z-index:30;box-shadow:var(--shadow);font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .placeholder{display:grid;place-items:center;height:65%;color:var(--muted);text-align:center}
  .placeholder .big{font-size:44px;margin-bottom:10px;opacity:.5}

  @media print{
    .app{display:block;height:auto}
    .top,.side,.foot,.head .btn,.head .search,.veil,.drawer{display:none!important}
    .main{padding:0;overflow:visible} .card{border:0;box-shadow:none}
    .tblwrap{max-height:none;overflow:visible} th{position:static}
    .print-only{display:block!important} @page{margin:12mm}
  }
  .print-only{display:none;font-size:17px;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">Л</div>
    <h1>Система ЛНК</h1>
    <span class="tag" id="verTag">проба • реальные данные</span>
    <div class="spring"></div>
    <div class="who">Рабочее место: <b id="wsName">М1</b></div>
  </div>

  <nav class="side" id="side">
    <div class="grp">Работа</div>
    <button class="nav on" data-view="journal"><span class="ic">▤</span>Журнал<span class="cnt" id="cJournal">0</span></button>
    <button class="nav" data-view="objects"><span class="ic">▢</span>Объекты<span class="cnt" id="cObjects">0</span></button>
    <button class="nav" data-view="si"><span class="ic">⌗</span>Приборы (СИ)<span class="cnt" id="cSi">0</span></button>
    <button class="nav" data-view="people"><span class="ic">☺</span>Специалисты<span class="cnt" id="cPeople">0</span></button>
    <div class="grp">Документы</div>
    <button class="nav" data-view="docs"><span class="ic">▦</span>Акты и протоколы</button>
    <button class="nav" data-view="plan"><span class="ic">◷</span>План работ</button>
    <div class="grp">Обмен</div>
    <button class="nav" data-view="exchange"><span class="ic">⇄</span>Обмен файлами</button>
  </nav>

  <main class="main" id="main"></main>

  <div class="foot">
    <span>Собрано: <b id="fBuilt">—</b></span>
    <span>Записей журнала: <b id="fRows">0</b></span>
    <span style="margin-left:auto">данные только для примера</span>
  </div>
</div>

<div class="veil" id="veil" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h3 id="dTitle">—</h3><button class="x" onclick="closeDrawer()">✕</button></div>
  <div class="db" id="dBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script id="lnk-data" type="application/json">/*ДАННЫЕ*/</script>
<script>
"use strict";
const DB = JSON.parse(document.getElementById("lnk-data").textContent);
const METHODS = DB.методы || ["ВИК","УЗД","УЗТ","АЭ","ТВ","ТК","ВД","МК"];
const objById = {}; (DB.объекты||[]).forEach(o=>objById[o.id]=o);
let curView="journal", query="";

// ── helpers ───────────────────────────────────────────────
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function ru(d){ if(!d) return ""; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d); return m?`${m[3]}.${m[2]}.${m[1]}`:d; }
function statusClass(s){ s=(s||"").toLowerCase();
  if(s.includes("зарегистр")) return "ok";
  if(s.includes("аннул")) return "bad";
  if(s.includes("работ")||s.includes("чернов")) return "work";
  return "new"; }
function methodsOf(z){ return Object.keys(z.методы||{}); }

function setChrome(){
  document.getElementById("cJournal").textContent=DB.журнал.length;
  document.getElementById("cObjects").textContent=DB.объекты.length;
  document.getElementById("cSi").textContent=DB.си.length;
  document.getElementById("cPeople").textContent=DB.специалисты.length;
  document.getElementById("fRows").textContent=DB.журнал.length;
  document.getElementById("fBuilt").textContent=ru(DB.собрано)||DB.собрано||"—";
  document.getElementById("verTag").textContent="v"+(DB.версия||"?")+" • реальные данные";
}

// ── Журнал ────────────────────────────────────────────────
function renderJournal(){
  const q=query.toLowerCase();
  const rows=DB.журнал.filter(z=>!q ||
    (z.объект+z.акт+z.наименование+z.зав+z.рег+methodsOf(z).join(" ")+z.дата).toLowerCase().includes(q));
  const body=rows.length?rows.map(z=>`
    <tr onclick="showJournal('${esc(z.id)}')">
      <td class="num">${esc(z.акт)||"—"}</td>
      <td class="num">${ru(z.дата)}</td>
      <td class="obj">${esc(z.объект)}${z.зав?`<div class="muted" style="font-size:11.5px">зав. № ${esc(z.зав)}${z.рег?` · рег. ${esc(z.рег)}`:""}</div>`:""}</td>
      <td>${methodsOf(z).map(m=>`<span class="pill">${m}</span>`).join("")||"<span class='muted'>—</span>"}</td>
      <td><span class="st ${statusClass(z.статус)}">${esc(z.статус)||"—"}</span></td>
    </tr>`).join(""):`<tr><td colspan="5" class="empty">Ничего не найдено.</td></tr>`;
  document.getElementById("main").innerHTML=`
    <div class="print-only">Журнал учёта заключений ЛНК</div>
    <div class="head">
      <h2>Журнал</h2><span class="sub" id="cnt">${rows.length} из ${DB.журнал.length}</span>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Поиск: объект, № акта, зав. №, метод…" value="${esc(query)}"></div>
      <div class="spring"></div>
      <button class="btn" onclick="exportCSV()">▤ Экспорт в Excel</button>
      <button class="btn" onclick="window.print()">⎙ Печать / PDF</button>
    </div>
    <div class="card"><div class="tblwrap"><table>
      <thead><tr><th>№ акта</th><th>Дата</th><th>Объект контроля</th><th>Методы</th><th>Статус</th></tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
  const qb=document.getElementById("q");
  qb.addEventListener("input",()=>{query=qb.value;const p=qb.selectionStart;renderJournal();
    const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p);});
}
function showJournal(id){
  const z=DB.журнал.find(x=>String(x.id)===String(id)); if(!z) return;
  const mrows=methodsOf(z).map(m=>`<tr><td>${m}</td><td>${esc(z.методы[m].н)||"—"}</td><td>${esc(z.методы[m].исп)||"—"}</td></tr>`).join("")
    ||`<tr><td colspan="3" class="muted">методы не указаны</td></tr>`;
  const F=(k,v)=>v?`<div class="fld"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`:"";
  openDrawer("Акт № "+(z.акт||"—")+" от "+ru(z.дата), `
    ${F("Статус",z.статус)}${F("Объект",z.объект)}${F("Наименование в документе",z.наименование)}
    ${F("Заводской №",z.зав)}${F("Рег. / уч. №",z.рег)}${F("Подразделение",z.подразделение)}
    <div class="sect">Методы контроля</div>
    <table class="mtab"><thead><tr><th>Метод</th><th>№</th><th>Исполнитель</th></tr></thead><tbody>${mrows}</tbody></table>
    <div class="sect">Движение экземпляров</div>
    ${F("В архив ЛНК",z.архив)}${F("Исходящий",z.исходящий)}${F("Отправитель",z.отправитель)}
    ${F("Примечание",z.примечание)}`);
}

// ── Объекты ───────────────────────────────────────────────
function renderObjects(){
  const q=query.toLowerCase();
  const rows=DB.объекты.filter(o=>!q||(o.наименование+o.зав+o.рег+o.тип+o.место).toLowerCase().includes(q));
  const body=rows.length?rows.map(o=>`
    <tr onclick="showObject(${o.id})">
      <td class="obj">${esc(o.наименование)}</td>
      <td class="num">${esc(o.зав)||"—"}</td>
      <td class="num">${esc(o.рег)||"—"}</td>
      <td>${esc(o.тип)||"<span class='muted'>—</span>"}</td>
      <td class="num">${esc(o.место)||"—"}</td>
    </tr>`).join(""):`<tr><td colspan="5" class="empty">Ничего не найдено.</td></tr>`;
  document.getElementById("main").innerHTML=`
    <div class="print-only">Справочник объектов контроля</div>
    <div class="head"><h2>Объекты</h2><span class="sub">${rows.length} из ${DB.объекты.length}</span>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Поиск: наименование, зав. №, тип…" value="${esc(query)}"></div>
      <div class="spring"></div>
      <button class="btn" onclick="exportCSV()">▤ Экспорт в Excel</button>
      <button class="btn" onclick="window.print()">⎙ Печать / PDF</button></div>
    <div class="card"><div class="tblwrap"><table>
      <thead><tr><th>Наименование</th><th>Заводской №</th><th>Рег. / уч. №</th><th>Тип / группа</th><th>Расположение</th></tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
  wireSearch(renderObjects);
}
function showObject(id){
  const o=objById[id]; if(!o) return;
  const F=(k,v)=>v?`<div class="fld"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`:"";
  const cnt=DB.журнал.filter(z=>z.объект===o.наименование).length;
  openDrawer(o.наименование,`
    ${F("Заводской №",o.зав)}${F("Регистрационный №",o.рег)}${F("Учётный №",o.учет)}${F("Инвентарный №",o.инв)}
    ${F("Тип / группа",o.тип)}${F("Расположение",o.место)}${F("Изготовитель",o.изготовитель)}${F("Паспорт",o.паспорт)}
    <div class="sect">Параметры для контроля</div>
    ${F("Марка материала",o.материал)}${F("Объём",o.объем)}${F("Толщины",o.толщины)}
    ${F("Мин. толщина, мм",o.мин_толщина)}${F("Доп. твёрдость, НВ",o.твердость)}
    ${F("Рабочее давление",o.давление)}${F("Рабочая среда",o.среда)}
    <div class="sect">Работы</div>
    <div class="fld"><div class="k">В журнале</div><div class="v">${cnt} записей</div></div>
    ${F("Примечание",o.примечание)}`);
}

// ── СИ ────────────────────────────────────────────────────
function siStatus(s){
  const d=s.поверка_до, m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");
  if(!m) return ["new", s.свидетельство?"поверен":"—"];
  const до=new Date(+m[1],+m[2]-1,+m[3]), now=new Date();
  const days=Math.round((до-now)/864e5);
  if(days<0) return ["bad","просрочен"];
  if(days<30) return ["work","истекает"];
  return ["ok","поверен"];
}
function renderSi(){
  const q=query.toLowerCase();
  const rows=DB.си.filter(s=>!q||(s.наименование+s.тип+s.зав+s.метод).toLowerCase().includes(q));
  const body=rows.length?rows.map(s=>{const[c,l]=siStatus(s);return`
    <tr onclick="showSi(${s.id})">
      <td class="obj">${esc(s.наименование)}<div class="muted" style="font-size:11.5px">${esc(s.тип)}</div></td>
      <td class="num">${esc(s.зав)||"—"}</td>
      <td>${esc(s.метод)||"—"}</td>
      <td class="num">${ru(s.поверка_до)||"—"}</td>
      <td><span class="st ${c}">${l}</span></td>
    </tr>`;}).join(""):`<tr><td colspan="5" class="empty">Ничего не найдено.</td></tr>`;
  document.getElementById("main").innerHTML=`
    <div class="print-only">Реестр средств измерений</div>
    <div class="head"><h2>Приборы (СИ)</h2><span class="sub">${rows.length} из ${DB.си.length}</span>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Поиск: наименование, тип, метод…" value="${esc(query)}"></div>
      <div class="spring"></div>
      <button class="btn" onclick="exportCSV()">▤ Экспорт в Excel</button>
      <button class="btn" onclick="window.print()">⎙ Печать / PDF</button></div>
    <div class="card"><div class="tblwrap"><table>
      <thead><tr><th>Наименование</th><th>Заводской №</th><th>Метод</th><th>Поверка до</th><th>Статус</th></tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
  wireSearch(renderSi);
}
function showSi(id){
  const s=DB.си.find(x=>x.id===id); if(!s) return;
  const F=(k,v)=>v?`<div class="fld"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`:"";
  openDrawer(s.наименование,`
    ${F("Тип / обозначение",s.тип)}${F("Заводской №",s.зав)}${F("Инвентарный №",s.инв)}
    ${F("Метод контроля",s.метод)}${F("Назначение",s.назначение)}
    <div class="sect">Поверка</div>
    ${F("Действительно до",ru(s.поверка_до))}${F("№ свидетельства",s.свидетельство)}${F("Периодичность, мес.",s.периодичность)}
    <div class="sect">Прочее</div>
    ${F("Хранение",s.хранение)}${F("Состояние",s.состояние)}`);
}

// ── Специалисты ───────────────────────────────────────────
function renderPeople(){
  const body=DB.специалисты.map(p=>`
    <tr onclick="showPerson(${p.id})">
      <td class="obj">${esc(p.вдок||p.фио)}</td>
      <td>${esc(p.должность)||"—"}</td>
      <td>${esc(p.функции)||"<span class='muted'>—</span>"}</td>
      <td class="num">${esc(p.стаж)||"—"}</td>
    </tr>`).join("")||`<tr><td colspan="4" class="empty">Список пуст.</td></tr>`;
  document.getElementById("main").innerHTML=`
    <div class="print-only">Специалисты ЛНК</div>
    <div class="head"><h2>Специалисты</h2><span class="sub">${DB.специалисты.length}</span>
      <div class="spring"></div>
      <button class="btn" onclick="exportCSV()">▤ Экспорт в Excel</button>
      <button class="btn" onclick="window.print()">⎙ Печать / PDF</button></div>
    <div class="card"><div class="tblwrap"><table>
      <thead><tr><th>ФИО</th><th>Должность</th><th>Функции в ЛНК</th><th>Стаж с</th></tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
}
function showPerson(id){
  const p=DB.специалисты.find(x=>x.id===id); if(!p) return;
  const F=(k,v)=>v?`<div class="fld"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`:"";
  openDrawer(p.фио,`${F("В документах",p.вдок)}${F("Должность",p.должность)}${F("Функции в ЛНК",p.функции)}${F("Стаж по НК с",p.стаж)}`);
}

// ── Заглушки и обмен ──────────────────────────────────────
function renderPlaceholder(t,x){document.getElementById("main").innerHTML=
  `<div class="head"><h2>${t}</h2></div><div class="placeholder"><div><div class="big">▦</div>${x}</div></div>`;}
function renderExchange(){document.getElementById("main").innerHTML=`
  <div class="head"><h2>Обмен файлами</h2></div>
  <div class="card" style="padding:20px;max-width:660px;line-height:1.7">
    Обмен между рабочими местами (флешка или общая папка) прорабатываем отдельно —
    как вы и сказали. Здесь он появится, когда договоримся о порядке.<br><br>
    <span class="muted">Экспорт в Excel и печать в PDF уже работают на каждой вкладке.</span>
  </div>`;}

// ── Общее ─────────────────────────────────────────────────
function wireSearch(re){const qb=document.getElementById("q");if(!qb)return;
  qb.addEventListener("input",()=>{query=qb.value;const p=qb.selectionStart;re();
    const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(p,p);}});}
function openDrawer(title,html){document.getElementById("dTitle").textContent=title;
  document.getElementById("dBody").innerHTML=html;
  document.getElementById("drawer").classList.add("show");document.getElementById("veil").classList.add("show");}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");
  document.getElementById("veil").classList.remove("show");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

function exportCSV(){
  let head,rowsF,name;
  if(curView==="journal"){head=["№ акта","Дата","Объект","Заводской №","Рег. №","Методы","Статус"];
    rowsF=DB.журнал.map(z=>[z.акт,ru(z.дата),z.объект,z.зав,z.рег,methodsOf(z).join(" "),z.статус]);name="Журнал ЛНК";}
  else if(curView==="objects"){head=["Наименование","Заводской №","Рег. №","Тип","Расположение","Материал"];
    rowsF=DB.объекты.map(o=>[o.наименование,o.зав,o.рег,o.тип,o.место,o.материал]);name="Объекты ЛНК";}
  else if(curView==="si"){head=["Наименование","Тип","Заводской №","Метод","Поверка до","№ свидетельства"];
    rowsF=DB.си.map(s=>[s.наименование,s.тип,s.зав,s.метод,ru(s.поверка_до),s.свидетельство]);name="СИ ЛНК";}
  else if(curView==="people"){head=["ФИО","Должность","Функции","Стаж с"];
    rowsF=DB.специалисты.map(p=>[p.фио,p.должность,p.функции,p.стаж]);name="Специалисты ЛНК";}
  else{toast("Здесь нечего выгружать");return;}
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const csv="﻿"+[head.map(q).join(";")].concat(rowsF.map(r=>r.map(q).join(";"))).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name+".csv";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
  toast("Выгружено для Excel: "+rowsF.length+" строк");
}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}

function switchView(v){curView=v;query="";
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.view===v));
  ({journal:renderJournal,objects:renderObjects,si:renderSi,people:renderPeople,exchange:renderExchange}[v]
    ||(()=>renderPlaceholder(v==="docs"?"Акты и протоколы":"План работ",
       v==="docs"?"Формирование документов по записям журнала — следующий шаг.":"Плановые и внеплановые работы — следующий шаг.")))();}
document.getElementById("side").addEventListener("click",e=>{const b=e.target.closest(".nav");if(b)switchView(b.dataset.view);});

setChrome(); switchView("journal");
</script>
