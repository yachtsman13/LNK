// ── Выгрузка в Excel (.xlsx) ──────────────────────────────
// Раньше выгружался CSV. В Office 2016 это лотерея: разделитель столбцов
// CSV берёт из региональных настроек Windows, и на другой машине файл
// открывается одной колонкой. Плюс даты и числа приезжают текстом.
// Настоящий .xlsx — это тот же ZIP, что и .docx, писать его умеем.
//
// Строки кладём прямо в ячейки (inlineStr), без общей таблицы строк:
// файл чуть больше, зато собирается в один проход и не может разъехаться.
const XL_ЭПОХА = Date.UTC(1899,11,30);          // Excel считает дни от 30.12.1899
function xlДата(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||"")); if(!m) return null;
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-XL_ЭПОХА)/86400000);
}
function xlБуква(n){                             // 1 → A, 27 → AA
  let s=""; while(n>0){ const о=(n-1)%26; s=String.fromCharCode(65+о)+s; n=(n-о-1)/26; }
  return s;
}
function xlЯчейка(адрес, знач, тип){
  if(знач==null || знач==="") return "";
  if(тип==="дата"){
    const д=xlДата(знач);
    if(д!=null) return '<c r="'+адрес+'" s="2"><v>'+д+'</v></c>';
  }
  if(тип==="число"){
    const ч=Number(String(знач).replace(",","."));
    if(isFinite(ч) && String(знач).trim()!=="") return '<c r="'+адрес+'"><v>'+ч+'</v></c>';
  }
  return '<c r="'+адрес+'" t="inlineStr"><is><t xml:space="preserve">'+X(знач)+'</t></is></c>';
}
function xlЛист(лист){
  const кол=лист.колонки, N=кол.length, M=лист.строки.length;
  let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<dimension ref="A1:'+xlБуква(N)+Math.max(1,M+1)+'"/>'+
    // шапка закреплена — иначе на 315 строках непонятно, что за столбец
    '<sheetViews><sheetView workbookViewId="0">'+
    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'+
    '</sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/><cols>';
  кол.forEach((к,i)=>{ xml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(к.ш||16)+'" customWidth="1"/>'; });
  xml+='</cols><sheetData><row r="1">';
  кол.forEach((к,i)=>{ xml+='<c r="'+xlБуква(i+1)+'1" t="inlineStr" s="1"><is><t>'+X(к.з)+'</t></is></c>'; });
  xml+='</row>';
  лист.строки.forEach((стр,ri)=>{
    const r=ri+2; xml+='<row r="'+r+'">';
    стр.forEach((v,ci)=>{ xml+=xlЯчейка(xlБуква(ci+1)+r, v, кол[ci].тип); });
    xml+='</row>';
  });
  xml+='</sheetData>';
  // По схеме autoFilter идёт ПОСЛЕ sheetData, а не до — иначе Excel
  // объявит книгу повреждённой (та же строгость, что и в Word).
  if(M) xml+='<autoFilter ref="A1:'+xlБуква(N)+(M+1)+'"/>';
  return xml+'</worksheet>';
}
function xlsxФайл(имяФайла, листы){
  const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const стили='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="DD.MM.YYYY"/></numFmts>'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill>'+
    '<fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="3">'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';
  let книга='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="'+R+'"><sheets>';
  let связи='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  let типы='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
  const файлы=[{имя:"xl/styles.xml", данные:стили}];
  листы.forEach((л,i)=>{
    const n=i+1;
    книга+='<sheet name="'+X(л.имя)+'" sheetId="'+n+'" r:id="rId'+n+'"/>';
    связи+='<Relationship Id="rId'+n+'" Type="'+R+'/worksheet" Target="worksheets/sheet'+n+'.xml"/>';
    типы+='<Override PartName="/xl/worksheets/sheet'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    файлы.push({имя:"xl/worksheets/sheet"+n+".xml", данные:xlЛист(л)});
  });
  книга+='</sheets></workbook>';
  связи+='<Relationship Id="rId'+(листы.length+1)+'" Type="'+R+'/styles" Target="styles.xml"/></Relationships>';
  типы+='</Types>';
  файлы.unshift(
    {имя:"[Content_Types].xml", данные:типы},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {имя:"xl/workbook.xml", данные:книга},
    {имя:"xl/_rels/workbook.xml.rels", данные:связи});
  dlBlob(имяФайла, zipStore(файлы));
}

// Что именно выгружаем. Журнал уходит полностью: в CSV терялось самое
// нужное — номера протоколов по методам, оставались одни названия методов.
function листЖурнала(строки){
  const колонки=[{з:"№ п/п",ш:7,тип:"число"},{з:"№ акта",ш:14},{з:"Дата",ш:12,тип:"дата"},
    {з:"Статус",ш:16},{з:"Подразделение",ш:20},{з:"Объект контроля",ш:38},
    {з:"Наименование в документе",ш:30},{з:"Заводской №",ш:14},{з:"Рег. №",ш:14}];
  METHODS.forEach(м=>{ колонки.push({з:м+" №",ш:13}); колонки.push({з:м+" исполнитель",ш:17}); });
  колонки.push({з:"Заключение",ш:40},{з:"Примечание",ш:24});
  const из=строки.map((z,i)=>{
    const р=[i+1, z.акт, z.дата, z.статус, z.подразделение, z.объект,
             z.наименование, завЗаписи(z), регЗаписи(z)];
    METHODS.forEach(м=>{ const v=(z.методы||{})[м]||{};
      р.push(обозначениеПротокола(z,м)||v.н||""); р.push(v.исп||""); });
    р.push(z.заключение, z.примечание);
    return р;
  });
  return {имя:"Журнал", колонки:колонки, строки:из};
}

function сегодня(){ return new Date().toISOString().slice(0,10); }
function exportXlsx(){
  let лист;
  if(curView==="journal")      лист=листЖурнала(journalRows());
  else if(curView==="objects") лист=листОбъектов();
  else if(curView==="si")      лист=листПриборов();

  else { toast("Здесь нечего выгружать"); return; }
  xlsxФайл(лист.имя+" ЛНК "+сегодня()+".xlsx",[лист]);

const THEME_KEY="lnk_theme";
function applyTheme(t){
  if(t && t!=="default") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  const sel=document.getElementById("theme"); if(sel) sel.value=t;
}
(function initTheme(){
  let t="default";
  try{ t=localStorage.getItem(THEME_KEY)||"default"; }catch(e){}
  applyTheme(t);
  document.getElementById("theme").addEventListener("change",function(){ applyTheme(this.value); });
})();
