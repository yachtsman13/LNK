// wТаблШапка() паспорта считает ширину таблицы по ШИРИНА_ТЕКСТА (книжная
// страница) — плану нужна альбомная, поэтому берём ту же вёрстку ячеек,
// но с суммой ширин по ШИРИНА_АЛЬБОМ.
function wТаблШапкаШир(шапка, ширины, строки, центр, серый){
  const grid=ширины.map(ш=>'<w:gridCol w:w="'+ш+'"/>').join('');
  let из='<w:tbl><w:tblPr><w:tblW w:w="'+ШИРИНА_АЛЬБОМ+'" w:type="dxa"/>'+
    '<w:tblBorders>'+wГраницыТабл()+'</w:tblBorders>'+
    '<w:tblLayout w:type="fixed"/>'+
    '<w:tblCellMar><w:left w:w="60" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar>'+
    '</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>';
  из+=wСтрокаТабл(шапка,ширины,true,центр,серый);
  строки.forEach(р=>из+=wСтрокаТабл(р,ширины,false,центр,серый));
  из+='</w:tbl>';
  return из;
}

// ── Задачи: ядро ──────────────────────────────────────────
// Одна сущность со сроком; день, неделя, месяц, квартал, полугодие и год —
// шесть способов посмотреть на один список, а не шесть списков. Почему так,
// расписано в ТЗ/Проработка_менеджер_задач.md: задачи переносят, и при
// раздельных списках перенесённая задача теряется или задваивается.
const REG_ЗАД="lnk_tasks";
let ЗАД;

const ГОРИЗОНТЫ=[["день","День"],["неделя","Неделя"],["месяц","Месяц"],
                 ["квартал","Квартал"],["полугодие","Полугодие"],["год","Год"]];

// Состояния. Контроль исполнения нужен (ответ заказчика), поэтому после
// «выполнена» задача не закрывается сама: её принимает постановщик либо
// возвращает на доработку. «Принята в работу» нужна отдельно, потому что
// связь между местами только файлами — иначе не видно, дошла ли задача.
const СОСТОЯНИЯ={
  назначена:{т:"Назначена",   к:"new"},
  принята:  {т:"Принята в работу", к:"work"},
  выполнена:{т:"Выполнена, на проверке", к:"warn"},
  закрыта:  {т:"Принята начальником", к:"ok"},
  доработка:{т:"Возвращена на доработку", к:"bad"},
  отменена: {т:"Отменена",    к:""}
};
function состТекст(з){ return (СОСТОЯНИЯ[з.статус]||{}).т || з.статус || ""; }
function состКласс(з){ return (СОСТОЯНИЯ[з.статус]||{}).к || ""; }
function живаяЗадача(з){ return !з.удалено && з.статус!=="отменена"; }

// Границы периода. Квартал и полугодие считаются от календарного года,
// неделя — с понедельника: так их и понимают в отчётности.
function границыПериода(вид, база){
  const d=база?new Date(база+"T00:00:00"):new Date();
  const г=d.getFullYear(), м=d.getMonth();
  const дата=(y,mo,day)=>new Date(Date.UTC(y,mo,day)).toISOString().slice(0,10);
  if(вид==="день")     return [дата(г,м,d.getDate()), дата(г,м,d.getDate())];
  if(вид==="неделя"){
    const дн=(d.getDay()+6)%7;                       // понедельник = 0
    const пн=new Date(d); пн.setDate(d.getDate()-дн);
    const вс=new Date(пн); вс.setDate(пн.getDate()+6);
    return [дата(пн.getFullYear(),пн.getMonth(),пн.getDate()),
            дата(вс.getFullYear(),вс.getMonth(),вс.getDate())];
  }
  if(вид==="месяц")    return [дата(г,м,1), дата(г,м+1,0)];
  if(вид==="квартал"){ const к=Math.floor(м/3); return [дата(г,к*3,1), дата(г,к*3+3,0)]; }
  if(вид==="полугодие"){ const п=м<6?0:6; return [дата(г,п,1), дата(г,п+6,0)]; }
  return [дата(г,0,1), дата(г,11,31)];               // год
}
function имяПериода(вид, база){
  const [с,по]=границыПериода(вид,база);
  const d=new Date(с+"T00:00:00"), г=d.getFullYear(), м=d.getMonth();
  if(вид==="день")      return ru(с);
  if(вид==="неделя")    return "неделя "+ru(с)+" — "+ru(по);
  if(вид==="месяц")     return МЕСЯЦЫ[м]+" "+г;
  if(вид==="квартал")   return (Math.floor(м/3)+1)+"-й квартал "+г;
  if(вид==="полугодие") return (м<6?"1":"2")+"-е полугодие "+г;
  return г+" год";
}
function вПериоде(дата, вид, база){
  const [с,по]=границыПериода(вид,база);
  const d=String(дата||""); return !!d && d>=с && d<=по;
}

// Перенос срока сохраняет первоначальную дату: без этого отчёт всегда
// показывал бы сто процентов выполнения в срок.
function перенести(id, новыйСрок, причина){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  if(!з.срок_первый) з.срок_первый=з.срок;
  з.переносы=(з.переносы||[]).concat([{было:з.срок, стало:новыйСрок,
    причина:причина||"", когда:new Date().toISOString().slice(0,10)}]);
  з.срок=новыйСрок;
  отметитьЗадачу(з);
}
function отметитьЗадачу(з){
  з.изменено=new Date().toISOString(); з.место_правки=getWS().код;
  saveReg(REG_ЗАД,ЗАД);
}
function вСрок(з){
  if(!з.выполнено) return null;
  const план=з.срок_первый||з.срок;
  return план ? (з.выполнено<=план) : null;
}
function просроченаЗадача(з){
  if(!живаяЗадача(з) || з.статус==="закрыта") return false;
  const сегодня=new Date().toISOString().slice(0,10);
  return !!з.срок && з.срок<сегодня && з.статус!=="выполнена";
}

// Начальник ставит задачи и принимает работу. Роль — признак рабочего
// места, рядом с «мастером»: отдельного входа в программу нет и не будет,
// места и так разделены физически.
function яНачальник(){ return !!getWS().начальник; }
function ставитель(з){ return з.постановщик||""; }
function мояЗадача(з){
  const ws=getWS();
  return з.место===ws.код || (з.исполнитель && з.исполнитель===getЛаб().начальник);
}

// ── Задачи, которые система знает сама ────────────────────
// 230 работ ППР в год, поверки приборов, сроки лаборатории. Руками это не
// переписывают: во-первых, объём, во-вторых — отметки в двух местах
// разойдутся и правды не найти. Поэтому такие задачи НЕ ХРАНЯТСЯ, а
// вычисляются на лету и показываются рядом со своими. Отмечаются они там,
// где им место: работа ППР — в плане ППР, поверка — в карточке прибора.
function производныеЗадачи(вид, база){
  const [с,по]=границыПериода(вид, база);
  const из=[];
  const вокне=д=>!!д && д>=с && д<=по;
  const посл=(г,м)=>new Date(Date.UTC(г,м,0)).toISOString().slice(0,10);

  // 1. Обслуживание приборов по плану ППР. Точной даты в плане нет, есть
  // месяц — сроком берём последний день этого месяца.
  if(позицииППР().length){
    (ППР.годы||[]).forEach(г=>{
      for(let м=1;м<=12;м++){
        const срок=посл(г,м);
        if(!вокне(срок)) continue;
        работыМесяца(г,м).forEach(р=>{
          из.push({ид:"ППР|"+р.поз.id+"|"+г+"|"+м, источник:"ППР",
            что:"Обслуживание "+р.поз.вид+": "+р.поз.наименование,
            срок:срок, горизонт:"месяц", часы:р.часы,
            сделано:!!р.отм, когда:(р.отм&&р.отм.выполнено)||"",
            куда:"plan"});
        });
      }
    });
  }
  // 2. Поверка приборов (списанные не представляют — задачи по ним нет)
  приборыВДокументы().forEach(п=>{
    if(!вокне(п.поверка_до)) return;
    из.push({ид:"СИ|"+п.id, источник:"Поверка",
      что:"Поверка: "+п.наименование+(п.зав?(", зав. № "+п.зав):""),
      срок:п.поверка_до, горизонт:"год", сделано:false, куда:"si"});
  });
  // 3. Сроки самой лаборатории
  const л=getЛаб();
  if(вокне(л.свид_до)) из.push({ид:"ЛАБ|аттестация", источник:"Лаборатория",
    что:"Заканчивается аттестация ЛНК", срок:л.свид_до, горизонт:"год",
    сделано:false, куда:"lab"});
  if(вокне(л.проверка)) из.push({ид:"ЛАБ|проверка", источник:"Лаборатория",
    что:"Плановая проверка ЛНК", срок:л.проверка, горизонт:"год",
    сделано:false, куда:"lab"});

  // 4. Инструктаж по охране труда — раз в 90 дней, для тех, у кого
  // внесена дата последнего. Без даты — задачу не из чего построить,
  // это видно только в «Проверке данных».
  live(P).forEach(c=>{
    const до=инструктажДо(c.инструктаж_дата);
    if(!вокне(до)) return;
    из.push({ид:"ИНСТР|"+c.id, источник:"Специалисты",
      что:"Инструктаж по охране труда: "+(c.вдок||c.фио), срок:до, горизонт:"квартал",
      сделано:false, куда:"people"});
  });

  // 5. Обучение по работе в ограниченных и замкнутых пространствах —
  // раз в 3 года, для тех, у кого внесена дата последнего.
  live(P).forEach(c=>{
    const до=огрПространстваДо(c.огр_простр_дата);
    if(!вокне(до)) return;
    из.push({ид:"ОГРПР|"+c.id, источник:"Специалисты",
      что:"Обучение по работе в ограниченных и замкнутых пространствах: "+(c.вдок||c.фио),
      срок:до, горизонт:"год", сделано:false, куда:"people"});
  });

  // 6. Экзамен по электробезопасности — раз в год, для тех, у кого
  // внесена дата последнего.
  live(P).forEach(c=>{
    const до=электробезДо(c.эл_безоп_дата);
    if(!вокне(до)) return;
    из.push({ид:"ЭЛБЕЗ|"+c.id, источник:"Специалисты",
      что:"Экзамен по электробезопасности: "+(c.вдок||c.фио),
      срок:до, горизонт:"год", сделано:false, куда:"people"});
  });

  // 7. Инструктаж по пожарной безопасности — раз в полгода, для тех, у
  // кого внесена дата последнего.
  live(P).forEach(c=>{
    const до=пожбезДо(c.пожбез_дата);
    if(!вокне(до)) return;
    из.push({ид:"ПОЖБЕЗ|"+c.id, источник:"Специалисты",
      что:"Инструктаж по пожарной безопасности: "+(c.вдок||c.фио),
      срок:до, горизонт:"полугодие", сделано:false, куда:"people"});
  });

  // 8. Проверка знаний правил безопасности — раз в 3 года, для тех, у
  // кого известна последняя дата проверки.
  live(P).forEach(c=>{
    const до=пбДо(c);
    if(!вокне(до)) return;
    из.push({ид:"ПБ|"+c.id, источник:"Специалисты",
      что:"Проверка знаний правил безопасности: "+(c.вдок||c.фио),
      срок:до, горизонт:"год", сделано:false, куда:"people"});
  });

  // 9. Рапорт на сдачу классности — за месяц до даты окончания (заказчик
  // указал срок прямо). Одна задача на каждую запись классности с
  // заполненной датой окончания, не на специалиста в целом — направлений
  // может быть несколько, у каждого свой срок.
  live(P).forEach(c=>классность(c).forEach((к,i)=>{
    if(!к.дата_окончания) return;
    const d=new Date(к.дата_окончания+"T00:00:00"); d.setMonth(d.getMonth()-1);
    const срокРапорта=d.toISOString().slice(0,10);
    if(!вокне(срокРапорта)) return;
    из.push({ид:"КЛАСС|"+c.id+"|"+i, источник:"Специалисты",
      что:"Рапорт на сдачу классности ("+[к.направление,к.класс].filter(Boolean).join(", ")+"): "+(c.вдок||c.фио),

// ── Повторяющиеся задачи ──────────────────────────────────
// «Раз в месяц сверять журнал с архивом» — заводить двенадцать раз незачем.
// Когда задачу принимают, программа создаёт следующую с тем же текстом и
// сдвинутым сроком. Так же, как в плане ППР, только для своих задач.
const ПОВТОРЫ=[["","не повторять"],["неделя","каждую неделю"],["месяц","каждый месяц"],
               ["квартал","каждый квартал"],["полугодие","каждое полугодие"],["год","каждый год"]];
function сдвинутьДату(дата, шаг){
  const d=new Date(дата+"T00:00:00");
  if(шаг==="неделя")         d.setDate(d.getDate()+7);
  else if(шаг==="месяц")     d.setMonth(d.getMonth()+1);
  else if(шаг==="квартал")   d.setMonth(d.getMonth()+3);
  else if(шаг==="полугодие") d.setMonth(d.getMonth()+6);
  else if(шаг==="год")       d.setFullYear(d.getFullYear()+1);
  else return "";
  return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10);
}
function продолжитьПовтор(з){
  if(!з.повтор || !з.срок) return null;
  const след=сдвинутьДату(з.срок, з.повтор);
  if(!след) return null;
  if(з.повтор_до && след>з.повтор_до) return null;
  // защита от задвоения: если следующая уже есть, второй раз не создаём
  const есть=ЗАД.some(x=>!x.удалено && x.родитель===(з.родитель||з.id) && x.срок===след);
  if(есть) return null;
  const нов=Object.assign({}, з, {
    id:newId("ЗД"), срок:след, статус:"назначена",
    родитель:з.родитель||з.id,
    принято:"", выполнено:"", проверено:"", причина_возврата:"",
    срок_первый:"", переносы:[], заметки:[],
    создано:new Date().toISOString(), изменено:new Date().toISOString(),
    место_правки:getWS().код, удалено:""
  });
  ЗАД.push(нов); saveReg(REG_ЗАД,ЗАД);
  return нов;
}

function сдвигПериода(шаг){
  const [с]=границыПериода(зф.период, зф.база);
  const d=new Date(с+"T00:00:00");
  if(зф.период==="день")      d.setDate(d.getDate()+шаг);
  else if(зф.период==="неделя")    d.setDate(d.getDate()+7*шаг);
  else if(зф.период==="месяц")     d.setMonth(d.getMonth()+шаг);
  else if(зф.период==="квартал")   d.setMonth(d.getMonth()+3*шаг);
  else if(зф.период==="полугодие") d.setMonth(d.getMonth()+6*шаг);
  else d.setFullYear(d.getFullYear()+шаг);
  зф.база=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10);
  renderTasks();
}

// Сортировка списка задач — тот же приём, что у журнала: состояние в
// localStorage, стрелка на заголовке. Выбранная колонка идёт первым
// ключом, срок — вторым (стабильный порядок при равных значениях,
// раньше было единственным ключом).
let здсорт=(function(){ try{ const r=localStorage.getItem("lnk_tsort");
  if(r){ const o=JSON.parse(r); if(o&&o.c) return {c:o.c,d:o.d===1?1:-1}; } }catch(e){}
  return {c:"срок", d:1}; })();
function здсортSave(){ try{ localStorage.setItem("lnk_tsort",JSON.stringify(здсорт)); }catch(e){} }
function sortTasks(c){
  if(здсорт.c===c) здсорт.d=-здсорт.d; else { здсорт.c=c; здсорт.d=1; }
  здсортSave(); renderTasks();
}
function задачаКлюч(з,c){
  switch(c){
    case "что": return з.что||"";
    case "исполнитель": return з.исполнитель||"";
    case "горизонт": return (ГОРИЗОНТЫ.find(x=>x[0]===з.горизонт)||["",""])[1];
    case "состояние": return состТекст(з);
    default: return з.срок||"";
  }
}
function задачиПериода(){
  const q=(query||"").toLowerCase();
  return ЗАД.filter(з=>!з.удалено)
    .filter(з=>вПериоде(з.срок, зф.период, зф.база))
    .filter(з=>!зф.статус || з.статус===зф.статус)
    .filter(з=>!зф.исполнитель || з.исполнитель===зф.исполнитель)
    .filter(з=>!q || ((з.что||"")+(з.подробно||"")+(з.объект||"")+(з.исполнитель||"")).toLowerCase().includes(q))
    .sort((a,b)=>{
      const A=String(задачаКлюч(a,здсорт.c)||""), B=String(задачаКлюч(b,здсорт.c)||"");
      if(!A && !B) return 0;
      if(!A) return 1;
      if(!B) return -1;
      const cmp=A.localeCompare(B,"ru",{numeric:true})*здсорт.d;
      return cmp || String(a.срок||"").localeCompare(String(b.срок||""));
    });
}

}

  const сегодня=new Date().toISOString().slice(0,10);
  if(новый==="принята")  з.принято=сегодня;
  if(новый==="выполнена"){ з.выполнено=сегодня; з.причина_возврата=""; }
  if(новый==="закрыта")  з.проверено=сегодня;
  отметитьЗадачу(з);
  if(новый==="закрыта"){
    const сл=продолжитьПовтор(з);
    if(сл) toast("Следующая задача создана на "+ru(сл.срок));
  }
  editTask(id);
}
// Заметки по ходу работы — свободный лог, отдельно от причины возврата
// (та одна и привязана к конкретному отказу). Добавляются с любого места,
// не только постановщиком — по ходу дела может пригодиться и исполнителю.
function блокЗаметок(з){
  const сп=(з.заметки||[]).slice().reverse();
  return `<div class="sect" style="margin-top:14px">Заметки по ходу работы</div>
    ${сп.length?`<div class="plist">`+сп.map(n=>`
      <div class="pr" style="cursor:default"><span class="num" style="flex:0 0 90px">${ru(n.когда)}</span>
        <span class="g">${esc(n.текст)}</span>
        <span class="muted" style="font-size:11.5px">${esc(n.место||"")}</span></div>`).join("")+`</div>`
      :`<div class="note">Заметок ещё нет.</div>`}
    <button class="btn small" type="button" style="margin-top:6px" onclick="добавитьЗаметку('${esc(з.id)}')">+ Заметка</button>`;
}
function добавитьЗаметку(id){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  const текст=prompt("Заметка:"); if(!текст) return;
  з.заметки=(з.заметки||[]).concat([{текст:текст.trim(),
    когда:new Date().toISOString().slice(0,10), место:getWS().код}]);
  отметитьЗадачу(з); editTask(id);
}
function вернутьЗадачу(id){
  const п=prompt("Причина возврата на доработку:");
  if(п===null) return;
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  з.статус="доработка"; з.причина_возврата=п; з.выполнено="";
  отметитьЗадачу(з); editTask(id);
}
function перенестиДиалог(id){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  const н=prompt("Новый срок (ГГГГ-ММ-ДД):", з.срок||"");
  if(!н) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(н)){ toast("Дата в виде ГГГГ-ММ-ДД"); return; }
  const п=prompt("Причина переноса (можно пропустить):")||"";
  перенести(id,н,п); editTask(id);
}
function saveTask(id){
  const v=k=>{const el=document.getElementById(k);return el?el.value.trim():"";};
  const что=v("t_что");
  if(!что){ toast("Напишите, что сделать"); return; }
  const з=id?ЗАД.find(x=>x.id===id):null;
  const поля={что:что, подробно:v("t_подробно"), объект:v("t_объект"), срок:v("t_срок"),
    горизонт:v("t_горизонт"), исполнитель:v("t_исполнитель"), место:v("t_место"),
    повтор:v("t_повтор"), повтор_до:v("t_повтор_до")};
  if(з){
    // Смена срока через форму — тоже перенос, с сохранением истории
    if(поля.срок && з.срок && поля.срок!==з.срок){
      if(!з.срок_первый) з.срок_первый=з.срок;
      з.переносы=(з.переносы||[]).concat([{было:з.срок, стало:поля.срок, причина:"правка",
        когда:new Date().toISOString().slice(0,10)}]);
    }
    Object.assign(з,поля); отметитьЗадачу(з);
  } else {
    ЗАД.push(Object.assign({id:newId("ЗД"), статус:"назначена",
      постановщик:getWS().код, создано:new Date().toISOString(),
      изменено:new Date().toISOString(), место_правки:getWS().код}, поля));
    saveReg(REG_ЗАД,ЗАД);
  }
  формаСохранена(); switchView("tasks"); toast(id?"Задача изменена":"Задача поставлена");
}
function delTask(id){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  if(!confirm("Удалить задачу «"+(з.что||"")+"»?\n\nУдаление перенесётся на другие места при обмене.")) return;
  з.удалено=new Date().toISOString(); отметитьЗадачу(з);
  switchView("tasks"); toast("Задача удалена");
}

// Отчёт за период. Форма отчёта заказчиком ещё не прислана, поэтому здесь
// внутренний вид: числа, разбивка и список невыполненного. Как пришлют
// образец — сделаю по нему, как акт.
// Дней просрочки — общая мерка и для своих задач, и для производных
// (у тех вместо статуса — просто «сделано»/срок).
function днейПросрочки(срок, сделано){
  const сегодня=new Date().toISOString().slice(0,10);
  if(сделано || !срок || срок>=сегодня) return 0;
  return Math.round((new Date(сегодня)-new Date(срок))/86400000);
}

      невыполненного (свои задачи и план ППР/поверки/сроки лаборатории — вместе, по просрочке).</div>

      <div class="tile ${и.просрочено?"bad":"ok"}"><div class="n">${и.просрочено}</div><div class="l">просрочено</div></div>
      ${произв.length?`<div class="tile ${ип.просрочено?"bad":(ип.сделано===ип.всего?"ok":"")}">
        <div class="n">${ип.сделано}/${ип.всего}</div><div class="l">из плана и сроков</div></div>`:""}
    </div>
    <div class="cols">
      <div class="panel"><h3>По исполнителям</h3>
        ${Object.keys(поИсп).length?`<div class="plist">`+Object.keys(поИсп).sort().map(к=>{

// ── Паспорт ЛНК (СДАНК-01-2020, Приложение 3) ──────────────
// Разделы 1-5 собираются из настоящих данных: карточки лаборатории,
// справочника специалистов (с аттестациями) и справочника приборов.
// Разделы 6-11 форма требует, а данных для них в программе нет —
// НЕ выдумываю: печатаются заголовки разделов с честной пометкой,
// что заполнить нечем, а не пустые таблицы, которые выглядели бы как
// «в лаборатории этого нет».
function специалистДляПаспорта(сп){
  const атт=аттестации(сп);
  const методСтрока=атт.length ? атт.map(а=>{
    let s=(а.метод||"—");
    if(а.уровень) s+=" ур."+а.уровень;
    if(а.объекты) s+=" ("+а.объекты+")";
    return s;
  }).join("; ") : "";
  const аттДаты=атт.length ? атт.map(а=>{
    let s=[];
    if(а.вид) s.push(а.вид.toLowerCase());
    if(а.дата) s.push("аттестован "+ru(а.дата));
    if(а.номер) s.push("уд. № "+а.номер+(а.дата_выдачи?(" от "+ru(а.дата_выдачи)):""));
    if(а.орган) s.push(а.орган);
    if(а.до) s.push("до "+ru(а.до));
    return s.join(", ");
  }).join("; ") : "";
  const пбз=пб(сп);
  const пбСтрока=пбз && пбз.номер
    ? ("ПБ: уд. № "+пбз.номер+(пбз.дата?(" от "+ru(пбз.дата)):"")) : "";
  return {
    фио: типографика(сп.фио||сп.вдок||""),
    основание: "по основному месту работы",
    должность: типографика([сп.должность, сп.функции, методСтрока].filter(Boolean).join(" · ")),
    образование: типографика([сп.образование, сп.стаж ? ("стаж по НК с "+сп.стаж) : ""]
      .filter(Boolean).join("; ")),
    аттестация: типографика([аттДаты, пбСтрока].filter(Boolean).join("; "))
  };
}
// Категория прибора определяет, в какой из разделов 5–8 паспорта (одна и
// та же Форма 2 СДАНК-01-2020) он попадёт. У записей без категории (старые,
// заведённые до этого поля, или из журнала/приборов, где категория не
// заполнялась) считаем «Средство НК» — иначе раздел 5 внезапно опустеет.
// Импорт из Excel не проверяет текст категории против списка (это select
// только в форме ручного ввода) — опечатка или лишний пробел в файле дадут
// значение, которого нет в КАТЕГОРИИ_СИ. Без этой подстраховки такой прибор
// не попал бы НИ В ОДИН из разделов 5-8 паспорта: прТабл()/прТаблWord()
// берут только 4 канонических ключа, а неопознанное значение осело бы в
// незнакомом ключе группировки и осталось бы невидимым молча.
function приборКатегория(x){
  return (x.категория && КАТЕГОРИИ_СИ.includes(x.категория)) ? x.категория : "Средство НК";
}
function приборыПоКатегориям(){
  const г={}; КАТЕГОРИИ_СИ.forEach(к=>г[к]=[]);
  // Списанные в паспорт не идут (см. приборыВДокументы) — разделы 5-8
  // перечисляют оборудование, которое у лаборатории есть.
  приборыВДокументы().forEach(x=>{ const к=приборКатегория(x); if(!г[к]) г[к]=[]; г[к].push(x); });
  return г;
}
// Заказчик попросил делить оборудование (разделы 5-8) и нормативные
// документы (раздел 9) паспорта на подгруппы по методу контроля —
// список упорядочен как METHODS (порядок журнала), группа без метода
// (свободный текст не из списка или вовсе пусто) — последней, отдельно.
// Общая функция для обоих разделов, поле для группировки — параметром,
// у прибора и у норм. документа оно называется одинаково («метод»), но
// незачем это жёстко зашивать.
// Общая группировка по полю с фиксированным порядком значений (список
// значений — параметром, не зашит): приборы — по METHODS, норм. документы
// раздела 9 — по НД_КАТЕГОРИИ (девять содержательных групп из настоящего
// паспорта, не по методу — там смесь предмета и метода, простой METHODS
// не подходит). Значение не из списка (пусто, опечатка, старая запись без
// поля) — в отдельную группу с ключом "" последней, не пропадает молча.
function группыПоПолю(список, поле, порядок){
  const группы={};
  список.forEach(x=>{
    const зн=x[поле];
    const ключ=(зн && порядок.includes(зн)) ? зн : "";
    (группы[ключ]=группы[ключ]||[]).push(x);
  });
  const из=[];
  порядок.forEach(зн=>{ if(группы[зн]) из.push([зн, группы[зн]]); });
  if(группы[""]) из.push(["", группы[""]]);
  return из;
}
function группыПоМетоду(список, методПоле){
  return группыПоПолю(список, методПоле||"метод", METHODS);
}
function группыНдПоКатегории(список){
  return группыПоПолю(список, "категория", НД_КАТЕГОРИИ);
}

// Таблицы паспорта — с рамками (в отличие от таблицы подписей акта, где
// рамок нет). Шрифт в ячейках чуть мельче основного текста (sz 24 = 12 пт
// против sz 28 = 14 пт) — так же, как на экране .doctbl мельче .aktp.
const КЕГЛЬ_ТАБЛ='<w:sz w:val="24"/><w:szCs w:val="24"/>';
function rPrТабл(жирный){ return '<w:rPr>'+ФОНТ+(жирный?'<w:b/>':'')+КЕГЛЬ_ТАБЛ+'</w:rPr>'; }
// Через разбор степеней — поэтому надстрочные работают в ЛЮБОЙ таблице
// документа (паспорт, план ППР, заявка на поверку), а не только там, где
// это вспомнили вызвать. Без степеней разбор возвращает один кусок, то
// есть ровно прежний единственный ран. Порядок элементов CT_RPr:
// rFonts → b → sz → szCs → vertAlign (см. правило про порядок в OOXML).
function wRunТабл(t,жирный){
  return разбитьСтепени(t).map(ч=>
    '<w:r><w:rPr>'+ФОНТ+(жирный?'<w:b/>':'')+КЕГЛЬ_ТАБЛ+
    (ч.степень?'<w:vertAlign w:val="superscript"/>':'')+'</w:rPr>'+
    '<w:t xml:space="preserve">'+X(ч.т)+'</w:t></w:r>').join('');
}
function wГраницыТабл(){
  const атр='w:val="single" w:sz="4" w:space="0" w:color="808080"';
  return ['top','left','bottom','right','insideH','insideV']
    .map(с=>'<w:'+с+' '+атр+'/>').join('');
}
// центр — выравнивание по центру и по высоте (нужно паспорту, заказчик
// попросил явно); по умолчанию false — старое поведение (слева/сверху),
// чтобы не тронуть план ППР, который делит эти же функции с паспортом.
// серый — заливка строки-шапки; по умолчанию true (старое поведение,
// план ППР); паспорт передаёт false — заказчик попросил убрать.
function wЯчейкаТабл(t, ш, шапка, центр, серый){
  серый=серый!==false;
  return '<w:tc><w:tcPr><w:tcW w:w="'+ш+'" w:type="dxa"/>'+
    (шапка&&серый?'<w:shd w:val="clear" w:color="auto" w:fill="F0F0F0"/>':'')+
    '<w:tcMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/>'+
    '<w:top w:w="40" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/></w:tcMar>'+
    (центр?'<w:vAlign w:val="center"/>':'')+'</w:tcPr>'+
    '<w:p><w:pPr><w:spacing w:after="0" w:line="260" w:lineRule="exact"/>'+
    '<w:jc w:val="'+(центр?"center":"left")+'"/>'+rPrТабл(шапка)+'</w:pPr>'+(t?wRunТабл(t,шапка):'')+'</w:p></w:tc>';
}
function wСтрокаТабл(ячейки, ширины, шапка, центр, серый){
  return '<w:tr>'+(шапка?'<w:trPr><w:tblHeader/></w:trPr>':'')+
    ячейки.map((t,i)=>wЯчейкаТабл(t,ширины[i],шапка,центр,серый)).join('')+'</w:tr>';
}
// Таблица с шапкой (специалисты, приборы): первая строка — заголовки.
function wТаблШапка(шапка, ширины, строки, центр, серый){
  const grid=ширины.map(ш=>'<w:gridCol w:w="'+ш+'"/>').join('');
  let из='<w:tbl><w:tblPr><w:tblW w:w="'+ШИРИНА_ТЕКСТА+'" w:type="dxa"/>'+
    '<w:tblBorders>'+wГраницыТабл()+'</w:tblBorders>'+
    '<w:tblLayout w:type="fixed"/>'+
    '<w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar>'+
    '</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>';
  из+=wСтрокаТабл(шапка,ширины,true,центр,серый);
  строки.forEach(р=>из+=wСтрокаТабл(р,ширины,false,центр,серый));
  из+='</w:tbl>';
  return из;
}
// Таблица «метка — значение» (раздел 1): без строки заголовка, пустые
// значения пропускаются — как ryed() в экранной версии. Только паспорт,
// поэтому всегда по центру/середине.
function wТаблКВ(строки){
  const ШК=2800, ШЗ=ШИРИНА_ТЕКСТА-ШК, ширины=[ШК,ШЗ];
  const grid='<w:gridCol w:w="'+ШК+'"/><w:gridCol w:w="'+ШЗ+'"/>';
  let из='<w:tbl><w:tblPr><w:tblW w:w="'+ШИРИНА_ТЕКСТА+'" w:type="dxa"/>'+
    '<w:tblBorders>'+wГраницыТабл()+'</w:tblBorders>'+
    '<w:tblLayout w:type="fixed"/>'+
    '<w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar>'+
    '</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>';
  строки.filter(([,v])=>v).forEach(([k,v])=>из+=wСтрокаТабл([k,v],ширины,false,true));
  из+='</w:tbl>';
  return из;
}
// Разрыв раздела для смены ориентации страницы внутри одного документа
// (паспорт ЛНК: разделы 1-4 и лист ознакомления книжные, 5-11 альбомные
// — там таблицы шире, реального оборудования много колонок). В OOXML
// sectPr внутри pPr абзаца задаёт свойства СЕКЦИИ, ЗАКАНЧИВАЮЩЕЙСЯ этим
// абзацем — не следующей. Абзац больше ничего не содержит: минимальный
// pPr с одним sectPr не может столкнуться по порядку элементов с другими
// свойствами абзаца, поэтому безопасен для схемы, что бы её валидатор ни
// проверял (тот же trap, что уже три раза ловил на порядке OOXML).
// Нумерация страниц (заказчик попросил: все страницы, кроме первой,
// по центру сверху) — та же схема, что уже была у акта: `w:titlePg` на
// секции, заканчивающейся первой страницей документа, «first»-шапка для
// неё пустая (без номера), «default»-шапка — у всех остальных, с полем
// PAGE по центру. rId шапок общие для всех трёх секций паспорта (одни и
// те же два файла-шапки, ссылки просто переиспользуются).
function wРазрывРаздела(альбомная, титул){
  const pgSz = альбомная
    ? '<w:pgSz w:w="16838" w:h="11906" w:orient="landscape" w:code="9"/>'
    : '<w:pgSz w:w="11906" w:h="16838" w:code="9"/>';
  const шапки='<w:headerReference w:type="default" r:id="rId1"/>'+
    (титул?'<w:headerReference w:type="first" r:id="rId2"/>':'');
  return '<w:p><w:pPr><w:sectPr>'+шапки+pgSz+
    '<w:pgMar w:top="1134" w:right="1276" w:bottom="1134" w:left="1559" '+
    'w:header="567" w:footer="0" w:gutter="0"/>'+(титул?'<w:titlePg/>':'')+'</w:sectPr></w:pPr></w:p>';
}
function паспортВWord(){
  const {л,специалисты,объекты,методы,приборыГруппы,нд,помещения}=паспортДанные();
  const пусто=()=>wP("",{отступ:false});
  const т=типографика;
  const отв=(роль)=>{ const з=ответственный(л,роль); if(роль==="рук_лнк" && !з.фио && л.начальник) з.фио=л.начальник;
    return [з.фио,з.тел].filter(Boolean).join(" · "); };
  // Форма 2 СДАНК-01-2020 — одна таблица для разделов 5–8, различаются
  // только категорией прибора (см. прТабл в renderПаспорт, тот же набор колонок).
  // Разделы 5–11 альбомные (см. wРазрывРаздела ниже) — ширины колонок по
  // ШИРИНА_АЛЬБОМ через wТаблШапкаШир, тем же приёмом, что уже был у
  // плана ППР, не по ШИРИНА_ТЕКСТА (книжная), которую использует обычная
  // wТаблШапка — иначе табличная ширина (tblW) разойдётся с суммой gridCol.
  // Как и в HTML-версии (renderПаспорт, см. комментарий у прТабл) — деление
  // по методу отдельными таблицами с подзаголовком, две колонки поверки
  // вместо одной (в настоящем документе заголовок над обеими буквально
  // повторён, не объединённая ячейка — переношу как есть, без gridSpan).
  const прТаблWord=(список,пустоТекст)=>{
    if(!список.length) return wP(пустоТекст||"Пусто.",{отступ:false,курсив:true});
    return группыПоМетоду(список).map(([метод,строки])=>{
      let из=метод?wP(метод,{жирный:true,отступ:false}):"";
      из+=wТаблШапкаШир(
        ["№","Наименование, тип","Назначение","Изготовитель, зав.№, год, ввод в эксплуатацию",
         "Технические и метрологические характеристики","Владелец, основание владения",
         "№ документа о поверке, калибровке, аттестации",
         "Дата и срок действия документа или отметка о техническом состоянии"],
        [570,2165,1728,2011,2383,1536,1763,1847],
        строки.map((s,i)=>{
          const изгот=[s.изготовитель,s.зав?("зав. №"+s.зав):"",s.год_выпуска,
            s.дата_ввода?("введён в эксплуатацию "+ru(s.дата_ввода)):""].filter(Boolean).join(", ");
          const родитель=s.основной_ид ? S.find(p=>p.id===s.основной_ид) : null;
          const наим=т(s.наименование+(s.тип?(" · "+s.тип):""))+
            (родитель?(" (часть: "+т(родитель.наименование)+")"):"");
          return [String(i+1), наим, т(s.назначение||"")||"—",
            т(изгот)||"—", т(s.характеристики||"")||"—", т(s.владелец||"")||"—",
            [s.исправен==="Исправен"?"«И»":"",s.свидетельство,s.поверка_дата?ru(s.поверка_дата):""]
              .filter(Boolean).join(", ")||"—",
            s.поверка_до?ru(s.поверка_до):"—"];
        }), true, false);
      return из;
    }).join("");
  };

  let тело="";
  тело+=wP(т(л.организация||л.наименование||""),{jc:"center",отступ:false,курсив:true});
  тело+=wP("ПАСПОРТ",{jc:"center",жирный:true,отступ:false});
  тело+=wP("лаборатории неразрушающего контроля",{jc:"center",отступ:false});
  тело+=wP(т(л.наименование||""),{jc:"center",отступ:false});
  тело+=пусто();

  тело+=wПасРаздел(ПАС_РИМ[0]+". Общие данные");
  тело+=wТаблКВ([
    ["Юридическое лицо / ИП", т(л.организация||"")],
    ["Место и дата регистрации", т([л.место_рег,л.дата_рег?ru(л.дата_рег):""].filter(Boolean).join(", "))],
    ["Адрес места деятельности", т(л.адрес||"")],
    ["Реквизиты", т(л.реквизиты||"")],
    ["Телефон / сайт / почта", т([л.телефон,л.сайт,л.почта].filter(Boolean).join(" · "))],
    ["Должность руководителя юридического лица или ИП", т(л.рук_юл_должность||"")],
    ...РОЛИ_ЛАБ.map(([роль,подпись])=>[подпись, отв(роль)]),
    ["Сведения о наличии специальных разрешительных документов", т(л.разрешительные||"")]
  ]);

  // Раздел II — альбомный, каждый специалист на отдельном листе (заказчик
  // попросил явно): разрыв книжной секции 1 (раздел I, титульная — на ней
  // titlePg и пустая «first»-шапка, см. wРазрывРаздела) здесь, ПЕРЕД
  // заголовком раздела II — он открывает уже альбомную секцию.
  тело+=wРазрывРаздела(false, true);
  тело+=wПасРаздел(ПАС_РИМ[1]+". Данные о профессиональной квалификации сотрудников");
  if(специалисты.length){
    специалисты.forEach((с,i)=>{
      if(i>0) тело+='<w:p><w:pPr><w:pageBreakBefore/></w:pPr></w:p>';
      тело+=wТаблШапкаШир(["ФИО","Должность, функции, метод","Образование, стаж","Данные аттестации"],
        [2233,3774,4261,3735], [[с.фио,с.должность,с.образование,с.аттестация||"не внесена"]], true, false);
    });
  } else {
    тело+=wP("Справочник специалистов пуст.",{отступ:false,курсив:true});
  }
  // Конец альбомной секции 2 (раздел II) — снова книжная, для разделов III-IV.
  тело+=wРазрывРаздела(true, false);

  // Нумерация та же, что в области аттестации карточки лаборатории (см.
  // номерСДАНК) — «N.M Текст», не просто перечисление.
  const wСписокСДАНК=(сп,справочник)=> сп.length
    ? сп.map(x=>{ const н=номерСДАНК(справочник,x); return wP((н?н+" — ":"— ")+т(x),{отступ:false}); }).join("")
    : wP("Не отмечено ни одного пункта — заполните в карточке лаборатории.",{отступ:false,курсив:true});

  тело+=wПасРаздел(ПАС_РИМ[2]+". Объекты неразрушающего контроля");
  тело+=wСписокСДАНК(объекты,СДАНК_ОБЪЕКТЫ);

  тело+=wПасРаздел(ПАС_РИМ[3]+". Виды (методы) неразрушающего контроля");
  тело+=wСписокСДАНК(методы,СДАНК_МЕТОДЫ);

  // Разрыв раздела здесь задаёт СВОЙСТВА секции III-IV (книжная, не первая
  // — titlePg только у самой первой секции документа, см. раздел I выше) —
  // ориентация следующей секции (V-XI) определяется СЛЕДУЮЩИМ разрывом,
  // после раздела XI, перед листом ознакомления. Порядок в OOXML именно
  // такой, не перепутать (уже проверено на реальной вёрстке).
  тело+=wРазрывРаздела(false, false);
  тело+=wПасРаздел(ПАС_РИМ[4]+". Сведения об оснащённости средствами неразрушающего контроля");
  тело+=прТаблWord(приборыГруппы["Средство НК"]);

  тело+=wПасРаздел(ПАС_РИМ[5]+". Меры, контрольные (стандартные), настроечные образцы");
  тело+=прТаблWord(приборыГруппы["Мера, образец, настроечный образец"]);

  тело+=wПасРаздел(ПАС_РИМ[6]+". Дозиметрические и радиометрические средства измерений");
  тело+=прТаблWord(приборыГруппы["Дозиметрический или радиометрический СИ"],
    "В лаборатории дозиметрические и радиометрические средства измерения отсутствуют.");

  тело+=wПасРаздел(ПАС_РИМ[7]+". Вспомогательное оборудование и принадлежности");
  тело+=прТаблWord(приборыГруппы["Вспомогательное оборудование"]);

  тело+=wПасРаздел(ПАС_РИМ[8]+". Перечень нормативных технических и методических документов");
  тело+= нд.length
    ? (()=>{ let n=0, из="";
        группыНдПоКатегории(нд).forEach(([кат,список])=>{
          из+=wP(кат||"Прочие документы",{жирный:true,отступ:false});
          из+=wТаблШапкаШир(["№","Наименование документа","Обозначение","Издательство, разработчик","Место, год издания"],
            [772,4433,2161,3396,3241],
            список.map(x=>{ n++; return [String(n), т(x.наименование), x.обозначение||"—", т(x.издатель||"")||"—", x.место_год||"—"]; }), true, false);
        });
        return из;
      })()
    : wP("Справочник нормативных документов пуст.",{отступ:false,курсив:true});

  тело+=wПасРаздел(ПАС_РИМ[9]+". Помещения, используемые для проведения НК");
  тело+= помещения.length
    ? wТаблШапкаШир(["№","Идентификация","Назначение","Площадь, м²","Контр. параметры","Инж. сети","Основание владения"],
        [832,2644,2431,1657,2386,1429,2624],
        помещения.map((x,i)=>[String(i+1), т(x.идентификация), т(x.назначение||"")||"—", x.площадь||"—",
          т(x.параметры||"")||"—", т(x.сети||"")||"—", т(x.основание||"")||"—"]), true, false)
    : wP("Справочник помещений пуст.",{отступ:false,курсив:true});

  тело+=wПасРаздел(ПАС_РИМ[10]+". Передвижные лаборатории");
  тело+=wP("Данных в программе нет — при отсутствии передвижных лабораторий не заполняется.",{отступ:false,курсив:true});

  // Здесь разрыв задаёт свойства секции 5-11 (альбомная) — дальше, с листа
  // ознакомления, снова книжная (её задаёт финальный sectPr документа).
  тело+=wРазрывРаздела(true);

  тело+=wПасРаздел("Лист ознакомления сотрудников ЛНК");
  {
    const сп=live(P);
    тело+= сп.length
      ? wТаблШапка(["№","ФИО","Должность","Дата ознакомления","Подпись"],
          [707,1660,2230,2617,1857],
          сп.map((p,i)=>[String(i+1), т(p.фио||""), т(p.должность||"")||"—", "", ""]), true, false)
      : wP("Справочник специалистов пуст.",{отступ:false,курсив:true});
  }
  тело+=пусто();

  const НС='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '+
           'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  // Шапка с номером страницы (поле PAGE, по центру) — на всех страницах,
  // кроме самой первой; пустая шапка — только на первой (см. wРазрывРаздела).
  const пасШапкаНомер='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:hdr '+НС+'><w:p><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="exact"/>'+
    '<w:jc w:val="center"/>'+rPr(false)+'</w:pPr>'+
    '<w:fldSimple w:instr=" PAGE "><w:r>'+rPr(false)+'<w:t>2</w:t></w:r></w:fldSimple>'+
    '</w:p></w:hdr>';
  const пасШапкаПустая='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:hdr '+НС+'><w:p/></w:hdr>';
  const документ='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document '+НС+'><w:body>'+тело+
    '<w:sectPr><w:headerReference w:type="default" r:id="rId1"/>'+
    '<w:pgSz w:w="11906" w:h="16838" w:code="9"/>'+
    '<w:pgMar w:top="1134" w:right="1276" w:bottom="1134" w:left="1559" '+
    'w:header="567" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';

  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const файлы=[
    {имя:"[Content_Types].xml", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
      '<Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>'+
      '<Override PartName="/word/header2.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>'+
      '</Types>'},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="word/document.xml"/>'+
      '</Relationships>'},
    {имя:"word/_rels/document.xml.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/header" Target="header1.xml"/>'+
      '<Relationship Id="rId2" Type="'+R+'/header" Target="header2.xml"/>'+
      '</Relationships>'},
    {имя:"word/header1.xml", данные:пасШапкаНомер},
    {имя:"word/header2.xml", данные:пасШапкаПустая},
    {имя:"word/document.xml", данные:документ}
  ];
  dlBlob("Паспорт ЛНК.docx", zipStore(файлы));
  toast("Паспорт выгружен в Word");
}

// ── Проверка данных ───────────────────────────────────────
// Раздел отвечает на один вопрос: что в базе не сходится само с собой.
// Никаких оценок «правильно ли вы работаете» — только факты, которые
// видно из самих данных: дубль, пропуск, ссылка в никуда, пустое поле.
//
// Разделено на три уровня, и это важно. «Ошибка» — то, что не может
// быть верным ни при каких условиях. «Внимание» — то, что обычно
// означает недоделку, но может быть и нормой. «Наблюдение» — то, где
// я не знаю вашего порядка и потому НЕ называю это ошибкой, а просто
// показываю. Спорное в первые два уровня не попадает.
// Какие ключи памяти — это ДАННЫЕ (их обязана вмещать резервная копия),
// а какие — настройки рабочего места, которым в копии делать нечего.
// Нужно для самопроверки ниже: реестр, забытый при сборке копии, молчит
// и теряется только в тот день, когда копия понадобится. Так уже
// случилось с норм. документами и помещениями — они не попадали ни в
// копию, ни в обмен, и ошибку было видно только в коде.
const КЛЮЧИ_ДАННЫХ={ "lnk_obj":"объекты", "lnk_si":"приборы", "lnk_ppl":"специалисты",
  "lnk_akts":"акты", "lnk_ppr":"ппр", "lnk_podr":"подразделения", "lnk_padezh":"падежи",
  "lnk_tasks":"задачи", "lnk_nd":"нормдокументы", "lnk_pom":"помещения",
  "lnk_lab":"лаборатория", "lnk_metodiki":"методики", "lnk_docnames":"названия" };
const КЛЮЧИ_НАСТРОЕК=["lnk_ws","lnk_theme","lnk_jsort","lnk_psort","lnk_tsort","lnk_progsort",
  "lnk_last_backup","lnk_last_export","lnk_last_import","lnk_grant","lnk_fs"];
function реестрыМимоКопии(){
  let вКопии={};
  try{ вКопии=всеДанные(); }catch(e){ return []; }
  const мимо=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || k.indexOf("lnk_")!==0) continue;
      if(КЛЮЧИ_НАСТРОЕК.indexOf(k)>=0) continue;
      const поле=КЛЮЧИ_ДАННЫХ[k];
      if(поле && вКопии[поле]!==undefined) continue;
      // ключ журнала хранится отдельно и кладётся в копию своим полем
      if(k===STORE_KEY && вКопии["записи"]!==undefined) continue;
      мимо.push(k);
    }
  }catch(e){}
  return мимо;
}
function проверки(){
  const из=[];
  const доб=(ур,тема,текст,подробно)=>из.push({ур,тема,текст,подробно:подробно||[]});
  const L=liveJ();

  const мимо=реестрыМимоКопии();
  if(мимо.length) доб("ошибка","Сохранность данных",
    "Данные, которых нет в резервной копии: "+мимо.length,
    мимо.concat(["Эти данные не попадут ни в копию, ни в обмен между местами — "+
                 "скажите мне, я добавлю их в сборку."]));

  // ── Ошибки ──────────────────────────────────────────────
  const без=L.filter(z=>!z.дата);
  if(без.length) доб("ошибка","Журнал", без.length+" записей без даты контроля",
    без.slice(0,10).map(z=>z.id+" · "+(z.объект||"без объекта")));

  const безОб=L.filter(z=>!z.объект && !z.наименование);
  if(безОб.length) доб("ошибка","Журнал", безОб.length+" записей без объекта контроля",
    безОб.slice(0,10).map(z=>z.id+" · "+ru(z.дата)));

  const столк=проверитьСтолкновения();
  if(столк.length) доб("ошибка","Нумерация",
    "Один номер протокола у разных записей: "+столк.length, столк.slice(0,10));

  // Здесь и ниже про поверку — только по несписанным приборам: списанный
  // на поверку не представляют, его просроченный срок не недоработка, а
  // факт истории (заказчик подтвердил это правило отдельно).
  const прос=приборыВДокументы().filter(x=>{ const[c]=siStatus(x); return c==="bad"; });
  if(прос.length) доб("ошибка","Приборы", прос.length+" приборов с просроченной поверкой",
    прос.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")+" — до "+ru(x.поверка_до)));

  // Дубли карточек объектов: одинаковое наименование и одинаковый
  // непустой заводской ИЛИ регистрационный номер — двух карточек с одним
  // и тем же номером быть не может, это ошибка. Одинаковое наименование
  // совсем без номеров — не ошибка (может быть просто россыпь одинаковых
  // мелких объектов), только наблюдение: порядок заказчика неизвестен.
  const поНаим={};
  live(O).forEach(o=>{ const н=(o.наименование||"").trim(); if(!н) return;
    (поНаим[н]=поНаим[н]||[]).push(o); });
  const дублиНомер=[], дублиБезНомера=[];
  Object.keys(поНаим).forEach(н=>{
    const г=поНаим[н]; if(г.length<2) return;
    const поНомеру={};
    г.forEach(o=>{ [o.зав,o.рег].forEach(ном=>{ ном=String(ном||"").trim(); if(!ном) return;
      (поНомеру[ном]=поНомеру[ном]||[]).push(o); }); });
    Object.keys(поНомеру).forEach(ном=>{
      if(поНомеру[ном].length>1) дублиНомер.push("«"+н+"», номер «"+ном+"» — "+
        поНомеру[ном].length+" карточек");
    });
    const безНомера=г.filter(o=>!String(o.зав||"").trim() && !String(o.рег||"").trim());
    if(безНомера.length>1) дублиБезНомера.push("«"+н+"» без номеров — "+безНомера.length+" карточек");
  });
  if(дублиНомер.length) доб("ошибка","Объекты",
    "Один заводской/регистрационный номер у разных карточек: "+дублиНомер.length, дублиНомер.slice(0,10));
  if(дублиБезНомера.length) доб("наблюдение","Объекты",
    "Одинаковое наименование без заводского и регистрационного номера у нескольких карточек: "+
    дублиБезНомера.length+" случаев — разные объекты без номеров или лишние карточки, не знаю",
    дублиБезНомера.slice(0,10));

  // ── Аттестация персонала ────────────────────────────────
  // Главный вопрос проверки: имел ли человек право выполнять тот метод,
  // который стоит в журнале. Сверяем удостоверения с журналом, ничего не
  // домысливая: сравниваются дата контроля и срок действия аттестации.
  const сегодня=new Date().toISOString().slice(0,10);
  const просАтт=[];
  live(P).forEach(c=>аттестации(c).forEach(а=>{
    if(а.до && а.до<сегодня) просАтт.push((c.вдок||c.фио)+" · "+а.метод+
      (а.уровень?(" ур. "+а.уровень):"")+" — до "+ru(а.до));
  }));
  if(просАтт.length) доб("ошибка","Специалисты",
    просАтт.length+" аттестаций с истёкшим сроком", просАтт.slice(0,10));

  // Метод выполнен, а действующей аттестации на него у исполнителя нет
  const безАтт={};
  L.forEach(z=>methodsOf(z).forEach(м=>{
    const и=String((z.методы[м]||{}).исп||"").trim(); if(!и) return;
    const c=специалистПоИмени(и); if(!c) return;
    if(!аттестации(c).length) return;                 // аттестации ещё не внесены — не ошибка
    if(аттестацияНа(c, м, z.дата)) return;
    const к=и+" · "+м;
    безАтт[к]=(безАтт[к]||0)+1;
  }));
  const ключиБА=Object.keys(безАтт);
  if(ключиБА.length) доб("ошибка","Специалисты",
    "Метод выполнен без действующей аттестации: "+ключиБА.length+" сочетаний",
    ключиБА.slice(0,10).map(к=>к+" — записей: "+безАтт[к]));

  const скороАтт=[];
  live(P).forEach(c=>аттестации(c).forEach(а=>{
    if(!а.до || а.до<сегодня) return;
    const дней=Math.round((new Date(а.до)-new Date(сегодня))/86400000);
    if(дней<=60) скороАтт.push((c.вдок||c.фио)+" · "+а.метод+" — через "+дней+" дн.");
  }));
  if(скороАтт.length) доб("внимание","Специалисты",
    скороАтт.length+" аттестаций истекают в ближайшие два месяца", скороАтт);

  const безВнесённых=live(P).filter(c=>!аттестации(c).length);
  if(безВнесённых.length) доб("внимание","Специалисты",
    безВнесённых.length+" из "+live(P).length+" специалистов без внесённых аттестаций — "+
    "сверить журнал с удостоверениями нечем",
    безВнесённых.map(c=>c.вдок||c.фио));

  // Удостоверение о проверке знаний правил безопасности — отдельный от
  // квалификационного документ (СДАНК-02-2020, Приложение 6): без него
  // квалификационное недействительно. Если аттестации по методам НК
  // внесены, а этого удостоверения нет — не ошибка (могло не дойти
  // до внесения в программу), но отметить стоит.
  const безПБ=live(P).filter(c=>аттестации(c).length && !(пб(c)&&пб(c).номер));
  if(безПБ.length) доб("внимание","Специалисты",
    безПБ.length+" специалистов с аттестацией по методам НК без внесённого удостоверения ПБ",
    безПБ.map(c=>c.вдок||c.фио));

  // Проверка знаний ПБ — раз в 3 года, заказчик подтвердил напрямую (своего
  // срока в СДАНК-02-2020 нет). Считается от последней известной даты
  // (первичная выдача или последняя повторная проверка) — см. срокПБ.
  const простПБ=live(P).filter(c=>{ const д=пбДо(c); return д && д<сегодня; });
  if(простПБ.length) доб("ошибка","Специалисты",
    простПБ.length+" специалистов с просроченной проверкой знаний правил безопасности",
    простПБ.map(c=>(c.вдок||c.фио)+" — истёк "+ru(пбДо(c))));

  // Классность — обе даты вносятся вручную (своей формулы нет, см.
  // комментарий у блокКлассности). Запись без даты окончания при
  // заполненной дате сдачи — недоделка («внимание»); истёкшая дата
  // окончания — нарушение («ошибка»), как и у прочих сроков специалиста.
  const классБезОкончания=[];
  const простКласс=[];
  live(P).forEach(c=>классность(c).forEach(к=>{
    if(!к.направление && !к.класс && !к.дата_сдачи && !к.дата_окончания) return;
    if(к.дата_сдачи && !к.дата_окончания)
      классБезОкончания.push((c.вдок||c.фио)+" · "+[к.направление,к.класс].filter(Boolean).join(" · "));
    if(к.дата_окончания && к.дата_окончания<сегодня)
      простКласс.push((c.вдок||c.фио)+" · "+[к.направление,к.класс].filter(Boolean).join(" · ")+
        " — истёк "+ru(к.дата_окончания));
  }));
  if(классБезОкончания.length) доб("внимание","Специалисты",
    классБезОкончания.length+" записей классности без даты окончания",
    классБезОкончания);
  if(простКласс.length) доб("ошибка","Специалисты",
    простКласс.length+" записей классности с истёкшим сроком",
    простКласс);

  // Инструктаж по охране труда — раз в 90 дней (со слов заказчика).
  // Дата не внесена вовсе — не ошибка (мог пройти, просто не записали);
  // а вот просроченный срок — уже нарушение, как просроченная поверка.
  const безИнстр=live(P).filter(c=>!c.инструктаж_дата);
  if(безИнстр.length) доб("внимание","Специалисты",
    безИнстр.length+" из "+live(P).length+" специалистов без внесённой даты инструктажа по охране труда",
    безИнстр.map(c=>c.вдок||c.фио));
  const простИнстр=live(P).filter(c=>{ const д=инструктажДо(c.инструктаж_дата); return д && д<сегодня; });
  if(простИнстр.length) доб("ошибка","Специалисты",
    простИнстр.length+" специалистов с просроченным инструктажем по охране труда",
    простИнстр.map(c=>(c.вдок||c.фио)+" — истёк "+ru(инструктажДо(c.инструктаж_дата))));

  // Обучение по работе в ограниченных и замкнутых пространствах (группа I)
  // — раз в 3 года, со слов заказчика. Тот же принцип, что и инструктаж:
  // дата не внесена — «внимание» (могли не записать), просрочка — «ошибка».
  const безОгрПр=live(P).filter(c=>!c.огр_простр_дата);
  if(безОгрПр.length) доб("внимание","Специалисты",
    безОгрПр.length+" из "+live(P).length+" специалистов без внесённой даты обучения по работе "+
    "в ограниченных и замкнутых пространствах",
    безОгрПр.map(c=>c.вдок||c.фио));
  const простОгрПр=live(P).filter(c=>{ const д=огрПространстваДо(c.огр_простр_дата); return д && д<сегодня; });
  if(простОгрПр.length) доб("ошибка","Специалисты",
    простОгрПр.length+" специалистов с просроченным обучением по работе в ограниченных и замкнутых пространствах",
    простОгрПр.map(c=>(c.вдок||c.фио)+" — истёк "+ru(огрПространстваДо(c.огр_простр_дата))));

  // Экзамен по электробезопасности — специалисты являются электротехно-
  // логическим персоналом (со слов заказчика), периодичность раз в год.
  const безЭлектробез=live(P).filter(c=>!c.эл_безоп_дата);
  if(безЭлектробез.length) доб("внимание","Специалисты",
    безЭлектробез.length+" из "+live(P).length+" специалистов без внесённой даты экзамена по электробезопасности",
    безЭлектробез.map(c=>c.вдок||c.фио));
  const простЭлектробез=live(P).filter(c=>{ const д=электробезДо(c.эл_безоп_дата); return д && д<сегодня; });
  if(простЭлектробез.length) доб("ошибка","Специалисты",
    простЭлектробез.length+" специалистов с просроченным экзаменом по электробезопасности",
    простЭлектробез.map(c=>(c.вдок||c.фио)+" — истёк "+ru(электробезДо(c.эл_безоп_дата))));

  // Инструктаж по пожарной безопасности — раз в полгода, со слов заказчика.
  const безПожбез=live(P).filter(c=>!c.пожбез_дата);
  if(безПожбез.length) доб("внимание","Специалисты",
    безПожбез.length+" из "+live(P).length+" специалистов без внесённой даты инструктажа по пожарной безопасности",
    безПожбез.map(c=>c.вдок||c.фио));
  const простПожбез=live(P).filter(c=>{ const д=пожбезДо(c.пожбез_дата); return д && д<сегодня; });
  if(простПожбез.length) доб("ошибка","Специалисты",
    простПожбез.length+" специалистов с просроченным инструктажем по пожарной безопасности",
    простПожбез.map(c=>(c.вдок||c.фио)+" — истёк "+ru(пожбезДо(c.пожбез_дата))));

  // ── Лаборатория ─────────────────────────────────────────
  const л=getЛаб();
  if(!л.организация && !л.наименование) доб("внимание","Лаборатория",
    "Карточка лаборатории не заполнена — шапка акта останется пустой");
  if(л.свид_до && л.свид_до<сегодня) доб("ошибка","Лаборатория",
    "Аттестация лаборатории просрочена — до "+ru(л.свид_до));
  else if(л.свид_до){
    const дней=Math.round((new Date(л.свид_до)-new Date(сегодня))/86400000);
    if(дней<=90) доб("внимание","Лаборатория","Аттестация лаборатории истекает через "+дней+" дн.");
  }
  if(л.проверка && л.проверка>=сегодня){
    const дней=Math.round((new Date(л.проверка)-new Date(сегодня))/86400000);
    if(дней<=30) доб("внимание","Лаборатория","Плановая проверка ЛНК через "+дней+" дн.");
  }
  // Метод есть в области аттестации ЛНК, а аттестованных людей на него нет
  if((л.методы||[]).length){
    const нет=(л.методы||[]).filter(м=>!live(P).some(c=>аттестацияНа(c,м)));
    const естьХотьОдна=live(P).some(c=>аттестации(c).length);
    if(нет.length && естьХотьОдна) доб("внимание","Лаборатория",
      "Методы области аттестации без аттестованных специалистов: "+нет.join(", "));
  }
  // Метод применяется в журнале, а в области аттестации ЛНК его нет
  if((л.методы||[]).length){
    const применяются=[...new Set(L.flatMap(z=>methodsOf(z)))];
    const вне=применяются.filter(м=>(л.методы||[]).indexOf(м)<0);
    if(вне.length) доб("наблюдение","Лаборатория",
      "В журнале есть методы вне области аттестации ЛНК: "+вне.join(", "),
      ["Возможно, область в карточке заполнена не полностью — сверьте со свидетельством."]);
  }

  // ── Внимание ────────────────────────────────────────────
  const безП=приборыВДокументы().filter(x=>!x.поверка_до);
  if(безП.length) доб("внимание","Приборы",
    безП.length+" из "+приборыВДокументы().length+" приборов без даты поверки — срок не отслеживается",
    безП.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")));

  // Дубли приборов по заводскому номеру — «внимание», не «ошибка», как у
  // объектов: там одинаковый номер у разных карточек не может быть верным
  // физически, а у приборов заводской номер в реальных данных заказчика
  // не всегда уникален (инвентарный номер комплекта на несколько разных
  // инструментов — подтверждено на присланном паспорте, «№ 640» стоит
  // сразу у нескольких разных наборов). Пригодится и после импорта
  // «Приборы из паспорта.xlsx» — часть записей заведомо задвоится.
  const поЗавСИ={};
  live(S).forEach(x=>{ const зав=String(x.зав||"").trim(); if(!зав) return;
    (поЗавСИ[зав]=поЗавСИ[зав]||[]).push(x); });
  const дублиСИ=Object.keys(поЗавСИ).filter(зав=>поЗавСИ[зав].length>1);
  if(дублиСИ.length) доб("внимание","Приборы",
    "Один заводской номер у нескольких приборов: "+дублиСИ.length,
    дублиСИ.slice(0,10).map(зав=>"зав. № "+зав+" — "+поЗавСИ[зав].map(x=>x.наименование).join("; ")));

  // Категория прибора — статический список из 4 значений, но при импорте
  // из Excel текст ячейки против него не сверяется (проверка только в
  // форме ручного ввода, select). Опечатка или лишний пробел в файле дают
  // значение вне списка — приборКатегория() теперь подстраховывает такой
  // прибор в паспорте (не теряется), но саму опечатку в карточке стоит
  // поправить, поэтому показываю её здесь отдельно.
  const плохаяКат=live(S).filter(x=>x.категория && !КАТЕГОРИИ_СИ.includes(x.категория));
  if(плохаяКат.length) доб("внимание","Приборы",
    "Категория прибора не из списка (в паспорте показан как «Средство НК»): "+плохаяКат.length,
    плохаяКат.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")+" — «"+x.категория+"»"));

  // Месяц представления на поверку — тот же случай, что и категория:
  // при импорте из Excel текст ячейки со списком не сверяется. Здесь
  // цена ошибки выше — по этому полю прибор ОТБИРАЕТСЯ в заявку и
  // план-график, поэтому опечатка молча выкидывает его из обоих
  // документов, а не просто теряет подпись.
  // Отбор — ровно тот же месяцПрибора(), по которому прибор попадает в
  // документы: лишние пробелы он снимает сам, поэтому сюда попадают
  // только те значения, из-за которых прибор ДЕЙСТВИТЕЛЬНО выпадает.
  const плохойМесяц=приборыДляЗаявки().filter(x=>String(x.месяц_поверки||"").trim() && !месяцПрибора(x));
  if(плохойМесяц.length) доб("внимание","Приборы",
    "Месяц представления на поверку не из списка (прибор не попадёт в заявку и план-график): "+плохойМесяц.length,
    плохойМесяц.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")+" — «"+x.месяц_поверки+"»"));

  // Похоже на потерянную степень: сразу после «×10»/«·10» идут цифры
  // («200·103 мм» вместо «200·10^3 мм»). Уровень «наблюдение», не выше:
  // «умножить на 103» — тоже законная запись, просто редкая, а гадать за
  // вас я не буду (то же правило, что и у прочих спорных случаев).
  // Само это расхождение уже один раз случилось по моей вине — при
  // переносе характеристик из паспорта надстрочные знаки осыпались.
  const РЕ_ПОТЕРЯННАЯ=/(?:[×хx·*]\s?10)([0-9]{1,3})(?![0-9])/;
  const потерянная=live(S).filter(x=>РЕ_ПОТЕРЯННАЯ.test(String(x.характеристики||""))||
                                     РЕ_ПОТЕРЯННАЯ.test(String(x.назначение||"")));
  if(потерянная.length) доб("наблюдение","Приборы",
    "Возможно, потеряна степень после «×10»: "+потерянная.length,
    потерянная.slice(0,10).map(x=>{
      const т=String(x.характеристики||"")+" "+String(x.назначение||"");
      const m=т.match(РЕ_ПОТЕРЯННАЯ);
      return x.наименование+(x.зав?(" · зав. "+x.зав):"")+" — «"+(m?m[0]:"")+
             "»; если это степень, пишется «"+(m?m[0].replace(m[1],"^"+m[1]):"")+"»";
    }));

  // Неотъемлемая часть поверяется вместе с основным прибором (правило
  // заказчика), поэтому даты поверки у части и у основного обязаны
  // совпадать. Расхождение — «ошибка»: одно из двух значений заведомо
  // неверно, а по этим датам считается и статус в списке, и просрочка
  // в задачах. Пустые даты у части при заполненных у основного —
  // «внимание»: это скорее недозаполнение, чем противоречие.
  // Страховка: даты части выравниваются по основному прибору на всех
  // путях записи (сохранение карточки, импорт, обмен, загрузка), поэтому
  // сюда попасть уже неоткуда — но если когда-нибудь появится ещё один
  // путь записи, о котором я забуду, расхождение будет видно сразу, а не
  // разойдётся по документам молча (та же роль, что у реестрыМимоКопии).
  const частьРасх=[];
  live(S).forEach(x=>{
    if(!x.основной_ид) return;
    const осн=live(S).find(p=>p.id===x.основной_ид);
    if(!осн || осн.id===x.id) return;        // битую ссылку ловит проверка ниже
    const оД=String(осн.поверка_дата||"").trim(), оДо=String(осн.поверка_до||"").trim();
    const чД=String(x.поверка_дата||"").trim(), чДо=String(x.поверка_до||"").trim();
    if(чД===оД && чДо===оДо) return;
    частьРасх.push(x.наименование+(x.зав?(" · зав. "+x.зав):"")+
      " (часть «"+осн.наименование+"») — у части "+[чД?ru(чД):"—", чДо?ru(чДо):"—"].join(" / ")+
      ", у основного "+[оД?ru(оД):"—", оДо?ru(оДо):"—"].join(" / "));
  });
  if(частьРасх.length) доб("ошибка","Приборы",
    "Даты поверки части не совпадают с основным прибором: "+частьРасх.length,
    частьРасх.slice(0,10));

  // Состояние прибора — список из пяти значений, но импорт из Excel текст
  // ячейки со списком не сверяет (как у категории и месяца поверки).
  const плохоеСост=live(S).filter(x=>String(x.состояние||"").trim() &&
    !СОСТОЯНИЯ_СИ.includes(String(x.состояние).trim()));
  if(плохоеСост.length) доб("внимание","Приборы",
    "Состояние прибора не из списка: "+плохоеСост.length,
    плохоеСост.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")+
      " — «"+x.состояние+"»"));

  // Ссылка «неотъемлемая часть прибора» — на удалённую карточку (осталась
  // после удаления родителя) или сама на себя (испорченный импорт, форма
  // такое не даёт выбрать). И то и другое — не может быть верным.
  const S_ids=new Set(live(S).map(x=>x.id));
  const плохаяСсылка=live(S).filter(x=>x.основной_ид &&
    (x.основной_ид===x.id || !S_ids.has(x.основной_ид)));
  if(плохаяСсылка.length) доб("ошибка","Приборы",
    "Ссылка «неотъемлемая часть прибора» ведёт в никуда или сама на себя: "+плохаяСсылка.length,
    плохаяСсылка.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")));

  // Место хранения — ссылка на карточку помещения: она могла быть
  // удалена уже после того, как прибор к ней привязали (у подразделения
  // объекта и у «неотъемлемой части» такая же проверка).
  const ПОМ_ids=new Set(live(ПОМ).map(x=>x.id));
  const плохоеПом=live(S).filter(x=>String(x.хранение||"").trim() && !ПОМ_ids.has(x.хранение));
  if(плохоеПом.length) доб("ошибка","Приборы",
    "Место хранения ведёт на удалённое помещение: "+плохоеПом.length,
    плохоеПом.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")));

  // Подразделение у объекта — из него акт подставляет своё
  // подразделение сам (автоподразделениеАкта), а журнальная запись —
  // поле «заказывающее подразделение». Пока оно не проставлено, это
  // приходится вписывать в каждый документ руками, и узнаётся такое
  // только при открытии акта.
  const объИмя=o=>o.наименование+(o.зав?(" · зав. № "+o.зав):"")+(o.рег?(" · рег. № "+o.рег):"");
  const ПОДР_ids=new Set(live(ПОДР).map(x=>x.id));
  const подрВНикуда=live(O).filter(o=>o.подразделение && !ПОДР_ids.has(o.подразделение));
  if(подрВНикуда.length) доб("ошибка","Объекты",
    "Подразделение объекта ведёт на удалённую карточку: "+подрВНикуда.length,
    подрВНикуда.slice(0,10).map(объИмя));
  // Если подразделений не заведено вовсе — это ОДНА недоделка справочника,
  // а не 305 одинаковых замечаний по каждому объекту.
  const безПодр=live(O).filter(o=>!o.подразделение);
  if(!live(ПОДР).length){
    if(live(O).length) доб("внимание","Подразделения",
      "Справочник подразделений пуст, а объектов "+live(O).length+
      " — акт не сможет подставить подразделение сам, его придётся вписывать в каждый документ",
      ["Карточки заводятся в разделе «Подразделения», там же тип и реквизиты контракта по годам."]);
  } else if(безПодр.length) доб("внимание","Объекты",
    безПодр.length+" из "+live(O).length+" объектов без заказывающего подразделения",
    безПодр.slice(0,10).map(объИмя)
      .concat(["Подразделение ставится в карточке объекта — из него акт подставляет своё."]));

  // Метод контроля у нормативного документа — тоже select, тоже не
  // проверяется при импорте (та же история, что у категории приборов).
  // Здесь риска потерять запись нет (метод — только подпись и фильтр в
  // списке, не ключ группировки для печатной формы), но опечатку всё
  // равно стоит показать, иначе фильтр по методу её просто не найдёт.
  const плохойМетод=live(НД).filter(x=>x.метод && !METHODS.includes(x.метод));
  if(плохойМетод.length) доб("внимание","Норм. документы",
    "Метод контроля у документа не из списка: "+плохойМетод.length,
    плохойМетод.slice(0,10).map(x=>x.наименование+" — «"+x.метод+"»"));

  // Актуализация нормативных документов (раздел 9 паспорта): свой срока
  // действия документы не имеют, это внутренняя проверка — раз в год
  // сверять список с действующими изданиями. Дата не внесена — не
  // ошибка (могли ещё не проверять), а вот проверка старше года —
  // уже недоделка, как просроченная поверка.
  const ндБезПроверки=live(НД).filter(x=>!x.проверено);
  if(ндБезПроверки.length) доб("внимание","Норм. документы",
    ндБезПроверки.length+" из "+live(НД).length+" документов без даты проверки на актуальность",
    ндБезПроверки.slice(0,10).map(x=>x.наименование));
  const ндПросрочены=live(НД).filter(x=>x.проверено && ндАктуальноДо(x.проверено)<сегодня);
  if(ндПросрочены.length) доб("ошибка","Норм. документы",
    ндПросрочены.length+" документов не проверялись на актуальность больше года",
    ндПросрочены.slice(0,10).map(x=>x.наименование+" — проверен "+ru(x.проверено)));

  // Дубли нормативных документов по обозначению — то же рассуждение, что у
  // объектов: обозначение (номер ГОСТ, ФНП и т.п.) — официальный
  // идентификатор документа, у двух разных документов совпадать не должно.
  // Совпало обозначение И наименование — точно одна и та же карточка
  // введена дважды, это ошибка. Обозначение совпало, а наименование разное
  // — не гадаю (могла быть опечатка при вводе, а мог быть документ с тем
  // же номером у разных родов деятельности — такого в присланном списке не
  // встречалось, но исключать не берусь), это только наблюдение.
  const поОбознНД={};
  live(НД).forEach(x=>{ const о=String(x.обозначение||"").trim(); if(!о) return;
    (поОбознНД[о]=поОбознНД[о]||[]).push(x); });
  const ндДублиПолные=[], ндДублиОбозн=[];
  Object.keys(поОбознНД).forEach(о=>{
    const г=поОбознНД[о]; if(г.length<2) return;
    const поНаим={};
    г.forEach(x=>{ const н=String(x.наименование||"").trim(); (поНаим[н]=поНаим[н]||[]).push(x); });
    Object.keys(поНаим).forEach(н=>{ if(поНаим[н].length>1)
      ндДублиПолные.push("«"+н+"», обозначение «"+о+"» — "+поНаим[н].length+" карточек"); });
    if(Object.keys(поНаим).length>1) ндДублиОбозн.push("обозначение «"+о+"» — "+
      Object.keys(поНаим).map(н=>"«"+н+"»").join(", "));
  });
  if(ндДублиПолные.length) доб("ошибка","Норм. документы",
    "Один документ введён дважды (совпали наименование и обозначение): "+ндДублиПолные.length,
    ндДублиПолные.slice(0,10));
  if(ндДублиОбозн.length) доб("наблюдение","Норм. документы",
    "Одно обозначение у документов с разным наименованием: "+ндДублиОбозн.length,
    ндДублиОбозн.slice(0,10));

  // Дубли помещений по идентификации — как у объектов: номер помещения
  // физический (комната № 20 не может быть одновременно и другой комнатой),
  // поэтому совпадение — ошибка, а не законное совпадение вроде
  // инвентарного номера у приборов.
  const поИдПОМ={};
  live(ПОМ).forEach(x=>{ const и=String(x.идентификация||"").trim(); if(!и) return;
    (поИдПОМ[и]=поИдПОМ[и]||[]).push(x); });
  const помДубли=Object.keys(поИдПОМ).filter(и=>поИдПОМ[и].length>1);
  if(помДубли.length) доб("ошибка","Помещения",
    "Одна идентификация у нескольких помещений: "+помДубли.length,
    помДубли.slice(0,10).map(и=>"«"+и+"» — "+поИдПОМ[и].map(x=>x.назначение).join("; ")));

  // Пропуск в нумерации — обычно аннулированный протокол, но проверить стоит
  const дыры=[];
  METHODS.forEach(м=>{
    const поГодам={};
    L.forEach(z=>{ const н=номерМетода(z,м), г=годЗаписи(z);
      if(/^\d+$/.test(н) && г){ (поГодам[г]=поГодам[г]||new Set()).add(+н); } });
    Object.keys(поГодам).sort().forEach(г=>{
      const н=[...поГодам[г]], макс=Math.max(...н), есть=new Set(н), нет=[];
      for(let i=1;i<макс;i++) if(!есть.has(i)) нет.push(i);
      if(нет.length) дыры.push(м+" "+г+": пропущены "+нет.slice(0,15).join(", ")+
        (нет.length>15?(" …всего "+нет.length):""));
    });
  });
  if(дыры.length) доб("внимание","Нумерация",
    "Пропуски в сплошной нумерации: "+дыры.length, дыры.slice(0,10));

  const ждут=L.filter(ждётНомеров);
  if(ждут.length) доб("внимание","Нумерация", ждут.length+" записей ждут номера",
    ждут.slice(0,10).map(z=>ru(z.дата)+" · "+(z.объект||"")+" — "+методыБезНомера(z).join(", ")));

  let безИсп=[];
  L.forEach(z=>methodsOf(z).forEach(м=>{
    if(!String((z.методы[м]||{}).исп||"").trim())
      безИсп.push(ru(z.дата)+" · "+(z.объект||"")+" · "+м); }));
  if(безИсп.length) доб("внимание","Журнал",
    безИсп.length+" методов без исполнителя", безИсп.slice(0,10));

  const спр=new Set(); live(P).forEach(x=>{ if(x.вдок) спр.add(x.вдок.trim()); if(x.фио) спр.add(x.фио.trim()); });
  const чужие=new Set();
  L.forEach(z=>methodsOf(z).forEach(м=>{ const и=String((z.методы[м]||{}).исп||"").trim();
    if(и && !спр.has(и)) чужие.add(и); }));
  if(чужие.size) доб("внимание","Специалисты",
    "Исполнители из журнала, которых нет в справочнике: "+чужие.size, [...чужие].slice(0,10));

  // ── Наблюдения ──────────────────────────────────────────
  if(позицииППР().length){
    const завСИ=new Set(); live(S).forEach(x=>{ if(x.зав) завСИ.add(String(x.зав).trim()); });
    const нет=позицииППР().filter(п=>{
      const м=String(п.наименование||"").match(/№\s*([0-9A-Za-zА-Яа-я\-\/]+)/g)||[];
      return !м.some(x=>завСИ.has(x.replace(/^№\s*/,"")));
    });
    if(нет.length) доб("наблюдение","План ППР",
      нет.length+" позиций плана не нашлись в справочнике приборов по заводскому номеру",
      нет.slice(0,10).map(п=>п.наименование).concat(
        ["Возможно, так и должно быть: в справочнике — средства измерения, "+
         "а в плане ППР ещё и оснастка (меры, образцы, плиты). Не считаю ошибкой."]));
    if(ППР.замечания && ППР.замечания.length)
      доб("наблюдение","План ППР","Расхождения в книге плана-графика: "+ППР.замечания.length,
          ППР.замечания);
  }
  return из;
}
function числоПроблем(){
  return проверки().filter(x=>x.ур!=="наблюдение").length;
}

function renderCheck(){
  curView="check";
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.view==="check"));
  const сп=проверки();
  const счёт=у=>сп.filter(x=>x.ур===у).length;
  const знак={ошибка:"✕", внимание:"!", наблюдение:"·"};
  const блок=у=>{
    const свои=сп.filter(x=>x.ур===у);
    if(!свои.length) return "";
    return свои.map(x=>`
      <div class="пров ${у}">
        <div class="пг"><span class="пз">${знак[у]}</span>
          <b>${esc(x.тема)}</b><span class="пт">${esc(x.текст)}</span></div>
        ${x.подробно.length?`<ul class="пп">${x.подробно.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
      </div>`).join("");
  };
  const всёЧисто = !сп.length;
  document.getElementById("main").innerHTML=`
    ${printHead("Проверка данных", "на "+ru(new Date().toISOString().slice(0,10))+
      " · ошибок "+счёт("ошибка")+", внимания "+счёт("внимание"))}
    <div class="head">
      <h2>Проверка данных</h2>
      <span class="sub">что в базе не сходится само с собой</span>
      <div class="spring"></div>
      <button class="btn" onclick="exportПроверкуXlsx()">▤ Excel</button>
      <button class="btn" onclick="window.print()">⎙ PDF</button>
    </div>
    <div class="tiles">
      <div class="tile ${счёт("ошибка")?"bad":"ok"}"><div class="n">${счёт("ошибка")}</div><div class="l">ошибок</div></div>
      <div class="tile ${счёт("внимание")?"warn":"ok"}"><div class="n">${счёт("внимание")}</div><div class="l">требует внимания</div></div>
      <div class="tile"><div class="n">${счёт("наблюдение")}</div><div class="l">наблюдений</div></div>
    </div>
    ${всёЧисто?`<div class="card"><div class="empty" style="padding:30px">
      Расхождений не найдено: номера сплошные и без дублей, ссылки на объекты целы,
      обязательные поля заполнены.</div></div>`:""}
    ${счёт("ошибка")?`<h3 class="прз">Ошибки — так быть не может</h3>${блок("ошибка")}`:""}
    ${счёт("внимание")?`<h3 class="прз">Требует внимания — обычно недоделка, но бывает и нормой</h3>${блок("внимание")}`:""}
    ${счёт("наблюдение")?`<h3 class="прз">Наблюдения — вашего порядка не знаю, ошибкой не считаю</h3>${блок("наблюдение")}`:""}
    <div class="note noprint">Списки показаны до десяти строк — полный перечень выгружается в Excel.
      Проверка считается заново при каждом открытии раздела: исправили — пункт исчезнет.</div>`;
}
function exportПроверкуXlsx(){
  const строки=[];
  проверки().forEach(x=>{
    строки.push([x.ур, x.тема, x.текст, ""]);
    x.подробно.forEach(t=>строки.push(["", "", "", t]));
  });
  if(!строки.length) строки.push(["", "", "Расхождений не найдено", ""]);
  xlsxФайл("Проверка данных ЛНК "+сегодня()+".xlsx",[{имя:"Проверка",
    колонки:[{з:"Уровень",ш:14},{з:"Раздел",ш:16},{з:"Что найдено",ш:64},{з:"Подробности",ш:70}],
    строки:строки}]);
  toast("Проверка выгружена: "+строки.length+" строк");
}

function renderExchange(){
  const ws=getWS();
  const об=объёмХранилища(), дн=днейБезКопии();

// ── Выгрузка в Excel (.xlsx) ──────────────────────────────
// Раньше выгружался CSV. В Office 2016 это лотерея: разделитель столбцов
// CSV берёт из региональных настроек Windows, и на другой машине файл
// открывается одной колонкой. Плюс даты и числа приезжают текстом.
// Настоящий .xlsx — это тот же ZIP, что и .docx, писать его умеем.
//
// Строки кладём прямо в ячейки (inlineStr), без общей таблицы строк:
// файл чуть больше, зато собирается в один проход и не может разъехаться.
const XL_ЭПОХА = Date.UTC(1899,11,30);          // Excel считает дни от 30.12.1899
function xlДата(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||"")); if(!m) return null;
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-XL_ЭПОХА)/86400000);
}
function xlБуква(n){                             // 1 → A, 27 → AA
  let s=""; while(n>0){ const о=(n-1)%26; s=String.fromCharCode(65+о)+s; n=(n-о-1)/26; }
  return s;
}
function xlЯчейка(адрес, знач, тип){
  if(знач==null || знач==="") return "";
  if(тип==="дата"){
    const д=xlДата(знач);
    if(д!=null) return '<c r="'+адрес+'" s="2"><v>'+д+'</v></c>';
  }
  if(тип==="число"){
    const ч=Number(String(знач).replace(",","."));
    if(isFinite(ч) && String(знач).trim()!=="") return '<c r="'+адрес+'"><v>'+ч+'</v></c>';
  }
  return '<c r="'+адрес+'" t="inlineStr"><is><t xml:space="preserve">'+X(знач)+'</t></is></c>';
}
function xlЛист(лист){
  const кол=лист.колонки, N=кол.length, M=лист.строки.length;
  let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<dimension ref="A1:'+xlБуква(N)+Math.max(1,M+1)+'"/>'+
    // шапка закреплена — иначе на 315 строках непонятно, что за столбец
    '<sheetViews><sheetView workbookViewId="0">'+
    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'+
    '</sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/><cols>';
  кол.forEach((к,i)=>{ xml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(к.ш||16)+'" customWidth="1"/>'; });
  xml+='</cols><sheetData><row r="1">';
  кол.forEach((к,i)=>{ xml+='<c r="'+xlБуква(i+1)+'1" t="inlineStr" s="1"><is><t>'+X(к.з)+'</t></is></c>'; });
  xml+='</row>';
  лист.строки.forEach((стр,ri)=>{
    const r=ri+2; xml+='<row r="'+r+'">';
    стр.forEach((v,ci)=>{ xml+=xlЯчейка(xlБуква(ci+1)+r, v, кол[ci].тип); });
    xml+='</row>';
  });
  xml+='</sheetData>';
  // По схеме autoFilter идёт ПОСЛЕ sheetData, а не до — иначе Excel
  // объявит книгу повреждённой (та же строгость, что и в Word).
  if(M) xml+='<autoFilter ref="A1:'+xlБуква(N)+(M+1)+'"/>';
  return xml+'</worksheet>';
}
function xlsxФайл(имяФайла, листы){
  const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const стили='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="DD.MM.YYYY"/></numFmts>'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill>'+
    '<fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="3">'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';
  let книга='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="'+R+'"><sheets>';
  let связи='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  let типы='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
  const файлы=[{имя:"xl/styles.xml", данные:стили}];
  листы.forEach((л,i)=>{
    const n=i+1;
    книга+='<sheet name="'+X(л.имя)+'" sheetId="'+n+'" r:id="rId'+n+'"/>';
    связи+='<Relationship Id="rId'+n+'" Type="'+R+'/worksheet" Target="worksheets/sheet'+n+'.xml"/>';
    типы+='<Override PartName="/xl/worksheets/sheet'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    файлы.push({имя:"xl/worksheets/sheet"+n+".xml", данные:xlЛист(л)});
  });
  книга+='</sheets></workbook>';
  связи+='<Relationship Id="rId'+(листы.length+1)+'" Type="'+R+'/styles" Target="styles.xml"/></Relationships>';
  типы+='</Types>';
  файлы.unshift(
    {имя:"[Content_Types].xml", данные:типы},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {имя:"xl/workbook.xml", данные:книга},
    {имя:"xl/_rels/workbook.xml.rels", данные:связи});
  dlBlob(имяФайла, zipStore(файлы));
}

// Что именно выгружаем. Журнал уходит полностью: в CSV терялось самое
// нужное — номера протоколов по методам, оставались одни названия методов.
function листЖурнала(строки){
  const колонки=[{з:"№ п/п",ш:7,тип:"число"},{з:"№ акта",ш:14},{з:"Дата",ш:12,тип:"дата"},
    {з:"Статус",ш:16},{з:"Подразделение",ш:20},{з:"Объект контроля",ш:38},
    {з:"Наименование в документе",ш:30},{з:"Заводской №",ш:14},{з:"Рег. №",ш:14}];
  METHODS.forEach(м=>{ колонки.push({з:м+" №",ш:13}); колонки.push({з:м+" исполнитель",ш:17}); });
  колонки.push({з:"Заключение",ш:40},{з:"Примечание",ш:24});
  const из=строки.map((z,i)=>{
    const р=[i+1, z.акт, z.дата, z.статус, z.подразделение, z.объект,
             z.наименование, завЗаписи(z), регЗаписи(z)];
    METHODS.forEach(м=>{ const v=(z.методы||{})[м]||{};
      р.push(обозначениеПротокола(z,м)||v.н||""); р.push(v.исп||""); });
    р.push(z.заключение, z.примечание);
    return р;
  });
  return {имя:"Журнал", колонки:колонки, строки:из};
}
function листОбъектов(){
  return {имя:"Объекты", строки:live(O).map((o,i)=>[i+1,o.наименование,o.зав,o.рег,o.учет,o.инв,

  });
  НД_НОВЫЕ_ЗАМЕНЫ_2026_09.forEach(нов=>{
    if(!НД.some(x=>x.обозначение===нов.обозначение)){
      НД.push(Object.assign({id:newId("НД"),проверено:"2026-09-14",
        изменено:new Date().toISOString(),место:getWS().код}, нов));
      изменилось=true;
    }
  });
  НД_НОВЫЕ_МК_2026_09.forEach(нов=>{
    if(!НД.some(x=>x.обозначение===нов.обозначение)){
      НД.push(Object.assign({id:newId("НД"),проверено:"2026-09-15",
        изменено:new Date().toISOString(),место:getWS().код}, нов));
      изменилось=true;
    }
  });
  // Раздел 9 паспорта — категория (см. комментарий у НД_КАТЕГОРИЯ_2026_09
  // выше): только достраивает пустое поле у уже сохранённых записей, не
  // трогает то, что заказчик мог выставить руками. Документы, которых не
  // было в присланном настоящем паспорте (МК, замены при актуализации),
  // категории не получают — гадать, в какую из девяти групп их отнёс бы
  // заказчик, не буду; в разделе 9 паспорта такие попадают в отдельную
  // группу «Прочие документы» (см. ндТабл).
  НД_КАТЕГОРИЯ_2026_09.forEach(([об,кат])=>{
    const рек=НД.find(x=>x.обозначение===об);
    if(рек && !рек.категория){ рек.категория=кат; изменилось=true; }
  });
  if(изменилось) saveReg(REG_НД, НД);
}
ЗАД = loadReg(REG_ЗАД, []);
// Теперь, когда загружены все реестры, можно перевести ссылки на норм.
// документы (наборы в «Методиках контроля» и в записях журнала) на новые
// канонические id — см. _заменыНД выше.
заменитьСсылкиНД(_заменыНД);
папкаКопий().then(h=>{ if(h && curView==="exchange") renderExchange(); });
папкаДок().then(h=>{ if(h && curView==="exchange") renderExchange(); });
rebuildObjIndex();
document.getElementById("wsName").textContent = getWS().код;
setChrome(); switchView("dash");
