function saveJournalRec(id){
  // Объект выбирается строкой «наименование, зав. № …, рег. № …» —
  // разбираем её, чтобы номера легли в свои поля, а не только в строку.
  const v=(k)=>{const el=document.getElementById(k);return el?el.value.trim():"";};
  const объект=v("e_объект");
  if(!объект && !v("e_акт")){ toast("Заполните объект или № акта"); return; }
  const методы={};
  METHODS.forEach(m=>{
    const н=v("m_"+m+"_н"), исп=v("m_"+m+"_исп");
    if(н||исп) методы[m]={н:н,исп:исп};
  });
  // Строка объекта приходит из списка вместе с номерами: разбираем её,
  // а карточку ищем по имени вместе с заводским номером — по одному имени
  // нельзя, у десятков баллонов оно одинаковое.
  const имяОб=объект.replace(/,?\s*(зав|рег)\.?\s*№.*$/i,"").trim();
  const мЗав=/зав\.?\s*№\s*([^,;]+)/i.exec(объект), мРег=/рег\.?\s*№\s*([^,;]+)/i.exec(объект);
  const завОб=мЗав?мЗав[1].trim():"", регОб=мРег?мРег[1].trim():"";
  const spr=live(O).find(o=>String(o.наименование||"").trim()===имяОб &&
                            String(o.зав||"").trim()===завОб)
            || objByName[имяОб] || objByName[объект] || {};
  const дата=v("e_дата");
  const rec={
    статус:v("e_статус"), акт:v("e_акт"), дата:дата, год:дата?дата.slice(0,4):"",
    подразделение:v("e_подразделение"), объект:объект,
    объект_ид:spr.id||"", наименование:v("e_наим")||имяОб,
    зав:завОб||spr.зав||"", рег:регОб||spr.рег||"", методы:методы,
    архив:v("e_архив"), исходящий:v("e_исходящий"), отправитель:v("e_отправитель"),
    примечание:v("e_примечание"),
    изменено:new Date().toISOString(), место:getWS().код
  };
  if(id){ const i=J.findIndex(x=>String(x.id)===String(id)); if(i>=0) J[i]=Object.assign({},J[i],rec); }
  else { rec.id=newId(); rec.нп=J.length+1; J.unshift(rec); }
  saveJournal(); switchView("journal");
  toast(id?"Запись изменена":"Запись добавлена");
}
function delJournal(id){

     "\n\nУдаление перенесётся на другие места при обмене.")) return;

// ── Резервная копия ВСЕЙ базы в файл ──────────────────────
// Копия охватывает журнал и все три справочника: с тех пор как
// справочники стали редактируемыми, копия только журнала оставляла бы
// половину работы без страховки. Восстановление — именно замена
// (в этом смысл копии), поэтому спрашивает подтверждение.
// ── База: где живут данные и чем они застрахованы ─────────
// Данных «в файле рядом с программой» не бывает: страница, открытая с
// диска, писать в свою папку сама не может. Поэтому рабочая база лежит
// в памяти браузера, а настоящая страховка — копия в файл.
//
// Замерено в этом браузере: предел памяти ~5 МБ, сейчас занято 236 КБ на
// 315 записей вместе со справочниками (~766 символов на запись) — то есть
// запас примерно на 6500 записей. Далеко, но предел молчаливый: браузер
// не предупреждает, он просто отказывает в записи, и правка пропадает.
// Поэтому ниже и счётчик заполнения, и предупреждение заранее.
const ПРЕДЕЛ_ХРАНИЛИЩА = 5 * 1024 * 1024;   // символов, проверено замером
function объёмХранилища(){
  let занято=0, по={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i), v=localStorage.getItem(k)||"";
      if(k.indexOf("lnk_")!==0) continue;
      по[k]=k.length+v.length; занято+=k.length+v.length;
    }
  }catch(e){}
  // До первой правки память браузера пуста: данные ещё вшиты в файл
  // программы. Считать запас по нулю нельзя — получилась бы бессмыслица
  // вроде «хватит на 103 миллиона записей». Берём то, что реально ляжет
  // в память при первом же сохранении.
  let факт=0;
  try{ факт=(JSON.stringify(J)+JSON.stringify(O)+JSON.stringify(S)+
             JSON.stringify(P)+JSON.stringify(A)).length; }catch(e){}
  const всего=Math.max(занято,факт);
  const наЗапись = liveJ().length ? всего/liveJ().length : 0;
  return { всего:всего, по:по, занято:занято,
           доля: всего/ПРЕДЕЛ_ХРАНИЛИЩА,
           местаНаЗаписей: наЗапись>1 ? Math.round((ПРЕДЕЛ_ХРАНИЛИЩА-всего)/наЗапись) : null };
}

// Папку для копий надо запомнить между запусками, а localStorage хранит
// только строки — «ручку» на папку в него не положить. Для этого есть
// IndexedDB, она в этом браузере из file:// работает (проверено).
const ФС_БД="lnk_fs", ФС_ХР="ручки";
function идб(){
  return new Promise((ок,нет)=>{
    let r; try{ r=indexedDB.open(ФС_БД,1); }catch(e){ return нет(e); }
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore(ФС_ХР); }catch(e){} };
    r.onsuccess=()=>ок(r.result); r.onerror=()=>нет(r.error);
  });
}
function идбЗапись(ключ,знач){
  return идб().then(db=>new Promise((ок,нет)=>{
    const t=db.transaction(ФС_ХР,"readwrite");
    t.objectStore(ФС_ХР).put(знач,ключ);
    t.oncomplete=()=>{db.close();ок(true);}; t.onerror=()=>{db.close();нет(t.error);};
  })).catch(()=>false);
}
function идбЧтение(ключ){
  return идб().then(db=>new Promise((ок)=>{
    const t=db.transaction(ФС_ХР,"readonly"), z=t.objectStore(ФС_ХР).get(ключ);
    z.onsuccess=()=>{db.close();ок(z.result||null);}; z.onerror=()=>{db.close();ок(null);};
  })).catch(()=>null);
}

const ЕСТЬ_ПАПКИ = (typeof window.showDirectoryPicker==="function");
let _папка=null;
async function папкаКопий(){ if(!_папка) _папка=await идбЧтение("папкаКопий"); return _папка; }
async function правоНаПапку(спросить){
  const h=await папкаКопий(); if(!h) return "нет папки";
  try{
    let p=await h.queryPermission({mode:"readwrite"});
    if(p==="granted") return "есть";
    if(спросить){ p=await h.requestPermission({mode:"readwrite"});
                  if(p==="granted") return "есть"; }
    return "нужно разрешение";
  }catch(e){ return "нужно разрешение"; }
}
async function выбратьПапкуКопий(){
  if(!ЕСТЬ_ПАПКИ){
    alert("Этот браузер не умеет писать копии в выбранную папку.\n\n"+
      "Так умеют Chrome и Edge. В остальных остаётся кнопка «Сохранить копию» — "+
      "файл попадёт в папку загрузок.");
    return;
  }
  try{
    const h=await window.showDirectoryPicker({mode:"readwrite"});
    _папка=h; await идбЗапись("папкаКопий",h);
    toast("Папка для копий выбрана");
    await копияВПапку(false);
    renderExchange();
  }catch(e){ if(e.name!=="AbortError") toast("Не удалось выбрать папку: "+e.name); }
}
async function забытьПапку(){

}

function данныеКопии(){
  const ws=getWS();
  return JSON.stringify({ тип:"резервная копия ЛНК", формат:2, место:ws.код,
    версия:DB.версия, сохранено:new Date().toISOString(),
    записи:J, объекты:O, приборы:S, специалисты:P, акты:A, ппр:ОТМ, подразделения:ПОДР, падежи:ПАДЕЖИ, задачи:ЗАД,
    лаборатория:getЛаб() }, null, 1);
}
function имяКопии(){
  const d=new Date(), дв=n=>(n<10?"0":"")+n;
  return "ЛНК копия "+d.getFullYear()+"-"+дв(d.getMonth()+1)+"-"+дв(d.getDate())+
         " "+дв(d.getHours())+дв(d.getMinutes())+" ("+getWS().код+").json";
}
// Копий держим несколько поколений: одна-единственная копия бесполезна,
// если испортили данные и записали поверх. Старые сверх ДЕРЖАТЬ удаляются.
const ДЕРЖАТЬ_КОПИЙ=14;
async function чиститьСтарые(){
  const h=await папкаКопий(); if(!h) return 0;
  try{
    const свои=[];
    for await (const [имя,ручка] of h.entries())
      if(/^ЛНК копия .+\.json$/.test(имя) && ручка.kind==="file") свои.push(имя);
    свои.sort();                                   // имя начинается с даты — сортировка хронологическая
    const лишние=свои.slice(0, Math.max(0, свои.length-ДЕРЖАТЬ_КОПИЙ));
    for(const имя of лишние) await h.removeEntry(имя);
    return лишние.length;
  }catch(e){ return 0; }
}
async function копияВПапку(тихо){
  const h=await папкаКопий(); if(!h) return false;
  if(await правоНаПапку(!тихо)!=="есть") return false;
  try{
    const ф=await h.getFileHandle(имяКопии(),{create:true});
    const w=await ф.createWritable();
    await w.write(данныеКопии()); await w.close();
    try{ localStorage.setItem("lnk_last_backup", new Date().toISOString()); }catch(e){}
    await чиститьСтарые();
    if(!тихо) toast("Копия записана в папку");
    return true;
  }catch(e){ if(!тихо) toast("Не удалось записать копию: "+e.name); return false; }
}
// Копия делается сама, но не после каждой правки: раз в 10 минут работы
// достаточно, а чаще — только мешает диску и глазу.
let _когдаКопия=0;
function копияПоСлучаю(){
  const т=Date.now();
  if(т-_когдаКопия < 10*60*1000) return;
  _когдаКопия=т;
  папкаКопий().then(h=>{ if(h) копияВПапку(true); });
}
function когдаКопия(){
  try{ return localStorage.getItem("lnk_last_backup")||""; }catch(e){ return ""; }
}
function днейБезКопии(){
  const t=когдаКопия(); if(!t) return null;
  return Math.floor((Date.now()-new Date(t).getTime())/86400000);
}

let _fileIn;
function backupOpen(){
  if(!_fileIn){ _fileIn=document.createElement("input"); _fileIn.type="file"; _fileIn.accept=".json"; _fileIn.style.display="none"; document.body.appendChild(_fileIn);
    _fileIn.addEventListener("change",e=>{
      const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
      rd.onload=()=>{ try{
        const d=JSON.parse(rd.result);
        const jarr=Array.isArray(d)?d:d.записи;                 // старая копия — только журнал
        const полная=d && (d.объекты||d.приборы||d.специалисты||d.акты);
        if(!Array.isArray(jarr) && !полная) throw new Error("не файл копии");
        const было="журнал "+liveJ().length+", объекты "+live(O).length+", СИ "+live(S).length+", спец. "+live(P).length;
        const станет=(Array.isArray(jarr)?("журнал "+jarr.filter(z=>!z.удалено).length):"журнал без изменений")
          + (полная? (", объекты "+(d.объекты||[]).filter(z=>!z.удалено).length
                    +", СИ "+(d.приборы||[]).filter(z=>!z.удалено).length
                    +", спец. "+(d.специалисты||[]).filter(z=>!z.удалено).length) : "");
        if(!confirm("ЗАМЕНИТЬ текущие данные копией из файла?\n\nСейчас: "+было+
                    "\nСтанет: "+станет+"\n\nЭто не слияние — текущие данные будут заменены.")) return;
        if(Array.isArray(jarr)){ J=jarr; saveJournal(); }
        if(полная){
          if(Array.isArray(d.объекты)){ O=d.объекты; saveReg(REG_OBJ,O); }

// документов. Форма — по вашему бланку паспорта (Форма 3 СДАНК-01-2020).
//
// Актуализация: поле «проверено» — дата, когда в последний раз сверяли,
// что документ не отменён и не заменён новым изданием. Своего срока
// действия нормативные документы не имеют — это не поверка, а ваша
// внутренняя процедура. Один год — принятая практика (так же считает
// «Проверка данных»): без даты — «внимание» (могли не проверять),
// проверка старше года — «ошибка» (пора пересмотреть).
function ндАктуальноДо(дата){
  if(!дата) return "";
  const d=new Date(дата+"T00:00:00");
  d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
function ндСтатус(x){
  if(!x.проверено) return ["new","не проверялся"];
  const до=ндАктуальноДо(x.проверено);
  if(до<сегодня()) return ["bad","проверен "+ru(x.проверено)];
  return ["ok","проверен "+ru(x.проверено)];
}

// ── Обмен между рабочими местами ──────────────────────────
// Файлами, без сети. Слияние по id записи: новых нет — добавляем;
// есть — берём ту, у кого «изменено» свежее. Код места входит в id
// новых записей, поэтому места не затирают друг друга.
function mergeJournal(incoming){
  let added=0, updated=0, skipped=0;
  const idx={}; J.forEach((z,i)=>{ idx[z.id]=i; });
  incoming.forEach(r=>{
    if(!r||!r.id) return;
    if(idx[r.id]==null){ J.push(r); idx[r.id]=J.length-1; if(!r.удалено) added++; }
    else { const cur=J[idx[r.id]];
      if(lastTs(r) > lastTs(cur)){ J[idx[r.id]]=r; updated++; }
      else skipped++; }
  });
  if(added||updated) saveJournal();
  return {added,updated,skipped};
}
// Два места могли выдать один номер, если оба брали право порознь.
// Молчать об этом нельзя: номер уже мог уйти на подписанный документ.
function проверитьСтолкновения(){
  const карта={}, из=[];
  liveJ().forEach(z=>{ const г=годЗаписи(z); if(!г) return;
    methodsOf(z).forEach(м=>{ const н=номерМетода(z,м); if(!/^\d+$/.test(н)) return;
      const ключ=м+"-"+г+"-"+н; (карта[ключ]=карта[ключ]||[]).push(z); });
    const m=/^АКТ\s+(\d+)-(\d{4})$/.exec(String(z.акт||"").trim());
    if(m){ const ключ="АКТ-"+m[2]+"-"+m[1]; (карта[ключ]=карта[ключ]||[]).push(z); }
  });
  Object.keys(карта).forEach(k=>{
    const сп=карта[k];
    // Акт законно повторяется: один акт охватывает несколько объектов.
    if(k.indexOf("АКТ-")===0) return;
    if(сп.length>1) из.push(k.replace(/^(\S+?)-(\d{4})-(\d+)$/,"$3-$2-$1")+
      ": " + сп.map(z=>(z.объект||"без объекта").slice(0,28)).join(" / "));
  });
  return из;
}

let _exIn;
function exchangeImport(){
  if(!_exIn){
    _exIn=document.createElement("input"); _exIn.type="file"; _exIn.accept=".json"; _exIn.multiple=true; _exIn.style.display="none"; document.body.appendChild(_exIn);
    _exIn.addEventListener("change",e=>{
      const files=[...e.target.files]; if(!files.length) return;
      let done=0, tot={j:0,o:0,s:0,p:0}, отчёт=[];
      files.forEach(f=>{
        const rd=new FileReader();
        rd.onload=()=>{
          try{
            const d=JSON.parse(rd.result);
            const jarr=Array.isArray(d)?d:d.записи;
            if(!Array.isArray(jarr) && !d.объекты && !d.приборы && !d.специалисты)
              throw new Error("не файл обмена");
            const rj=Array.isArray(jarr)?mergeJournal(jarr):{added:0,updated:0,skipped:0};
            // Право выдачи — свежее побеждает, как и всё остальное.
            if(d.право && d.право.изменено && d.право.изменено > getGrant().изменено){
              saveGrant({место:d.право.место||"", изменено:d.право.изменено});
            }
            const ro=mergeInto(O,REG_OBJ,d.объекты);
            const rs=mergeInto(S,REG_SI,d.приборы);
            const rp=mergeInto(P,REG_PPL,d.специалисты);
            mergeInto(A,REG_AKT,d.акты);
            mergeInto(ОТМ,REG_ППР,d.ппр);
            mergeInto(ПОДР,REG_ПОДР,d.подразделения);
            mergeInto(ПАДЕЖИ,REG_ПАДЕЖ,d.падежи);
            mergeInto(ЗАД,REG_ЗАД,d.задачи);
            // Карточка лаборатории — свежее побеждает, как право и названия.
            if(d.лаборатория && d.лаборатория.изменено &&
               d.лаборатория.изменено > (getЛаб().изменено||""))
              saveЛаб(d.лаборатория);
            // Названия документов по методам — свежее побеждает.
            if(d.названия && d.названия.изменено && d.названия.изменено > имена().изменено)
              saveИмена({имена:Object.assign({}, имена().имена, d.названия.имена||{}),
                         ед:Object.assign({}, имена().ед, d.названия.ед||{}),
                         изменено:d.названия.изменено});
            if(ro.added||ro.updated) rebuildObjIndex();
            tot.j+=rj.added+rj.updated; tot.o+=ro.added+ro.updated; tot.s+=rs.added+rs.updated; tot.p+=rp.added+rp.updated;
            отчёт.push((d.место?("["+d.место+"] "):"")+f.name+
              ": журнал +"+rj.added+"/"+rj.updated+", объекты +"+ro.added+"/"+ro.updated+
              ", СИ +"+rs.added+"/"+rs.updated+", спец. +"+rp.added+"/"+rp.updated);
          }catch(err){ отчёт.push(f.name+": ошибка — "+err.message); }
          if(++done===files.length){
            try{ localStorage.setItem("lnk_last_import", new Date().toISOString()); }catch(e){}
            renderExchange();
            const столк=проверитьСтолкновения();
            if(столк.length) alert("ВНИМАНИЕ: одинаковые номера у разных записей.\n\n"+
              столк.slice(0,12).join("\n")+(столк.length>12?("\n… всего "+столк.length):"")+
              "\n\nТакое бывает, если два места выдавали номера порознь. Исправьте вручную: "+
              "откройте записи и задайте верные номера.");
            alert("Принято файлов: "+files.length+"\n\n"+отчёт.join("\n")+
              "\n\nВсего изменений: журнал "+tot.j+", объекты "+tot.o+", приборы "+tot.s+", специалисты "+tot.p+
              ".\n(в записи «+новых/обновлено»)");
            toast("Обмен принят");
          }
        };
        rd.readAsText(f);
      });
      e.target.value="";
    });
  }
  _exIn.click();
}

// ── План ППР: планово-предупредительные осмотры и ремонты ──
// План взят из вашей книги «План-график ППР 2026-2030», лист «Пятилетний»,
// и ничего в нём не досочинено. Периодичность записана долей года и видом
// обслуживания («0,25 ТО-4»): доля подтверждается самой разметкой —
// 0,25 стоит раз в квартал, 0,083 ежемесячно, 0,027 примерно каждые десять
// дней, 0,0027 по рабочим дням. А что именно означают номера ТО-1…ТО-4, в
// книге не написано — они показаны как есть, расшифровку не выдумываю.
//
// Главное, чего в книге нет и ради чего раздел нужен: ОТМЕТКА О ВЫПОЛНЕНИИ.
// План на бумаге отвечает, что надо сделать; отметки отвечают, что сделано.
const ППР = (function(){
  try{ const t=document.getElementById("lnk-ppr").textContent.trim();
       const d=t?JSON.parse(t):null;
       return (d && Array.isArray(d.позиции)) ? d : {годы:[],позиции:[],замечания:[]};
  }catch(e){ return {годы:[],позиции:[],замечания:[]}; }
})();
const МЕСЯЦЫ=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль",
              "Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const МЕС3=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

// Отметки — рабочие данные: правятся, ходят в обмене, попадают в копию.
const REG_ППР="lnk_ppr";
let ОТМ;
function ключОтметки(п,год,мес){ return п.id+"|"+год+"|"+мес; }
function отметка(п,год,мес){
  return live(ОТМ).find(о=>о.id===ключОтметки(п,год,мес))||null;
}
function отметить(идПоз,год,мес,кто){
  const п=ППР.позиции.find(x=>x.id===идПоз); if(!п) return;
  const к=ключОтметки(п,год,мес);
  const был=ОТМ.find(о=>о.id===к);
  if(был && !был.удалено){                       // повторное нажатие снимает отметку
    был.удалено=new Date().toISOString(); был.изменено=был.удалено;
  } else if(был){
    был.удалено=""; был.выполнено=new Date().toISOString().slice(0,10);
    был.кто=кто||был.кто||""; был.изменено=new Date().toISOString();
  } else {
    ОТМ.push({id:к, поз:идПоз, год:год, мес:мес,
              выполнено:new Date().toISOString().slice(0,10), кто:кто||"",
              место:getWS().код, изменено:new Date().toISOString()});
  }
  saveReg(REG_ППР,ОТМ);
  renderPlan();
}

let план={год:null, толькоНеВыполненные:false};
function годПлана(){
  if(план.год) return план.год;
  const т=new Date().getFullYear();
  план.год = ППР.годы.indexOf(т)>=0 ? т : (ППР.годы[0]||т);

}

function работыМесяца(год,мес){
  const из=[];
  ППР.позиции.forEach(п=>{
    const ч=((п.план||{})[String(год)]||{})[String(мес)];
    if(ч) из.push({поз:п, часы:ч, отм:отметка(п,год,мес)});
  });
  return из;
}
function итогиГода(год){
  let работ=0, часы=0, сделано=0, часовСделано=0;
  for(let м=1;м<=12;м++){
    работыМесяца(год,м).forEach(р=>{
      работ++; часы+=р.часы;
      if(р.отм){ сделано++; часовСделано+=р.часы; }
    });
  }
  return {работ, часы:+часы.toFixed(2), сделано,
          часовСделано:+часовСделано.toFixed(2),
          доля: работ?сделано/работ:0};
}
// Один источник правды о «сейчас»: и подсветка ячеек, и счёт просроченного
// должны считать прошедшим одно и то же, иначе цифра и цвет разойдутся.
function прошедший(год,мес){
  const н=new Date(), тг=н.getFullYear(), тм=н.getMonth()+1;
  return год<тг || (год===тг && мес<тм);
}
function текущийМесяц(год,мес){
  const н=new Date(); return год===н.getFullYear() && мес===н.getMonth()+1;
}
// Просрочено — запланированное на прошедшие месяцы и не отмеченное.
// Текущий месяц не в счёт: он ещё идёт.
function просрочено(год){
  const тг=new Date().getFullYear();
  if(год>тг) return [];
  const до = (год<тг) ? 12 : new Date().getMonth();
  const из=[];
  for(let м=1;м<=до;м++)
    работыМесяца(год,м).forEach(р=>{ if(!р.отм) из.push({мес:м, поз:р.поз, часы:р.часы}); });
  return из;
}

// Что по ППР приходится на текущий месяц — для пульта.
function ппрМесяца(){
  const н=new Date(), год=н.getFullYear(), мес=н.getMonth()+1;
  const р=работыМесяца(год,мес);
  const осталось=р.filter(x=>!x.отм);
  return {год, мес, имя:МЕСЯЦЫ[мес-1], всего:р.length,
          сделано:р.length-осталось.length, осталось:осталось.length,
          список:осталось};
}

  }
  тело+=wP("",{отступ:false});
  тело+=wТаблШапкаШир(шапка,ширины,строки);

  const НС='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '+
           'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const документ='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document '+НС+'><w:body>'+тело+
    '<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape" w:code="9"/>'+
    '<w:pgMar w:top="1134" w:right="1276" w:bottom="1134" w:left="1559" '+
    'w:header="567" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';

  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const файлы=[
    {имя:"[Content_Types].xml", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
      '</Types>'},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="word/document.xml"/>'+
      '</Relationships>'},
    {имя:"word/document.xml", данные:документ}
  ];
  dlBlob("План ППР "+год+".docx", zipStore(файлы));
  toast("План "+год+" выгружен в Word: "+строки.length+" позиций");
}
// wТаблШапка() паспорта считает ширину таблицы по ШИРИНА_ТЕКСТА (книжная
// страница) — плану нужна альбомная, поэтому берём ту же вёрстку ячеек,
// но с суммой ширин по ШИРИНА_АЛЬБОМ.
function wТаблШапкаШир(шапка, ширины, строки){
  const grid=ширины.map(ш=>'<w:gridCol w:w="'+ш+'"/>').join('');
  let из='<w:tbl><w:tblPr><w:tblW w:w="'+ШИРИНА_АЛЬБОМ+'" w:type="dxa"/>'+
    '<w:tblBorders>'+wГраницыТабл()+'</w:tblBorders>'+
    '<w:tblLayout w:type="fixed"/>'+
    '<w:tblCellMar><w:left w:w="60" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar>'+
    '</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>';
  из+=wСтрокаТабл(шапка,ширины,true);
  строки.forEach(р=>из+=wСтрокаТабл(р,ширины,false));
  из+='</w:tbl>';
  return из;
}

// ── Задачи: ядро ──────────────────────────────────────────
// Одна сущность со сроком; день, неделя, месяц, квартал, полугодие и год —
// шесть способов посмотреть на один список, а не шесть списков. Почему так,
// расписано в ТЗ/Проработка_менеджер_задач.md: задачи переносят, и при
// раздельных списках перенесённая задача теряется или задваивается.
const REG_ЗАД="lnk_tasks";
let ЗАД;

const ГОРИЗОНТЫ=[["день","День"],["неделя","Неделя"],["месяц","Месяц"],
                 ["квартал","Квартал"],["полугодие","Полугодие"],["год","Год"]];

// Состояния. Контроль исполнения нужен (ответ заказчика), поэтому после
// «выполнена» задача не закрывается сама: её принимает постановщик либо
// возвращает на доработку. «Принята в работу» нужна отдельно, потому что
// связь между местами только файлами — иначе не видно, дошла ли задача.
const СОСТОЯНИЯ={
  назначена:{т:"Назначена",   к:"new"},
  принята:  {т:"Принята в работу", к:"work"},
  выполнена:{т:"Выполнена, на проверке", к:"warn"},
  закрыта:  {т:"Принята начальником", к:"ok"},
  доработка:{т:"Возвращена на доработку", к:"bad"},
  отменена: {т:"Отменена",    к:""}
};
function состТекст(з){ return (СОСТОЯНИЯ[з.статус]||{}).т || з.статус || ""; }
function состКласс(з){ return (СОСТОЯНИЯ[з.статус]||{}).к || ""; }
function живаяЗадача(з){ return !з.удалено && з.статус!=="отменена"; }

// Границы периода. Квартал и полугодие считаются от календарного года,
// неделя — с понедельника: так их и понимают в отчётности.
function границыПериода(вид, база){
  const d=база?new Date(база+"T00:00:00"):new Date();
  const г=d.getFullYear(), м=d.getMonth();
  const дата=(y,mo,day)=>new Date(Date.UTC(y,mo,day)).toISOString().slice(0,10);
  if(вид==="день")     return [дата(г,м,d.getDate()), дата(г,м,d.getDate())];
  if(вид==="неделя"){
    const дн=(d.getDay()+6)%7;                       // понедельник = 0
    const пн=new Date(d); пн.setDate(d.getDate()-дн);
    const вс=new Date(пн); вс.setDate(пн.getDate()+6);
    return [дата(пн.getFullYear(),пн.getMonth(),пн.getDate()),
            дата(вс.getFullYear(),вс.getMonth(),вс.getDate())];
  }
  if(вид==="месяц")    return [дата(г,м,1), дата(г,м+1,0)];
  if(вид==="квартал"){ const к=Math.floor(м/3); return [дата(г,к*3,1), дата(г,к*3+3,0)]; }
  if(вид==="полугодие"){ const п=м<6?0:6; return [дата(г,п,1), дата(г,п+6,0)]; }
  return [дата(г,0,1), дата(г,11,31)];               // год
}
function имяПериода(вид, база){
  const [с,по]=границыПериода(вид,база);
  const d=new Date(с+"T00:00:00"), г=d.getFullYear(), м=d.getMonth();
  if(вид==="день")      return ru(с);
  if(вид==="неделя")    return "неделя "+ru(с)+" — "+ru(по);
  if(вид==="месяц")     return МЕСЯЦЫ[м]+" "+г;
  if(вид==="квартал")   return (Math.floor(м/3)+1)+"-й квартал "+г;
  if(вид==="полугодие") return (м<6?"1":"2")+"-е полугодие "+г;
  return г+" год";
}
function вПериоде(дата, вид, база){
  const [с,по]=границыПериода(вид,база);
  const d=String(дата||""); return !!d && d>=с && d<=по;
}

// Перенос срока сохраняет первоначальную дату: без этого отчёт всегда
// показывал бы сто процентов выполнения в срок.
function перенести(id, новыйСрок, причина){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  if(!з.срок_первый) з.срок_первый=з.срок;
  з.переносы=(з.переносы||[]).concat([{было:з.срок, стало:новыйСрок,
    причина:причина||"", когда:new Date().toISOString().slice(0,10)}]);
  з.срок=новыйСрок;
  отметитьЗадачу(з);
}
function отметитьЗадачу(з){
  з.изменено=new Date().toISOString(); з.место_правки=getWS().код;
  saveReg(REG_ЗАД,ЗАД);
}
function вСрок(з){
  if(!з.выполнено) return null;
  const план=з.срок_первый||з.срок;
  return план ? (з.выполнено<=план) : null;
}
function просроченаЗадача(з){
  if(!живаяЗадача(з) || з.статус==="закрыта") return false;
  const сегодня=new Date().toISOString().slice(0,10);
  return !!з.срок && з.срок<сегодня && з.статус!=="выполнена";
}

// Начальник ставит задачи и принимает работу. Роль — признак рабочего
// места, рядом с «мастером»: отдельного входа в программу нет и не будет,
// места и так разделены физически.
function яНачальник(){ return !!getWS().начальник; }
function ставитель(з){ return з.постановщик||""; }
function мояЗадача(з){
  const ws=getWS();
  return з.место===ws.код || (з.исполнитель && з.исполнитель===getЛаб().начальник);
}

// ── Задачи, которые система знает сама ────────────────────
// 230 работ ППР в год, поверки приборов, сроки лаборатории. Руками это не
// переписывают: во-первых, объём, во-вторых — отметки в двух местах
// разойдутся и правды не найти. Поэтому такие задачи НЕ ХРАНЯТСЯ, а
// вычисляются на лету и показываются рядом со своими. Отмечаются они там,
// где им место: работа ППР — в плане ППР, поверка — в карточке прибора.
function производныеЗадачи(вид, база){
  const [с,по]=границыПериода(вид, база);
  const из=[];
  const вокне=д=>!!д && д>=с && д<=по;
  const посл=(г,м)=>new Date(Date.UTC(г,м,0)).toISOString().slice(0,10);

  // 1. Обслуживание приборов по плану ППР. Точной даты в плане нет, есть
  // месяц — сроком берём последний день этого месяца.
  if(ППР.позиции && ППР.позиции.length){
    (ППР.годы||[]).forEach(г=>{
      for(let м=1;м<=12;м++){
        const срок=посл(г,м);
        if(!вокне(срок)) continue;
        работыМесяца(г,м).forEach(р=>{
          из.push({ид:"ППР|"+р.поз.id+"|"+г+"|"+м, источник:"ППР",
            что:"Обслуживание "+р.поз.вид+": "+р.поз.наименование,
            срок:срок, горизонт:"месяц", часы:р.часы,
            сделано:!!р.отм, когда:(р.отм&&р.отм.выполнено)||"",
            куда:"plan"});
        });
      }
    });
  }
  // 2. Поверка приборов
  live(S).forEach(п=>{
    if(!вокне(п.поверка_до)) return;
    из.push({ид:"СИ|"+п.id, источник:"Поверка",
      что:"Поверка: "+п.наименование+(п.зав?(", зав. № "+п.зав):""),
      срок:п.поверка_до, горизонт:"год", сделано:false, куда:"si"});
  });
  // 3. Сроки самой лаборатории
  const л=getЛаб();
  if(вокне(л.свид_до)) из.push({ид:"ЛАБ|аттестация", источник:"Лаборатория",
    что:"Заканчивается аттестация ЛНК", срок:л.свид_до, горизонт:"год",
    сделано:false, куда:"lab"});
  if(вокне(л.проверка)) из.push({ид:"ЛАБ|проверка", источник:"Лаборатория",
    что:"Плановая проверка ЛНК", срок:л.проверка, горизонт:"год",
    сделано:false, куда:"lab"});

  // 4. Инструктаж по охране труда — раз в 90 дней, для тех, у кого
  // внесена дата последнего. Без даты — задачу не из чего построить,
  // это видно только в «Проверке данных».
  live(P).forEach(c=>{
    const до=инструктажДо(c.инструктаж_дата);
    if(!вокне(до)) return;
    из.push({ид:"ИНСТР|"+c.id, источник:"Специалисты",
      что:"Инструктаж по охране труда: "+(c.вдок||c.фио), срок:до, горизонт:"квартал",
      сделано:false, куда:"people"});
  });

  return из.sort((a,b)=>String(a.срок).localeCompare(String(b.срок)));
}
function итогиПроизводных(сп){
  const сегодня=new Date().toISOString().slice(0,10);
  return { всего:сп.length, сделано:сп.filter(x=>x.сделано).length,
           просрочено:сп.filter(x=>!x.сделано && x.срок<сегодня).length };
}

// ── Повторяющиеся задачи ──────────────────────────────────
// «Раз в месяц сверять журнал с архивом» — заводить двенадцать раз незачем.
// Когда задачу принимают, программа создаёт следующую с тем же текстом и
// сдвинутым сроком. Так же, как в плане ППР, только для своих задач.
const ПОВТОРЫ=[["","не повторять"],["неделя","каждую неделю"],["месяц","каждый месяц"],
               ["квартал","каждый квартал"],["полугодие","каждое полугодие"],["год","каждый год"]];
function сдвинутьДату(дата, шаг){
  const d=new Date(дата+"T00:00:00");
  if(шаг==="неделя")         d.setDate(d.getDate()+7);
  else if(шаг==="месяц")     d.setMonth(d.getMonth()+1);
  else if(шаг==="квартал")   d.setMonth(d.getMonth()+3);
  else if(шаг==="полугодие") d.setMonth(d.getMonth()+6);
  else if(шаг==="год")       d.setFullYear(d.getFullYear()+1);
  else return "";
  return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10);
}
function продолжитьПовтор(з){
  if(!з.повтор || !з.срок) return null;
  const след=сдвинутьДату(з.срок, з.повтор);
  if(!след) return null;
  if(з.повтор_до && след>з.повтор_до) return null;
  // защита от задвоения: если следующая уже есть, второй раз не создаём
  const есть=ЗАД.some(x=>!x.удалено && x.родитель===(з.родитель||з.id) && x.срок===след);
  if(есть) return null;
  const нов=Object.assign({}, з, {
    id:newId("ЗД"), срок:след, статус:"назначена",
    родитель:з.родитель||з.id,
    принято:"", выполнено:"", проверено:"", причина_возврата:"",
    срок_первый:"", переносы:[],
    создано:new Date().toISOString(), изменено:new Date().toISOString(),
    место_правки:getWS().код, удалено:""
  });
  ЗАД.push(нов); saveReg(REG_ЗАД,ЗАД);
  return нов;
}

// ── Задачи: экран ─────────────────────────────────────────
let зф={период:"неделя", база:"", статус:"", исполнитель:"", источник:"все"};
function setЗП(v){ зф.период=v; renderTasks(); }
function сдвигПериода(шаг){
  const [с]=границыПериода(зф.период, зф.база);
  const d=new Date(с+"T00:00:00");
  if(зф.период==="день")      d.setDate(d.getDate()+шаг);
  else if(зф.период==="неделя")    d.setDate(d.getDate()+7*шаг);
  else if(зф.период==="месяц")     d.setMonth(d.getMonth()+шаг);
  else if(зф.период==="квартал")   d.setMonth(d.getMonth()+3*шаг);
  else if(зф.период==="полугодие") d.setMonth(d.getMonth()+6*шаг);
  else d.setFullYear(d.getFullYear()+шаг);
  зф.база=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10);
  renderTasks();
}
function сегодняПериод(){ зф.база=""; renderTasks(); }
function задачиПериода(){
  const q=(query||"").toLowerCase();
  return ЗАД.filter(з=>!з.удалено)
    .filter(з=>вПериоде(з.срок, зф.период, зф.база))
    .filter(з=>!зф.статус || з.статус===зф.статус)
    .filter(з=>!зф.исполнитель || з.исполнитель===зф.исполнитель)
    .filter(з=>!q || ((з.что||"")+(з.подробно||"")+(з.исполнитель||"")).toLowerCase().includes(q))
    .sort((a,b)=>String(a.срок||"").localeCompare(String(b.срок||""))
              || String(a.что||"").localeCompare(String(b.что||""),"ru"));
}
function итогиЗадач(список){
  const ж=список.filter(живаяЗадача);
  const закрыто=ж.filter(з=>з.статус==="закрыта");
  const всрок=закрыто.filter(з=>вСрок(з)===true).length;
  return { всего:ж.length, закрыто:закрыто.length, всрок:всрок,
           сПереносом:закрыто.length-всрок,
           впроверке:ж.filter(з=>з.статус==="выполнена").length,
           просрочено:ж.filter(просроченаЗадача).length,
           доработка:ж.filter(з=>з.статус==="доработка").length };
}

  const исполнители=[...new Set(ЗАД.filter(з=>!з.удалено).map(з=>з.исполнитель).filter(Boolean))].sort();
  const пер=(v,т)=>`<button class="btn ${зф.период===v?"on":""}" onclick="setЗП('${v}')">${т}</button>`;
  const строки=список.length?список.map(з=>{
    const пр=просроченаЗадача(з);
    return `<tr onclick="editTask('${esc(з.id)}')">
      <td class="num">${ru(з.срок)}${пр?`<br><span class="st bad">просрочена</span>`:""}</td>
      <td class="obj"><b>${esc(з.что)}</b>${з.подробно?`<br><span class="muted" style="font-size:12px">${esc(String(з.подробно).slice(0,80))}</span>`:""}</td>
      <td>${esc(з.исполнитель)||"<span class='muted'>—</span>"}</td>
      <td><span class="pill">${esc((ГОРИЗОНТЫ.find(x=>x[0]===з.горизонт)||["","—"])[1])}</span></td>
      <td><span class="st ${состКласс(з)}">${esc(состТекст(з))}</span>
        ${(з.переносы||[]).length?`<br><span class="muted" style="font-size:11.5px">переносов: ${з.переносы.length}</span>`:""}</td>
    </tr>`;}).join(""):`<tr><td colspan="5" class="empty">На этот период задач нет.</td></tr>`;

  document.getElementById("main").innerHTML=`
    ${printHead("Задачи", имяПериода(зф.период,зф.база)+" · всего "+и.всего)}
    <div class="head"><h2>Задачи</h2>
      <span class="sub">${esc(имяПериода(зф.период,зф.база))}</span>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Поиск по задаче или исполнителю…" value="${esc(query)}"></div>
      <div class="spring"></div>
      ${яНачальник()?`<button class="btn primary" onclick="editTask('')">+ Задача</button>`:""}
      <button class="btn" onclick="renderОтчёт()">▤ Отчёт</button>
      <button class="btn" onclick="window.print()">⎙ PDF</button></div>

    <div class="filters noprint seg">
      ${ГОРИЗОНТЫ.map(([v,т])=>пер(v,т)).join("")}
      <span class="fnote" style="margin-left:8px">
        <button class="btn small" onclick="сдвигПериода(-1)">←</button>
        <button class="btn small" onclick="сегодняПериод()">сейчас</button>
        <button class="btn small" onclick="сдвигПериода(1)">→</button>
      </span>
    </div>
    <div class="filters noprint">
      <select onchange="зф.статус=this.value;renderTasks()">
        <option value="">Все состояния</option>
        ${Object.keys(СОСТОЯНИЯ).map(k=>`<option value="${k}" ${зф.статус===k?"selected":""}>${СОСТОЯНИЯ[k].т}</option>`).join("")}
      </select>
      <select onchange="зф.исполнитель=this.value;renderTasks()">
        <option value="">Все исполнители</option>
        ${исполнители.map(и=>`<option ${зф.исполнитель===и?"selected":""}>${esc(и)}</option>`).join("")}

// Кнопки зависят от роли: исполнитель ведёт работу, постановщик принимает.
function действияЗадачи(з,я,мой){
  const b=(т,ф,к)=>`<button class="btn ${к||""}" onclick="${ф}">${т}</button>`;
  let из="";
  if(з.статус==="назначена")  из+=b("Принять в работу",`ходЗадачи('${esc(з.id)}','принята')`);
  if(з.статус==="принята"||з.статус==="доработка")
                              из+=b("Отметить выполненной",`ходЗадачи('${esc(з.id)}','выполнена')`,"primary");
  if(з.статус==="выполнена" && мой){
    из+=b("Принять работу",`ходЗадачи('${esc(з.id)}','закрыта')`,"primary");
    из+=b("Вернуть на доработку",`вернутьЗадачу('${esc(з.id)}')`);
  }
  if(з.статус!=="закрыта" && з.статус!=="отменена")
                              из+=b("Перенести срок",`перенестиДиалог('${esc(з.id)}')`);
  if(я && з.статус!=="отменена") из+=b("Отменить",`ходЗадачи('${esc(з.id)}','отменена')`);
  return из;
}
function ходЗадачи(id,новый){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  з.статус=новый;
  const сегодня=new Date().toISOString().slice(0,10);
  if(новый==="принята")  з.принято=сегодня;
  if(новый==="выполнена"){ з.выполнено=сегодня; з.причина_возврата=""; }
  if(новый==="закрыта")  з.проверено=сегодня;
  отметитьЗадачу(з);
  if(новый==="закрыта"){
    const сл=продолжитьПовтор(з);
    if(сл) toast("Следующая задача создана на "+ru(сл.срок));
  }
  editTask(id);
}
function вернутьЗадачу(id){
  const п=prompt("Причина возврата на доработку:");
  if(п===null) return;
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  з.статус="доработка"; з.причина_возврата=п; з.выполнено="";
  отметитьЗадачу(з); editTask(id);
}
function перенестиДиалог(id){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  const н=prompt("Новый срок (ГГГГ-ММ-ДД):", з.срок||"");
  if(!н) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(н)){ toast("Дата в виде ГГГГ-ММ-ДД"); return; }
  const п=prompt("Причина переноса (можно пропустить):")||"";
  перенести(id,н,п); editTask(id);
}
function saveTask(id){
  const v=k=>{const el=document.getElementById(k);return el?el.value.trim():"";};
  const что=v("t_что");
  if(!что){ toast("Напишите, что сделать"); return; }
  const з=id?ЗАД.find(x=>x.id===id):null;
  const поля={что:что, подробно:v("t_подробно"), срок:v("t_срок"),
    горизонт:v("t_горизонт"), исполнитель:v("t_исполнитель"), место:v("t_место"),
    повтор:v("t_повтор"), повтор_до:v("t_повтор_до")};
  if(з){
    // Смена срока через форму — тоже перенос, с сохранением истории
    if(поля.срок && з.срок && поля.срок!==з.срок){
      if(!з.срок_первый) з.срок_первый=з.срок;
      з.переносы=(з.переносы||[]).concat([{было:з.срок, стало:поля.срок, причина:"правка",
        когда:new Date().toISOString().slice(0,10)}]);
    }
    Object.assign(з,поля); отметитьЗадачу(з);
  } else {
    ЗАД.push(Object.assign({id:newId("ЗД"), статус:"назначена",
      постановщик:getWS().код, создано:new Date().toISOString(),
      изменено:new Date().toISOString(), место_правки:getWS().код}, поля));
    saveReg(REG_ЗАД,ЗАД);
  }
  switchView("tasks"); toast(id?"Задача изменена":"Задача поставлена");
}
function delTask(id){
  const з=ЗАД.find(x=>x.id===id); if(!з) return;
  if(!confirm("Удалить задачу «"+(з.что||"")+"»?\n\nУдаление перенесётся на другие места при обмене.")) return;
  з.удалено=new Date().toISOString(); отметитьЗадачу(з);
  switchView("tasks"); toast("Задача удалена");
}

// ── Паспорт ЛНК (СДАНК-01-2020, Приложение 3) ──────────────
// Разделы 1-5 собираются из настоящих данных: карточки лаборатории,
// справочника специалистов (с аттестациями) и справочника приборов.
// Разделы 6-11 форма требует, а данных для них в программе нет —
// НЕ выдумываю: печатаются заголовки разделов с честной пометкой,
// что заполнить нечем, а не пустые таблицы, которые выглядели бы как
// «в лаборатории этого нет».
function специалистДляПаспорта(сп){
  const атт=аттестации(сп);
  const методСтрока=атт.length ? атт.map(а=>{
    let s=(а.метод||"—");
    if(а.уровень) s+=" ур."+а.уровень;
    if(а.объекты) s+=" ("+а.объекты+")";
    return s;
  }).join("; ") : "";
  const аттДаты=атт.length ? атт.map(а=>{
    let s=[];
    if(а.дата) s.push("аттестован "+ru(а.дата));
    if(а.номер) s.push("уд. № "+а.номер);
    if(а.орган) s.push(а.орган);
    if(а.до) s.push("до "+ru(а.до));
    return s.join(", ");
  }).join("; ") : "";
  const пбз=пб(сп);
  const пбСтрока=пбз && пбз.номер
    ? ("ПБ: уд. № "+пбз.номер+(пбз.дата?(" от "+ru(пбз.дата)):"")) : "";
  return {
    фио: типографика(сп.фио||сп.вдок||""),
    основание: "по основному месту работы",
    должность: типографика([сп.должность, сп.функции, методСтрока].filter(Boolean).join(" · ")),
    образование: типографика([сп.образование, сп.стаж ? ("стаж по НК с "+сп.стаж) : ""]
      .filter(Boolean).join("; ")),
    аттестация: типографика([аттДаты, пбСтрока].filter(Boolean).join("; "))
  };
}
// Категория прибора определяет, в какой из разделов 5–8 паспорта (одна и
// та же Форма 2 СДАНК-01-2020) он попадёт. У записей без категории (старые,
// заведённые до этого поля, или из журнала/приборов, где категория не
// заполнялась) считаем «Средство НК» — иначе раздел 5 внезапно опустеет.
function приборКатегория(x){ return x.категория || "Средство НК"; }
function приборыПоКатегориям(){
  const г={}; КАТЕГОРИИ_СИ.forEach(к=>г[к]=[]);
  live(S).forEach(x=>{ const к=приборКатегория(x); if(!г[к]) г[к]=[]; г[к].push(x); });

// Таблицы паспорта — с рамками (в отличие от таблицы подписей акта, где
// рамок нет). Шрифт в ячейках чуть мельче основного текста (sz 24 = 12 пт
// против sz 28 = 14 пт) — так же, как на экране .doctbl мельче .aktp.
const КЕГЛЬ_ТАБЛ='<w:sz w:val="24"/><w:szCs w:val="24"/>';
function rPrТабл(жирный){ return '<w:rPr>'+ФОНТ+(жирный?'<w:b/>':'')+КЕГЛЬ_ТАБЛ+'</w:rPr>'; }
function wRunТабл(t,жирный){ return '<w:r>'+rPrТабл(жирный)+'<w:t xml:space="preserve">'+X(t)+'</w:t></w:r>'; }
function wГраницыТабл(){
  const атр='w:val="single" w:sz="4" w:space="0" w:color="808080"';
  return ['top','left','bottom','right','insideH','insideV']
    .map(с=>'<w:'+с+' '+атр+'/>').join('');
}
function wЯчейкаТабл(t, ш, шапка){
  return '<w:tc><w:tcPr><w:tcW w:w="'+ш+'" w:type="dxa"/>'+
    (шапка?'<w:shd w:val="clear" w:color="auto" w:fill="F0F0F0"/>':'')+
    '<w:tcMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/>'+
    '<w:top w:w="40" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/></w:tcMar></w:tcPr>'+
    '<w:p><w:pPr><w:spacing w:after="0" w:line="260" w:lineRule="exact"/>'+
    '<w:jc w:val="left"/>'+rPrТабл(шапка)+'</w:pPr>'+(t?wRunТабл(t,шапка):'')+'</w:p></w:tc>';
}
function wСтрокаТабл(ячейки, ширины, шапка){
  return '<w:tr>'+(шапка?'<w:trPr><w:tblHeader/></w:trPr>':'')+
    ячейки.map((t,i)=>wЯчейкаТабл(t,ширины[i],шапка)).join('')+'</w:tr>';
}
// Таблица с шапкой (специалисты, приборы): первая строка — заголовки.
function wТаблШапка(шапка, ширины, строки){
  const grid=ширины.map(ш=>'<w:gridCol w:w="'+ш+'"/>').join('');
  let из='<w:tbl><w:tblPr><w:tblW w:w="'+ШИРИНА_ТЕКСТА+'" w:type="dxa"/>'+
    '<w:tblBorders>'+wГраницыТабл()+'</w:tblBorders>'+
    '<w:tblLayout w:type="fixed"/>'+
    '<w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar>'+
    '</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>';
  из+=wСтрокаТабл(шапка,ширины,true);
  строки.forEach(р=>из+=wСтрокаТабл(р,ширины,false));
  из+='</w:tbl>';
  return из;
}
// Таблица «метка — значение» (раздел 1): без строки заголовка, пустые
// значения пропускаются — как ryed() в экранной версии.
function wТаблКВ(строки){
  const ШК=2800, ШЗ=ШИРИНА_ТЕКСТА-ШК, ширины=[ШК,ШЗ];
  const grid='<w:gridCol w:w="'+ШК+'"/><w:gridCol w:w="'+ШЗ+'"/>';
  let из='<w:tbl><w:tblPr><w:tblW w:w="'+ШИРИНА_ТЕКСТА+'" w:type="dxa"/>'+
    '<w:tblBorders>'+wГраницыТабл()+'</w:tblBorders>'+
    '<w:tblLayout w:type="fixed"/>'+
    '<w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar>'+
    '</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>';
  строки.filter(([,v])=>v).forEach(([k,v])=>из+=wСтрокаТабл([k,v],ширины,false));
  из+='</w:tbl>';
  return из;
}

// ── Проверка данных ───────────────────────────────────────
// Раздел отвечает на один вопрос: что в базе не сходится само с собой.
// Никаких оценок «правильно ли вы работаете» — только факты, которые
// видно из самих данных: дубль, пропуск, ссылка в никуда, пустое поле.
//
// Разделено на три уровня, и это важно. «Ошибка» — то, что не может
// быть верным ни при каких условиях. «Внимание» — то, что обычно
// означает недоделку, но может быть и нормой. «Наблюдение» — то, где
// я не знаю вашего порядка и потому НЕ называю это ошибкой, а просто
// показываю. Спорное в первые два уровня не попадает.
function проверки(){
  const из=[];
  const доб=(ур,тема,текст,подробно)=>из.push({ур,тема,текст,подробно:подробно||[]});
  const L=liveJ();

  // ── Ошибки ──────────────────────────────────────────────
  const без=L.filter(z=>!z.дата);
  if(без.length) доб("ошибка","Журнал", без.length+" записей без даты контроля",
    без.slice(0,10).map(z=>z.id+" · "+(z.объект||"без объекта")));

  const безОб=L.filter(z=>!z.объект && !z.наименование);
  if(безОб.length) доб("ошибка","Журнал", безОб.length+" записей без объекта контроля",
    безОб.slice(0,10).map(z=>z.id+" · "+ru(z.дата)));

  const столк=проверитьСтолкновения();
  if(столк.length) доб("ошибка","Нумерация",
    "Один номер протокола у разных записей: "+столк.length, столк.slice(0,10));

  const прос=live(S).filter(x=>{ const[c]=siStatus(x); return c==="bad"; });
  if(прос.length) доб("ошибка","Приборы", прос.length+" приборов с просроченной поверкой",
    прос.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")+" — до "+ru(x.поверка_до)));

  // Дубли карточек объектов: одинаковое наименование и одинаковый
  // непустой заводской ИЛИ регистрационный номер — двух карточек с одним
  // и тем же номером быть не может, это ошибка. Одинаковое наименование
  // совсем без номеров — не ошибка (может быть просто россыпь одинаковых
  // мелких объектов), только наблюдение: порядок заказчика неизвестен.
  const поНаим={};
  live(O).forEach(o=>{ const н=(o.наименование||"").trim(); if(!н) return;
    (поНаим[н]=поНаим[н]||[]).push(o); });
  const дублиНомер=[], дублиБезНомера=[];
  Object.keys(поНаим).forEach(н=>{
    const г=поНаим[н]; if(г.length<2) return;
    const поНомеру={};
    г.forEach(o=>{ [o.зав,o.рег].forEach(ном=>{ ном=String(ном||"").trim(); if(!ном) return;
      (поНомеру[ном]=поНомеру[ном]||[]).push(o); }); });
    Object.keys(поНомеру).forEach(ном=>{
      if(поНомеру[ном].length>1) дублиНомер.push("«"+н+"», номер «"+ном+"» — "+
        поНомеру[ном].length+" карточек");
    });
    const безНомера=г.filter(o=>!String(o.зав||"").trim() && !String(o.рег||"").trim());
    if(безНомера.length>1) дублиБезНомера.push("«"+н+"» без номеров — "+безНомера.length+" карточек");
  });
  if(дублиНомер.length) доб("ошибка","Объекты",
    "Один заводской/регистрационный номер у разных карточек: "+дублиНомер.length, дублиНомер.slice(0,10));
  if(дублиБезНомера.length) доб("наблюдение","Объекты",
    "Одинаковое наименование без заводского и регистрационного номера у нескольких карточек: "+
    дублиБезНомера.length+" случаев — разные объекты без номеров или лишние карточки, не знаю",
    дублиБезНомера.slice(0,10));

  // ── Аттестация персонала ────────────────────────────────
  // Главный вопрос проверки: имел ли человек право выполнять тот метод,
  // который стоит в журнале. Сверяем удостоверения с журналом, ничего не
  // домысливая: сравниваются дата контроля и срок действия аттестации.
  const сегодня=new Date().toISOString().slice(0,10);
  const просАтт=[];
  live(P).forEach(c=>аттестации(c).forEach(а=>{
    if(а.до && а.до<сегодня) просАтт.push((c.вдок||c.фио)+" · "+а.метод+
      (а.уровень?(" ур. "+а.уровень):"")+" — до "+ru(а.до));
  }));
  if(просАтт.length) доб("ошибка","Специалисты",
    просАтт.length+" аттестаций с истёкшим сроком", просАтт.slice(0,10));

  // Метод выполнен, а действующей аттестации на него у исполнителя нет
  const безАтт={};
  L.forEach(z=>methodsOf(z).forEach(м=>{
    const и=String((z.методы[м]||{}).исп||"").trim(); if(!и) return;
    const c=специалистПоИмени(и); if(!c) return;
    if(!аттестации(c).length) return;                 // аттестации ещё не внесены — не ошибка
    if(аттестацияНа(c, м, z.дата)) return;
    const к=и+" · "+м;
    безАтт[к]=(безАтт[к]||0)+1;
  }));
  const ключиБА=Object.keys(безАтт);
  if(ключиБА.length) доб("ошибка","Специалисты",
    "Метод выполнен без действующей аттестации: "+ключиБА.length+" сочетаний",
    ключиБА.slice(0,10).map(к=>к+" — записей: "+безАтт[к]));

  const скороАтт=[];
  live(P).forEach(c=>аттестации(c).forEach(а=>{
    if(!а.до || а.до<сегодня) return;
    const дней=Math.round((new Date(а.до)-new Date(сегодня))/86400000);
    if(дней<=60) скороАтт.push((c.вдок||c.фио)+" · "+а.метод+" — через "+дней+" дн.");
  }));
  if(скороАтт.length) доб("внимание","Специалисты",
    скороАтт.length+" аттестаций истекают в ближайшие два месяца", скороАтт);

  const безВнесённых=live(P).filter(c=>!аттестации(c).length);
  if(безВнесённых.length) доб("внимание","Специалисты",
    безВнесённых.length+" из "+live(P).length+" специалистов без внесённых аттестаций — "+
    "сверить журнал с удостоверениями нечем",
    безВнесённых.map(c=>c.вдок||c.фио));

  // Удостоверение о проверке знаний правил безопасности — отдельный от
  // квалификационного документ (СДАНК-02-2020, Приложение 6): без него
  // квалификационное недействительно. Если аттестации по методам НК
  // внесены, а этого удостоверения нет — не ошибка (могло не дойти
  // до внесения в программу), но отметить стоит.
  const безПБ=live(P).filter(c=>аттестации(c).length && !(пб(c)&&пб(c).номер));
  if(безПБ.length) доб("внимание","Специалисты",
    безПБ.length+" специалистов с аттестацией по методам НК без внесённого удостоверения ПБ",
    безПБ.map(c=>c.вдок||c.фио));

  // Инструктаж по охране труда — раз в 90 дней (со слов заказчика).
  // Дата не внесена вовсе — не ошибка (мог пройти, просто не записали);
  // а вот просроченный срок — уже нарушение, как просроченная поверка.
  const безИнстр=live(P).filter(c=>!c.инструктаж_дата);
  if(безИнстр.length) доб("внимание","Специалисты",
    безИнстр.length+" из "+live(P).length+" специалистов без внесённой даты инструктажа по охране труда",
    безИнстр.map(c=>c.вдок||c.фио));
  const простИнстр=live(P).filter(c=>{ const д=инструктажДо(c.инструктаж_дата); return д && д<сегодня; });
  if(простИнстр.length) доб("ошибка","Специалисты",
    простИнстр.length+" специалистов с просроченным инструктажем по охране труда",
    простИнстр.map(c=>(c.вдок||c.фио)+" — истёк "+ru(инструктажДо(c.инструктаж_дата))));

  // ── Лаборатория ─────────────────────────────────────────
  const л=getЛаб();
  if(!л.организация && !л.наименование) доб("внимание","Лаборатория",
    "Карточка лаборатории не заполнена — шапка акта останется пустой");
  if(л.свид_до && л.свид_до<сегодня) доб("ошибка","Лаборатория",
    "Аттестация лаборатории просрочена — до "+ru(л.свид_до));
  else if(л.свид_до){
    const дней=Math.round((new Date(л.свид_до)-new Date(сегодня))/86400000);
    if(дней<=90) доб("внимание","Лаборатория","Аттестация лаборатории истекает через "+дней+" дн.");
  }
  if(л.проверка && л.проверка>=сегодня){
    const дней=Math.round((new Date(л.проверка)-new Date(сегодня))/86400000);
    if(дней<=30) доб("внимание","Лаборатория","Плановая проверка ЛНК через "+дней+" дн.");
  }
  // Метод есть в области аттестации ЛНК, а аттестованных людей на него нет
  if((л.методы||[]).length){
    const нет=(л.методы||[]).filter(м=>!live(P).some(c=>аттестацияНа(c,м)));
    const естьХотьОдна=live(P).some(c=>аттестации(c).length);
    if(нет.length && естьХотьОдна) доб("внимание","Лаборатория",
      "Методы области аттестации без аттестованных специалистов: "+нет.join(", "));
  }
  // Метод применяется в журнале, а в области аттестации ЛНК его нет
  if((л.методы||[]).length){
    const применяются=[...new Set(L.flatMap(z=>methodsOf(z)))];
    const вне=применяются.filter(м=>(л.методы||[]).indexOf(м)<0);
    if(вне.length) доб("наблюдение","Лаборатория",
      "В журнале есть методы вне области аттестации ЛНК: "+вне.join(", "),
      ["Возможно, область в карточке заполнена не полностью — сверьте со свидетельством."]);
  }

  // ── Внимание ────────────────────────────────────────────
  const безП=live(S).filter(x=>!x.поверка_до);
  if(безП.length) доб("внимание","Приборы",
    безП.length+" из "+live(S).length+" приборов без даты поверки — срок не отслеживается",
    безП.slice(0,10).map(x=>x.наименование+(x.зав?(" · зав. "+x.зав):"")));

  // Актуализация нормативных документов (раздел 9 паспорта): свой срока
  // действия документы не имеют, это внутренняя проверка — раз в год
  // сверять список с действующими изданиями. Дата не внесена — не
  // ошибка (могли ещё не проверять), а вот проверка старше года —
  // уже недоделка, как просроченная поверка.
  const ндБезПроверки=live(НД).filter(x=>!x.проверено);
  if(ндБезПроверки.length) доб("внимание","Норм. документы",
    ндБезПроверки.length+" из "+live(НД).length+" документов без даты проверки на актуальность",
    ндБезПроверки.slice(0,10).map(x=>x.наименование));
  const ндПросрочены=live(НД).filter(x=>x.проверено && ндАктуальноДо(x.проверено)<сегодня);
  if(ндПросрочены.length) доб("ошибка","Норм. документы",
    ндПросрочены.length+" документов не проверялись на актуальность больше года",
    ндПросрочены.slice(0,10).map(x=>x.наименование+" — проверен "+ru(x.проверено)));

  // Пропуск в нумерации — обычно аннулированный протокол, но проверить стоит
  const дыры=[];
  METHODS.forEach(м=>{
    const поГодам={};
    L.forEach(z=>{ const н=номерМетода(z,м), г=годЗаписи(z);
      if(/^\d+$/.test(н) && г){ (поГодам[г]=поГодам[г]||new Set()).add(+н); } });
    Object.keys(поГодам).sort().forEach(г=>{
      const н=[...поГодам[г]], макс=Math.max(...н), есть=new Set(н), нет=[];
      for(let i=1;i<макс;i++) if(!есть.has(i)) нет.push(i);
      if(нет.length) дыры.push(м+" "+г+": пропущены "+нет.slice(0,15).join(", ")+
        (нет.length>15?(" …всего "+нет.length):""));
    });
  });
  if(дыры.length) доб("внимание","Нумерация",
    "Пропуски в сплошной нумерации: "+дыры.length, дыры.slice(0,10));

  const ждут=L.filter(ждётНомеров);
  if(ждут.length) доб("внимание","Нумерация", ждут.length+" записей ждут номера",
    ждут.slice(0,10).map(z=>ru(z.дата)+" · "+(z.объект||"")+" — "+методыБезНомера(z).join(", ")));

  let безИсп=[];
  L.forEach(z=>methodsOf(z).forEach(м=>{
    if(!String((z.методы[м]||{}).исп||"").trim())
      безИсп.push(ru(z.дата)+" · "+(z.объект||"")+" · "+м); }));
  if(безИсп.length) доб("внимание","Журнал",
    безИсп.length+" методов без исполнителя", безИсп.slice(0,10));

  const спр=new Set(); live(P).forEach(x=>{ if(x.вдок) спр.add(x.вдок.trim()); if(x.фио) спр.add(x.фио.trim()); });
  const чужие=new Set();
  L.forEach(z=>methodsOf(z).forEach(м=>{ const и=String((z.методы[м]||{}).исп||"").trim();
    if(и && !спр.has(и)) чужие.add(и); }));
  if(чужие.size) доб("внимание","Специалисты",
    "Исполнители из журнала, которых нет в справочнике: "+чужие.size, [...чужие].slice(0,10));

  // ── Наблюдения ──────────────────────────────────────────
  if(ППР.позиции && ППР.позиции.length){
    const завСИ=new Set(); live(S).forEach(x=>{ if(x.зав) завСИ.add(String(x.зав).trim()); });
    const нет=ППР.позиции.filter(п=>{
      const м=String(п.наименование||"").match(/№\s*([0-9A-Za-zА-Яа-я\-\/]+)/g)||[];
      return !м.some(x=>завСИ.has(x.replace(/^№\s*/,"")));
    });
    if(нет.length) доб("наблюдение","План ППР",
      нет.length+" позиций плана не нашлись в справочнике приборов по заводскому номеру",
      нет.slice(0,10).map(п=>п.наименование).concat(
        ["Возможно, так и должно быть: в справочнике — средства измерения, "+
         "а в плане ППР ещё и оснастка (меры, образцы, плиты). Не считаю ошибкой."]));
    if(ППР.замечания && ППР.замечания.length)
      доб("наблюдение","План ППР","Расхождения в книге плана-графика: "+ППР.замечания.length,
          ППР.замечания);
  }
  return из;
}
function числоПроблем(){

}

function exportПроверкуXlsx(){
  const строки=[];
  проверки().forEach(x=>{
    строки.push([x.ур, x.тема, x.текст, ""]);
    x.подробно.forEach(t=>строки.push(["", "", "", t]));
  });
  if(!строки.length) строки.push(["", "", "Расхождений не найдено", ""]);
  xlsxФайл("Проверка данных ЛНК "+сегодня()+".xlsx",[{имя:"Проверка",
    колонки:[{з:"Уровень",ш:14},{з:"Раздел",ш:16},{з:"Что найдено",ш:64},{з:"Подробности",ш:70}],
    строки:строки}]);
  toast("Проверка выгружена: "+строки.length+" строк");
}

// ── Выгрузка в Excel (.xlsx) ──────────────────────────────
// Раньше выгружался CSV. В Office 2016 это лотерея: разделитель столбцов
// CSV берёт из региональных настроек Windows, и на другой машине файл
// открывается одной колонкой. Плюс даты и числа приезжают текстом.
// Настоящий .xlsx — это тот же ZIP, что и .docx, писать его умеем.
//
// Строки кладём прямо в ячейки (inlineStr), без общей таблицы строк:
// файл чуть больше, зато собирается в один проход и не может разъехаться.
const XL_ЭПОХА = Date.UTC(1899,11,30);          // Excel считает дни от 30.12.1899
function xlДата(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||"")); if(!m) return null;
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-XL_ЭПОХА)/86400000);
}
function xlБуква(n){                             // 1 → A, 27 → AA
  let s=""; while(n>0){ const о=(n-1)%26; s=String.fromCharCode(65+о)+s; n=(n-о-1)/26; }
  return s;
}
function xlЯчейка(адрес, знач, тип){
  if(знач==null || знач==="") return "";
  if(тип==="дата"){
    const д=xlДата(знач);
    if(д!=null) return '<c r="'+адрес+'" s="2"><v>'+д+'</v></c>';
  }
  if(тип==="число"){
    const ч=Number(String(знач).replace(",","."));
    if(isFinite(ч) && String(знач).trim()!=="") return '<c r="'+адрес+'"><v>'+ч+'</v></c>';
  }
  return '<c r="'+адрес+'" t="inlineStr"><is><t xml:space="preserve">'+X(знач)+'</t></is></c>';
}
function xlЛист(лист){
  const кол=лист.колонки, N=кол.length, M=лист.строки.length;
  let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<dimension ref="A1:'+xlБуква(N)+Math.max(1,M+1)+'"/>'+
    // шапка закреплена — иначе на 315 строках непонятно, что за столбец
    '<sheetViews><sheetView workbookViewId="0">'+
    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'+
    '</sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/><cols>';
  кол.forEach((к,i)=>{ xml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(к.ш||16)+'" customWidth="1"/>'; });
  xml+='</cols><sheetData><row r="1">';
  кол.forEach((к,i)=>{ xml+='<c r="'+xlБуква(i+1)+'1" t="inlineStr" s="1"><is><t>'+X(к.з)+'</t></is></c>'; });
  xml+='</row>';
  лист.строки.forEach((стр,ri)=>{
    const r=ri+2; xml+='<row r="'+r+'">';
    стр.forEach((v,ci)=>{ xml+=xlЯчейка(xlБуква(ci+1)+r, v, кол[ci].тип); });
    xml+='</row>';
  });
  xml+='</sheetData>';
  // По схеме autoFilter идёт ПОСЛЕ sheetData, а не до — иначе Excel
  // объявит книгу повреждённой (та же строгость, что и в Word).
  if(M) xml+='<autoFilter ref="A1:'+xlБуква(N)+(M+1)+'"/>';
  return xml+'</worksheet>';
}
function xlsxФайл(имяФайла, листы){
  const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const стили='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="DD.MM.YYYY"/></numFmts>'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill>'+
    '<fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="3">'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';
  let книга='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="'+R+'"><sheets>';
  let связи='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  let типы='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
  const файлы=[{имя:"xl/styles.xml", данные:стили}];
  листы.forEach((л,i)=>{
    const n=i+1;
    книга+='<sheet name="'+X(л.имя)+'" sheetId="'+n+'" r:id="rId'+n+'"/>';
    связи+='<Relationship Id="rId'+n+'" Type="'+R+'/worksheet" Target="worksheets/sheet'+n+'.xml"/>';
    типы+='<Override PartName="/xl/worksheets/sheet'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    файлы.push({имя:"xl/worksheets/sheet"+n+".xml", данные:xlЛист(л)});
  });
  книга+='</sheets></workbook>';
  связи+='<Relationship Id="rId'+(листы.length+1)+'" Type="'+R+'/styles" Target="styles.xml"/></Relationships>';
  типы+='</Types>';
  файлы.unshift(
    {имя:"[Content_Types].xml", данные:типы},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {имя:"xl/workbook.xml", данные:книга},
    {имя:"xl/_rels/workbook.xml.rels", данные:связи});
  dlBlob(имяФайла, zipStore(файлы));
}

// Что именно выгружаем. Журнал уходит полностью: в CSV терялось самое
// нужное — номера протоколов по методам, оставались одни названия методов.
function листЖурнала(строки){
  const колонки=[{з:"№ п/п",ш:7,тип:"число"},{з:"№ акта",ш:14},{з:"Дата",ш:12,тип:"дата"},
    {з:"Статус",ш:16},{з:"Подразделение",ш:20},{з:"Объект контроля",ш:38},
    {з:"Наименование в документе",ш:30},{з:"Заводской №",ш:14},{з:"Рег. №",ш:14}];
  METHODS.forEach(м=>{ колонки.push({з:м+" №",ш:13}); колонки.push({з:м+" исполнитель",ш:17}); });
  колонки.push({з:"Заключение",ш:40},{з:"Примечание",ш:24});
  const из=строки.map((z,i)=>{
    const р=[i+1, z.акт, z.дата, z.статус, z.подразделение, z.объект,
             z.наименование, завЗаписи(z), регЗаписи(z)];
    METHODS.forEach(м=>{ const v=(z.методы||{})[м]||{};
      р.push(обозначениеПротокола(z,м)||v.н||""); р.push(v.исп||""); });
    р.push(z.заключение, z.примечание);
    return р;
  });
  return {имя:"Журнал", колонки:колонки, строки:из};
}

function exportXlsx(){

}

// ── Стиль оформления ──────────────────────────────────────
const THEME_KEY="lnk_theme";
function applyTheme(t){
  if(t && t!=="default") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  const sel=document.getElementById("theme"); if(sel) sel.value=t;
}
(function initTheme(){
  let t="default";
  try{ t=localStorage.getItem(THEME_KEY)||"default"; }catch(e){}
  applyTheme(t);
  document.getElementById("theme").addEventListener("change",function(){ applyTheme(this.value); });
})();
