// ── Выдача номеров ────────────────────────────────────────
function нетПрава(){
  const g=getGrant();
  alert("Выдавать номера может только место, у которого сейчас право выдачи.\n\n"+
    (g.место ? ("Сейчас право у места: "+g.место) : "Право пока никому не назначено.")+
    "\n\nВкладка «Обмен» → «Право выдачи номеров»: там можно принять право на себя "+
    "или передать его другому месту.\n\nЗаписи при этом вводятся как обычно — они просто ждут номера.");
  switchView("exchange");
}
// Если право не назначено НИКОМУ — берём его на это место молча-понятно.
// Иначе на первом же запуске программа отказывается выдавать номера, и это
// выглядит поломкой, хотя механизм задуман для другого: не пускать ВТОРОЕ
// место выдавать номера одновременно с первым.
function правоЕслиНичьё(){
  if(правоМоё()) return true;
  const g=getGrant();
  if(!g.место){
    saveGrant({место:getWS().код, изменено:new Date().toISOString()});
    toast("Право выдачи номеров закреплено за местом "+getWS().код);
    return true;
  }
  return false;
}
function выдатьНомера(id){
  if(!правоЕслиНичьё()){ нетПрава(); return; }
  const z=J.find(x=>String(x.id)===String(id)); if(!z) return;
  const г=годЗаписи(z);
  if(!г){ toast("У записи не заполнена дата — год берётся из неё"); return; }
  const нет=методыБезНомера(z);
  if(!нет.length){ toast("У всех методов записи номера уже есть"); return; }
  const выдано=[];
  нет.forEach(м=>{
    const н=следующийПротокол(м,г);
    z.методы[м]=Object.assign({}, z.методы[м], {н:String(н)});
    выдано.push(дваЗнака(н)+"-"+г+"-"+м);
  });
  z.изменено=new Date().toISOString(); z.место=getWS().код;
  saveJournal();
  if(curView==="journal") renderJournal(); else if(curView==="docs") renderDocs();
  showJournal(id);
  alert("Выданы номера протоколов:\n\n"+выдано.join("\n"));
}
function выдатьАкт(id){
  if(!правоЕслиНичьё()){ нетПрава(); return; }
  const z=J.find(x=>String(x.id)===String(id)); if(!z) return;
  const г=годЗаписи(z);
  if(!г){ toast("У записи не заполнена дата — год берётся из неё"); return; }
  if(String(z.акт||"").trim()){ toast("У записи уже есть номер акта"); return; }
  const мет=methodsOf(z);
  const толькоТКВД = мет.length>0 && мет.every(м=>м==="ТК"||м==="ВД");
  if(толькоТКВД && !confirm("По методам "+мет.join(", ")+" акт, как правило, не оформляется.\n\nВсё равно выдать номер акта?")) return;
  const н=следующийАкт(г);
  z.акт="АКТ "+дваЗнака(н)+"-"+г;
  z.изменено=new Date().toISOString(); z.место=getWS().код;
  saveJournal();
  if(curView==="journal") renderJournal(); else if(curView==="docs") renderDocs();
  showJournal(id);
  toast("Выдан номер акта: "+z.акт);
}
function принятьПраво(){
  const g=getGrant(), ws=getWS();
  if(g.место===ws.код){ toast("Право уже у вас"); return; }
  const было = g.место ? ("Сейчас право у места: "+g.место+".\n\nЕсли там сейчас тоже выдают номера и вы "+
      "оба возьмёте право порознь, два места могут выдать один номер. Программа покажет такое "+
      "столкновение при обмене, но исправлять придётся вручную.\n\n") : "Право пока никому не назначено.\n\n";
  if(!confirm(было+"Принять право выдачи номеров на место "+ws.код+"?")) return;
  saveGrant({место:ws.код, изменено:new Date().toISOString()});
  renderExchange(); toast("Право выдачи номеров теперь у места "+ws.код);
}
function передатьПраво(){
  if(!правоМоё()){ toast("Передать можно только своё право"); return; }
  const кому=(prompt("Кому передать право выдачи номеров?\nУкажите код места (например М2):","")||"").trim();
  if(!кому) return;
  if(кому===getWS().код){ toast("Это ваше же место"); return; }
  saveGrant({место:кому, изменено:new Date().toISOString()});
  renderExchange();
  alert("Право передано месту "+кому+".\n\nОно получит его после обмена: выгрузите файл и передайте туда.");
}

// ── Акты и протоколы ──────────────────────────────────────
// Раздел отвечает на один рабочий вопрос: по каким записям документ уже
// оформлен, а по каким ещё нет. «Оформлен» = в документе вписано
// заключение (оно и хранится в записи).
let df="акты";                          // акты | без | нужно | готовые | все
function setDF(v){ df=v; renderDocs(); }
function оформлен(z){ return !!String(z.заключение||"").trim(); }
function docsRows(){
  const q=(query||"").toLowerCase();
  return liveJ().filter(z=>{
    if(df==="без" && !ждётНомеров(z)) return false;
    if(df==="готовые" && !(оформлен(z) && !ждётНомеров(z))) return false;
    if(df==="нужно" && (оформлен(z) || ждётНомеров(z))) return false;
    if(q && !((z.объект||"")+(z.акт||"")+(z.заключение||"")).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>String(b.дата||"").localeCompare(String(a.дата||"")));
}
function renderDocs(){
  const rows=docsRows();
  const всего=liveJ().length;
  const гот=liveJ().filter(z=>оформлен(z)&&!ждётНомеров(z)).length;
  const безном=liveJ().filter(ждётНомеров).length;
  const seg=(v,l,n)=>`<button class="btn ${df===v?"on":""}" onclick="setDF('${v}')">${l} <b>${n}</b></button>`;
  const акты=списокАктов();
  const q=(query||"").toLowerCase();
  const актыП=q?акты.filter(g=>(g.ключ+" "+g.записи.map(z=>z.объект).join(" ")).toLowerCase().includes(q)):акты;
  const bodyА=актыП.length?актыП.map(g=>{
    const zs=g.записи, дата=zs.map(z=>z.дата).filter(Boolean).sort();
    const мет=спискиАкта(zs);
    const ждут=zs.filter(ждётНомеров).length;
    return `<tr onclick="renderAkt('${esc(g.ключ)}')">
      <td class="num">${esc(номерАкта(g.ключ))}</td>
      <td class="num">${ru(дата[0])}${дата.length>1&&дата[дата.length-1]!==дата[0]?(" – "+ru(дата[дата.length-1])):""}</td>
      <td class="num">${zs.length}</td>
      <td class="obj">${esc([...new Set(zs.map(именоватьОбъект))].join("; ").slice(0,64))}</td>
      <td class="mets">${мет.map(g2=>`${g2.м}&nbsp;${g2.номера.length}`).join(" · ")||"<span class='muted'>—</span>"}
        ${ждут?`<span class="st work" style="margin-left:6px">${ждут} без номера</span>`:""}</td>
    </tr>`;}).join(""):`<tr><td colspan="5" class="empty">Актов не найдено.</td></tr>`;
  const body=rows.length?rows.map(z=>`
    <tr onclick="открытьДокумент('${esc(z.id)}')">
      <td class="num">${esc(z.акт)||"—"}</td>
      <td class="num">${ru(z.дата)}</td>
      <td class="obj">${esc(z.объект)}</td>
      <td>${methodsOf(z).map(m=>`<span class="pill">${m}</span>`).join("")||"<span class='muted'>—</span>"}</td>
      <td>${ждётНомеров(z) ? `<span class="st work">ждёт номера</span>`
        : оформлен(z) ? `<span class="st ok">готов</span>`
        : `<span class="st new">нет заключения</span>`}</td>
      <td class="obj muted" style="font-size:12px">${esc(String(z.заключение||"").slice(0,90))}${String(z.заключение||"").length>90?"…":""}</td>
    </tr>`).join(""):`<tr><td colspan="6" class="empty">Ничего не найдено.</td></tr>`;
  document.getElementById("main").innerHTML=`
    ${printHead("Акты и протоколы", df==="акты"?("актов "+актыП.length)
      : (df==="без"?"ждут номера":df==="готовые"?"готовые":df==="нужно"?"без заключения":"все")+" · записей "+rows.length)}
    <div class="head">
      <h2>Акты и протоколы</h2><span class="sub">${df==="акты"?(актыП.length+" актов"):(rows.length+" из "+всего)}</span>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Поиск: объект, № акта, текст заключения…" value="${esc(query)}"></div>
      <div class="spring"></div>
      <button class="btn" onclick="window.print()">⎙ PDF</button>
    </div>
    <div class="filters noprint seg">
      ${seg("акты","Акты",акты.length)}
      ${seg("без","Ждут номера",безном)}
      ${seg("нужно","Без заключения",всего-гот-безном)}
      ${seg("готовые","Готовы",гот)}
      ${seg("все","Все",всего)}
      <span class="fnote">клик по строке — открыть документ</span>
    </div>
    <div class="card"><div class="tblwrap"><table>
      ${df==="акты"
        ? `<thead><tr><th style="width:90px">№ акта</th><th style="width:110px">Дата</th><th style="width:70px">Объектов</th><th>Объект контроля</th><th>Документы</th></tr></thead>
           <tbody>${bodyА}</tbody>`
        : `<thead><tr><th>№ акта</th><th>Дата</th><th>Объект контроля</th><th>Методы</th><th>Документ</th><th>Заключение</th></tr></thead>
           <tbody>${body}</tbody>`}
    </table></div></div>`;
  wireSearch(renderDocs);

// ── Правка справочников (объекты / приборы / специалисты) ──
// Категория прибора — по какому из разделов 5–8 паспорта он идёт (Форма 2
// одна и та же для всех четырёх, паспорт делит записи по этому полю).
// У старых записей (заведённых до этого поля) категория пустая — паспорт
// считает пустую категорию «Средство НК», чтобы они не пропали из раздела 5.
const КАТЕГОРИИ_СИ=["Средство НК","Мера, образец, настроечный образец",
  "Дозиметрический или радиометрический СИ","Вспомогательное оборудование"];
// Состояние прибора — пять значений, подтверждённых заказчиком. Раньше
// поле было свободным текстом (у всех 41 карточки стояло «В работе»),
// сам этот перечень был моим черновиком в книге Excel — теперь он
// согласован и стал настоящим списком. «Списан» на отбор в заявку на
// поверку и в паспорт НЕ влияет: об этом заказчика спросил отдельно,

const СОСТОЯНИЯ_СИ=["В работе","На поверке","В ремонте","Выдан","Списан"];

// него ссылаются), но в документы не идёт: на поверку его не

// числится — прямое указание заказчика. Отбор для документов — через
// приборыВДокументы(), чтобы правило было в одном месте, а не
// повторялось в каждой форме.
function списанПрибор(п){
  return String(п.состояние||"").trim()===СОСТОЯНИЕ_СПИСАН;
}
function приборыВДокументы(){ return live(S).filter(x=>!списанПрибор(x)); }
// Для заявки на поверку и плана-графика — ещё и без неотъемлемых частей:
// часть представляют на поверку в составе основного прибора, отдельной
// строкой в этих документах ей быть незачем (потому у неё и не
// заполняются месяц, комплектность и класс точности).
function приборыДляЗаявки(){ return приборыВДокументы().filter(x=>!x.основной_ид); }
// Место хранения в карточке прибора — ссылка на помещение; на экране и
// в выгрузке показываем его идентификацию, а не внутренний id. Значение,
// которому карточка не нашлась (старый текст или удалённое помещение),
// возвращаем как есть — терять введённое нельзя.
function помещениеТекст(ссылка){
  const v=String(ссылка||"").trim(); if(!v) return "";
  const п=ПОМ && ПОМ.find(x=>String(x.id)===v);
  return п ? String(п.идентификация||"").trim() : v;
}
// Номер карточки учёта в книге ППР бывает не одним числом: «1…9»,
// «37..45, 61», «30..32». Разбираем только однозначные формы — число,
// перечисление через запятую, диапазон через «..», «…» или «-».
// Не разобралось — возвращаем null, и позиция считается непонятной:
// такую из плана не убираем, гадать по тексту не буду.
function карточкиПозиции(текст){
  const t=String(текст||"").trim(); if(!t) return null;
  const из=[];
  for(const кусок of t.split(",")){
    const ч=кусок.trim(); if(!ч) continue;
    const диап=/^(\d+)\s*(?:\.\.|…|-|—)\s*(\d+)$/.exec(ч);
    if(диап){
      const a=+диап[1], b=+диап[2]; if(a>b || b-a>500) return null;
      for(let i=a;i<=b;i++) из.push(String(i));
      continue;
    }
    if(/^\d+$/.test(ч)){ из.push(String(+ч)); continue; }
    return null;                       // непонятная форма — не гадаем
  }
  return из.length?из:null;
}
// Позиция плана ППР относится к списанному прибору, если ВСЕ её номера
// карточек принадлежат списанным приборам (и хотя бы один нашёлся).
// Позиция, номера которой не разобрались или не нашлись в картотеке,
// остаётся в плане: без связи с карточкой убирать её не из чего.
function позицияСписана(поз){
  const номера=карточкиПозиции(поз && поз.карточка); if(!номера) return false;
  const списанные=new Set(), живые=new Set();
  live(S).forEach(п=>{
    const к=карточкиПозиции(п.карточка); if(!к) return;
    к.forEach(н=>(списанПрибор(п)?списанные:живые).add(н));
  });
  let нашлось=false;
  for(const н of номера){
    if(живые.has(н)) return false;     // хоть один живой — позиция нужна
    if(списанные.has(н)) нашлось=true;
  }
  return нашлось;
}
// Позиции плана, которые реально планируются: без позиций списанных
// приборов. Через неё идут все перечисления плана (список, пульт,
// задачи, выгрузка в Word) — правило в одном месте.
function позицииППР(){
  return (ППР.позиции||[]).filter(п=>!позицияСписана(п));
}

// Аттестация специалиста — по каждому методу своя: уровень, объекты, номер
// удостоверения и срок действия. Без этого нельзя ответить на главный
// вопрос проверки: имел ли человек право выполнять тот метод, который
// стоит в журнале.
//
// Заказчик прислал СДАНК-01-2020 и СДАНК-02-2020 целиком (см. запись в
// CLAUDE.md) — срок действия удостоверения взят дословно оттуда (п.7.2
// СДАНК-02-2020): I и II уровень — 3 года, III уровень — 5 лет с даты
// аттестации. Этим же документом (разделы XI-XII) заведены три вида
// записи об аттестации — они не взаимозаменяемы:
//  • первичная — начинает отсчёт срока;
//  • продление — Независимый орган может продлить ОДНОКРАТНО на тот же
//    срок (3/5 лет), подаётся не раньше чем за 6 мес. до истечения
//    текущего срока и не позже чем через 6 мес. после; то же
//    удостоверение (тот же номер), отметка о продлении;
//  • повторная — обязательна по истечении ВТОРОГО срока (6 лет для I/II,
//    10 лет для III считая от даты первичной), проводится как первичная,
//    начинает новый цикл.
// Саму цепочку (что продление только одно на цикл, что дата отсчёта
// «второго срока» — от первичной, а не от продления) программа не
// отслеживает — данных для этого при плоском списке записей недостаточно,
// гадать не буду; за этим прямо в тексте документа следит Независимый
// орган, не ЛНК. Что программа делает — считает срок действия ОДНОЙ
// записи (какая бы она ни была: первичная, продление, повторная) по
// одной и той же формуле «дата + срок по уровню», подсказывает при вводе
// и сверяет в «Проверке данных».
const УРОВНИ=["I","II","III"];

const ВИДЫ_АТТЕСТАЦИИ=["Первичная","Продление","Повторная"];
// Метод для аттестации специалиста — не то же самое, что код метода в
// журнале: одно удостоверение «УК» (ультразвуковой контроль) со слов
// заказчика закрывает сразу и УЗД (дефектоскопия), и УЗТ (толщинометрия) —
// в журнале это разные коды (разные виды контроля по факту выполненной
// работы), а аттестуется специалист на них одним экзаменом. Поэтому для
// записи аттестации — свой список, не полный METHODS журнала.
const АТТЕСТАЦИЯ_МЕТОДЫ=["ВИК","УК","АЭ","ТВ","ТК","ВД","МК"];
function срокАттестации(дата,уровень){
  const лет=СРОК_АТТЕСТАЦИИ_ЛЕТ[уровень];
  if(!дата || !лет) return "";
  const d=new Date(дата+"T00:00:00");
  d.setFullYear(d.getFullYear()+лет);
  return d.toISOString().slice(0,10);
}
function аттестации(z){ return Array.isArray(z && z.аттестации) ? z.аттестации : []; }
// «УК» в записи аттестации закрывает оба журнальных кода ультразвука —
// УЗД и УЗТ (см. АТТЕСТАЦИЯ_МЕТОДЫ выше). Старые записи, где метод мог
// быть внесён как «УЗД»/«УЗТ» буквально (до этого разделения), по-прежнему
// совпадают точным сравнением — ничего не теряется.
function аттестацияОхватывает(аттМетод, журнМетод){
  if(аттМетод===журнМетод) return true;
  if(аттМетод==="УК" && (журнМетод==="УЗД"||журнМетод==="УЗТ")) return true;
  return false;
}

  const д=дата||new Date().toISOString().slice(0,10);
  return аттестации(спец).find(а=>аттестацияОхватывает(а.метод, метод) && (!а.до || а.до>=д)) || null;
}

// Выбор «ближайшей» записи из списка (аттестации по методам, классность):
// сначала среди ещё действующих ищем минимальный срок, если таких нет —
// самую недавно истёкшую, чтобы запись не потерялась молча. Общая для
// ближайшаяАттестация и ближайшаяКлассность (см. ниже) — не плодил копию.
function ближайшаяЗапись(список, поле){
  const из=(список||[]).filter(x=>x[поле]);
  if(!из.length) return null;
  const сегодня=new Date().toISOString().slice(0,10);
  const будущие=из.filter(x=>x[поле]>=сегодня).sort((a,b)=>a[поле]<b[поле]?-1:1);
  return будущие.length ? будущие[0] : из.slice().sort((a,b)=>a[поле]<b[поле]?-1:1).pop();
}

function ближайшаяАттестация(сп){

// Удостоверение о проверке знаний правил безопасности — ОТДЕЛЬНЫЙ документ
// от квалификационного (Приложение 6 СДАНК-02-2020): без него квалификационное
// удостоверение недействительно. Своя форма: номер, дата, протокол, допуск,
// плюс лист «Сведения о повторных проверках» — их может быть много.
function пб(z){ return (z && z.пб) || null; }
// Периодичность проверки знаний правил безопасности — раз в 3 года,
// заказчик подтвердил напрямую (в тексте СДАНК-02-2020 своего срока у неё
// нет, в отличие от п.7.2 у самой аттестации). Считается от ПОСЛЕДНЕЙ
// известной даты проверки: либо от первичной выдачи (пб.дата), либо от
// последней записи в «Сведения о повторных проверках знаний» — какая
// новее, там же где эти записи и накапливаются.
const ПБ_ПЕРИОД_ЛЕТ=3;
function пбПоследняяДата(сп){
  const з=пб(сп); if(!з) return "";
  const даты=[з.дата, ...(з.повторные||[]).map(п=>п.дата)].filter(Boolean);
  return даты.length ? даты.slice().sort().pop() : "";
}
function пбДо(сп){
  const д=пбПоследняяДата(сп);
  if(!д) return "";
  const d=new Date(д+"T00:00:00");
  d.setFullYear(d.getFullYear()+ПБ_ПЕРИОД_ЛЕТ);
  return d.toISOString().slice(0,10);
}

  const до=пбДо(сп);

  return срокЛаб(до);

function saveRegRec(kind,id){
  const C=REGS[kind], arr=C.arr(), rec={};
  C.fields.forEach(f=>{ const el=document.getElementById("rf_"+f.k); rec[f.k]=el?el.value.trim():""; });
  if(!rec[C.name]){ toast("Заполните: "+C.fields.find(f=>f.k===C.name).l); return; }
  rec.изменено=new Date().toISOString(); rec.место=getWS().код;
  if(C.контракты) rec.контракты=_контракты.filter(к=>String(к.год||"").trim());
  if(C.аттестации) rec.аттестации=_аттестации.filter(а=>String(а.метод||"").trim());
  if(C.классность) rec.классность=_классность.filter(к=>String(к.направление||"").trim()||String(к.класс||"").trim());
  if(C.пб){
    const н=id=>{ const el=document.getElementById(id); return el?el.value.trim():""; };
    const номер=н("пбНомер");
    if(номер || н("пбДата") || (_пб.повторные||[]).length){
      rec.пб={номер:номер, дата:н("пбДата"), протокол:н("пбПротокол"),
              допуск:н("пбДопуск"), повторные:(_пб.повторные||[]).filter(п=>String(п.дата||"").trim())};
    } else rec.пб=null;
  }
  if(id){ const i=arr.findIndex(x=>String(x.id)===String(id)); if(i>=0) arr[i]=Object.assign({},arr[i],rec); }
  else { rec.id=newId(C.pfx); arr.push(rec); }
  // Даты поверки неотъемлемых частей берутся у основного прибора —
  // выравниваем сразу: правили основной прибор, значит его части тоже
  // должны поехать за ним, а не ждать перезагрузки страницы.
  if(kind==="si") синхронизироватьЧасти();
  saveReg(C.key,arr); if(C.reindex) rebuildObjIndex();
  формаСохранена(); switchView(C.view); toast(id?"Сохранено":"Добавлено");
}
function delReg(kind,id){
  const C=REGS[kind], arr=C.arr(), z=arr.find(x=>String(x.id)===String(id)); if(!z) return;
  if(!confirm("Удалить «"+(z[C.name]||"")+"»?\n\nУдаление перенесётся на другие места при обмене.")) return;
  z.удалено=new Date().toISOString(); z.место=getWS().код;
  saveReg(C.key,arr); if(C.reindex) rebuildObjIndex();
  формаСохранена(); closeDrawer(); switchView(C.view); toast("Удалено");
}

// ── Импорт из Excel (справочники объектов и приборов) ──────
// Свой минимальный разбор .xlsx: ZIP-каталог читаю вручную по сигнатурам
// PK (как zipStore пишет), а распаковку DEFLATE делает браузер
// (DecompressionStream) — свой инфлейт не пишу, риск ошибиться на
// реальном файле. Библиотек не подключаю: программа остаётся одним
// файлом без сети (см. CLAUDE.md). Формат — только СВОЙ шаблон-таблица
// (кнопка «Шаблон для импорта» рядом), не исходная книга заказчика: там
// формулы и разметка, которые я не разбираю и разбирать не буду —
// смешивать со сборкой книги через scripts/export_json.py нельзя.

// N-1-2 склонение счётного слова — единственное место в программе, где
// это нужно динамически (текст диалога подтверждения импорта).
function числослово(n, формы){
  const n10=n%10, n100=n%100;
  if(n100>=11 && n100<=14) return формы[2];
  if(n10===1) return формы[0];
  if(n10>=2 && n10<=4) return формы[1];
  return формы[2];
}

function excelСерийДата(serial){
  // Excel считает 1900 год високосным (унаследованная ошибка Lotus
  // 1-2-3) — день 0 это 30.12.1899, и это учтено в константе 25569
  // (число дней от 30.12.1899 до 01.01.1970).
  const мс = Math.round((serial - 25569) * 86400 * 1000);
  return new Date(мс).toISOString().slice(0,10);
}
function значениеДаты(raw){
  const s=String(raw||"").trim();
  if(!s) return "";
  if(/^\d+(\.\d+)?$/.test(s)) return excelСерийДата(+s);
  let m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s);
  if(m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(m) return m[0].slice(0,10);
  return "";
}

function zipЧитать(buf){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  let eocd=-1;
  const низ=Math.max(0, buf.length-22-65557);
  for(let i=buf.length-22; i>=низ; i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("это не .xlsx (нет конца ZIP-архива)");
  const кол=dv.getUint16(eocd+10,true);
  const смещЦентр=dv.getUint32(eocd+16,true);
  const записи={};
  let p=смещЦентр;
  for(let i=0; i<кол; i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("повреждён архив (каталог)");
    const метод=dv.getUint16(p+10,true);
    const сжРазм=dv.getUint32(p+20,true);
    const имяДл=dv.getUint16(p+28,true);
    const допДл=dv.getUint16(p+30,true);
    const коммДл=dv.getUint16(p+32,true);
    const смещЛок=dv.getUint32(p+42,true);
    const имя=new TextDecoder("utf-8").decode(buf.subarray(p+46,p+46+имяДл));
    записи[имя]={метод,сжРазм,смещЛок};
    p+=46+имяДл+допДл+коммДл;
  }
  return {buf,dv,записи};
}
async function zipТекст(zip,имя){
  const e=zip.записи[имя];
  if(!e) return "";
  const dv=zip.dv, p=e.смещЛок;
  if(dv.getUint32(p,true)!==0x04034b50) throw new Error("повреждён архив (файл "+имя+")");
  const имяДл=dv.getUint16(p+26,true), допДл=dv.getUint16(p+28,true);
  const начало=p+30+имяДл+допДл;
  const сжатые=zip.buf.subarray(начало,начало+e.сжРазм);
  let байты;
  if(e.метод===0) байты=сжатые;
  else if(e.метод===8){
    const поток=new Blob([сжатые]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    байты=new Uint8Array(await new Response(поток).arrayBuffer());
  } else throw new Error("неизвестный способ сжатия ("+имя+")");
  return new TextDecoder("utf-8").decode(байты);
}
function деэскейпXML(s){
  // Числовые ссылки на символы (&#1053; / &#x41B;) — так openpyxl (и не
  // только он) кодирует кириллицу вместо сырого UTF-8. Без этой замены
  // русский текст в заголовках и ячейках приходит нечитаемым.
  return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(parseInt(d,10)))
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&amp;/g,"&");
}
function sharedStringsРазобрать(xml){
  if(!xml) return [];
  const из=[]; const siRe=/<si>([\s\S]*?)<\/si>/g; let m;
  while((m=siRe.exec(xml))){
    let текст=""; const tRe=/<t[^>]*>([\s\S]*?)<\/t>/g; let tm;
    while((tm=tRe.exec(m[1]))) текст+=деэскейпXML(tm[1]);
    из.push(текст);
  }
  return из;
}
function листРазобрать(xml, shared){
  const строки=[];
  const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(xml))){
    const ряд={};
    const cellRe=/<c\s+r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
    while((cm=cellRe.exec(rm[1]))){
      const столб=cm[1], атр=cm[2]||"", тело=cm[3]||"";
      const tМ=/\st="([a-zA-Z]+)"/.exec(атр);
      const тип=tМ?tМ[1]:"n";
      let значение="";
      if(тип==="s"){ const vm=/<v>([\s\S]*?)<\/v>/.exec(тело); значение=vm?(shared[+vm[1]]||""):""; }
      else if(тип==="inlineStr"){ const tm=/<t[^>]*>([\s\S]*?)<\/t>/.exec(тело); значение=tm?деэскейпXML(tm[1]):""; }
      else { const vm=/<v>([\s\S]*?)<\/v>/.exec(тело); значение=vm?деэскейпXML(vm[1]):""; }
      ряд[столб]=значение;
    }
    строки.push(ряд);
  }
  return строки;
}
async function xlsxРазобрать(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const zip=zipЧитать(buf);
  let sheetPath="xl/worksheets/sheet1.xml";
  const workbookXml=await zipТекст(zip,"xl/workbook.xml");
  const relsXml=await zipТекст(zip,"xl/_rels/workbook.xml.rels");
  const sheetM=/<sheet\b[^>]*\br:id="([^"]+)"[^>]*\/?>/.exec(workbookXml||"");
  if(sheetM && relsXml){
    const relM=new RegExp('<Relationship\\b[^>]*\\bId="'+sheetM[1]+'"[^>]*\\bTarget="([^"]+)"').exec(relsXml);
    if(relM){ const t=relM[1]; sheetPath = t.charAt(0)==="/" ? t.slice(1) : "xl/"+t; }
  }
  const sheetXml=await zipТекст(zip,sheetPath);
  if(!sheetXml) throw new Error("в файле не нашёлся лист с данными");
  const sharedXml=await zipТекст(zip,"xl/sharedStrings.xml");
  return листРазобрать(sheetXml, sharedStringsРазобрать(sharedXml));
}

const ИМПОРТ_НАЗВАНИЯ={obj:"Объекты",si:"Приборы (СИ)"};

function шаблонИмпортаXlsx(kind){
  const C=REGS[kind];
  const колонки=C.fields.map(f=>({з:f.l, ш:Math.max(14,Math.min(f.wide?44:28,f.l.length+6)),
    тип:f.type==="date"?"дата":undefined}));
  xlsxФайл("Шаблон импорта — "+ИМПОРТ_НАЗВАНИЯ[kind]+".xlsx",[{имя:C.view, колонки:колонки, строки:[]}]);
  toast("Шаблон скачан — заполните и загрузите этот же файл через «Импорт из Excel»");
}

async function импортФайлВыбран(kind, input){
  const file=input.files && input.files[0];
  input.value="";
  if(!file) return;
  if(typeof DecompressionStream==="undefined"){
    alert("Браузер не умеет распаковывать .xlsx (нет DecompressionStream) — обновите браузер "+
      "(нужен современный Chrome или Edge).");
    return;
  }
  let строки;
  try{ строки=await xlsxРазобрать(file); }
  catch(e){ alert("Не удалось прочитать файл: "+e.message); return; }
  if(строки.length<2){ alert("В файле нет данных — только шапка или файл пуст."); return; }
  импортПрименить(kind, строки);
}

function импортПрименить(kind, строки){
  const C=REGS[kind];
  // Шапка — первая строка. Колонки сопоставляю по ТЕКСТУ заголовка с
  // подписями полей карточки, а не по номеру: если в Excel переставили
  // столбцы, разбор всё равно сработает; лишние или неизвестные колонки
  // просто игнорируются.
  const шапка=строки[0];
  const сопост={};
  Object.keys(шапка).forEach(буква=>{
    const текст=String(шапка[буква]||"").trim().toLowerCase();
    const поле=C.fields.find(f=>f.l.trim().toLowerCase()===текст);
    if(поле) сопост[буква]=поле.k;
  });
  if(!Object.values(сопост).includes(C.name)){
    alert("Не нашёл колонку «"+C.fields.find(f=>f.k===C.name).l+"» — "+
      "сверьте шапку файла со скачанным шаблоном (заголовки не переименовывались?).");
    return;
  }
  const новые=[];
  const неНайденоПодр=new Set();
  for(let i=1;i<строки.length;i++){
    const ряд=строки[i];
    const rec={};
    Object.keys(сопост).forEach(буква=>{
      const ключ=сопост[буква];
      const поле=C.fields.find(f=>f.k===ключ);
      let знач=String(ряд[буква]||"").trim();
      if(поле && поле.type==="date") знач=значениеДаты(знач);
      else if(поле && поле.type==="ref" && знач){
        // Как и podr: в Excel — текст (например «23» у помещения), в
        // карточке — ссылка. Ищем по тому полю, которое поле-ссылка
        // само называет (refName); не нашли — оставляем пустым и
        // перечисляем в диалоге, а не подставляем что попало.
        const сп=(поле.ref?поле.ref():[])||[];
        const н=сп.find(x=>String(x[поле.refName]||"").trim().toLowerCase()===знач.toLowerCase());
        if(н) знач=н.id; else { неНайденоПодр.add(знач); знач=""; }
      }
      else if(поле && поле.type==="podr" && знач){
        // В Excel — название подразделения текстом, в карточке объекта —
        // ссылка на карточку ПОДР (как и у подразделения акта). Ищем по
        // тексту наименования; не нашли — не подставляем что попало,
        // оставляем пустым и предупреждаем.
        const п=live(ПОДР).find(x=>String(x.наименование||"").trim().toLowerCase()===знач.toLowerCase());
        if(п) знач=п.id; else { неНайденоПодр.add(знач); знач=""; }
      }
      rec[ключ]=знач;
    });
    if(!rec[C.name]) continue; // пустая строка (в т.ч. хвост шаблона) — не ошибка, просто пропуск
    rec.id=newId(C.pfx);
    rec.изменено=new Date().toISOString(); rec.место=getWS().код;
    новые.push(rec);
  }
  if(!новые.length){ alert("Заполненных строк не нашлось."); return; }
  const слово=числослово(новые.length,["запись","записи","записей"]);
  if(!confirm("Добавить "+новые.length+" "+слово+" в справочник «"+ИМПОРТ_НАЗВАНИЯ[kind]+"»?\n\n"+
    "Это ДОБАВЛЕНИЕ: существующие записи не трогаются и не заменяются. Если часть строк "+
    "уже была в справочнике, повторный ввод сам не распознаётся — "+
    (kind==="obj"?"после загрузки загляните в «Проверку данных», раздел покажет одинаковые номера.":
    "после загрузки сверьте список вручную.")+
    (неНайденоПодр.size?("\n\nПодразделение не подставится (нет такой карточки в «Подразделениях»): "+
    [...неНайденоПодр].join(", ")+" — впишете позже, в справочнике «Подразделения»."):""))) return;
  const arr=C.arr();
  новые.forEach(r=>arr.push(r));
  if(kind==="si") синхронизироватьЧасти();   // даты частей — у основного
  saveReg(C.key,arr); if(C.reindex) rebuildObjIndex();
  switchView(C.view);
  toast("Импортировано: "+новые.length);
}


// ── Пульт (сводка) ────────────────────────────────────────
// Что по задачам горит сегодня — для пульта. Считаются только свои
// задачи: производные и так видны на своих местах (план ППР, приборы).
function задачиНаСегодня(){
  const сегодня=new Date().toISOString().slice(0,10);
  const мои=ЗАД.filter(з=>живаяЗадача(з) && з.статус!=="закрыта")
    .filter(з=>з.срок && з.срок<=сегодня)
    .sort((a,b)=>String(a.срок).localeCompare(String(b.срок)));
  return { всего:мои.length, просрочено:мои.filter(просроченаЗадача).length, список:мои };
}
// Что горит на этой неделе (срок завтра..+7 дней) — чтобы не узнавать
// о просрочке постфактум, как «задачи на сегодня» выше. Тоже только свои —
// производные видны на своих местах.
function задачиСкоро(){
  const d=new Date(); const сегодня=d.toISOString().slice(0,10);
  d.setDate(d.getDate()+7); const через7=d.toISOString().slice(0,10);
  const мои=ЗАД.filter(з=>живаяЗадача(з) && з.статус!=="закрыта")
    .filter(з=>з.срок && з.срок>сегодня && з.срок<=через7)
    .sort((a,b)=>String(a.срок).localeCompare(String(b.срок)));
  return { всего:мои.length, список:мои };
}

function saveJournalRec(id){

  // разбираем её, чтобы номера легли в свои поля, а не только в строку.
  const v=(k)=>{const el=document.getElementById(k);return el?el.value.trim():"";};
  const объект=v("e_объект");
  if(!объект && !v("e_акт")){ toast("Заполните объект или № акта"); return; }
  const методы={};
  METHODS.forEach(m=>{
    const н=v("m_"+m+"_н"), исп=v("m_"+m+"_исп"), файл=v("m_"+m+"_файл");
    // Панель «Приборы и НД» открывалась — записываем её выбор в саму
    // запись (переопределение стандарта метода только здесь); не
    // открывалась — запись ничего не хранит и всегда следует за
    // текущим стандартным набором метода (getМетодики).
    const панель=document.getElementById("mset_"+m);
    const трогали=панель && панель.dataset.filled==="1";
    const запись={};
    if(н) запись.н=н; if(исп) запись.исп=исп; if(файл) запись.файл=файл;
    if(трогали){
      запись.приборы=[...document.querySelectorAll(".мчб_си_"+m+":checked")].map(c=>c.value);
      запись.нд=[...document.querySelectorAll(".мчб_нд_"+m+":checked")].map(c=>c.value);
    }
    if(н||исп||файл||трогали) методы[m]=запись;
  });
  // Строка объекта приходит из списка вместе с номерами: разбираем её,
  // а карточку ищем по имени вместе с заводским номером — по одному имени
  // нельзя, у десятков баллонов оно одинаковое.
  const имяОб=объект.replace(/,?\s*(зав|рег)\.?\s*№.*$/i,"").trim();
  const мЗав=/зав\.?\s*№\s*([^,;]+)/i.exec(объект), мРег=/рег\.?\s*№\s*([^,;]+)/i.exec(объект);
  const завОб=мЗав?мЗав[1].trim():"", регОб=мРег?мРег[1].trim():"";
  const spr=live(O).find(o=>String(o.наименование||"").trim()===имяОб &&
                            String(o.зав||"").trim()===завОб)
            || objByName[имяОб] || objByName[объект] || {};
  const дата=v("e_дата");
  const rec={
    статус:v("e_статус"), акт:v("e_акт"), дата:дата, год:дата?дата.slice(0,4):"",
    подразделение:v("e_подразделение"), объект:объект,
    объект_ид:spr.id||"", наименование:v("e_наим")||имяОб,
    зав:завОб||spr.зав||"", рег:регОб||spr.рег||"", методы:методы,
    архив:v("e_архив"), исходящий:v("e_исходящий"), отправитель:v("e_отправитель"),
    примечание:v("e_примечание"),
    изменено:new Date().toISOString(), место:getWS().код
  };
  if(id){ const i=J.findIndex(x=>String(x.id)===String(id)); if(i>=0) J[i]=Object.assign({},J[i],rec); }
  else { rec.id=newId(); rec.нп=J.length+1; J.unshift(rec); }
  формаСохранена();
  saveJournal(); switchView("journal");
  toast(id?"Запись изменена":"Запись добавлена");
}

// ── Резервная копия ВСЕЙ базы в файл ──────────────────────
// Копия охватывает журнал и все три справочника: с тех пор как
// справочники стали редактируемыми, копия только журнала оставляла бы
// половину работы без страховки. Восстановление — именно замена
// (в этом смысл копии), поэтому спрашивает подтверждение.
// ── База: где живут данные и чем они застрахованы ─────────
// Данных «в файле рядом с программой» не бывает: страница, открытая с
// диска, писать в свою папку сама не может. Поэтому рабочая база лежит
// в памяти браузера, а настоящая страховка — копия в файл.
//
// Замерено в этом браузере: предел памяти ~5 МБ, сейчас занято 236 КБ на
// 315 записей вместе со справочниками (~766 символов на запись) — то есть
// запас примерно на 6500 записей. Далеко, но предел молчаливый: браузер
// не предупреждает, он просто отказывает в записи, и правка пропадает.
// Поэтому ниже и счётчик заполнения, и предупреждение заранее.
const ПРЕДЕЛ_ХРАНИЛИЩА = 5 * 1024 * 1024;   // символов, проверено замером
function объёмХранилища(){
  let занято=0, по={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i), v=localStorage.getItem(k)||"";
      if(k.indexOf("lnk_")!==0) continue;
      по[k]=k.length+v.length; занято+=k.length+v.length;
    }
  }catch(e){}
  // До первой правки память браузера пуста: данные ещё вшиты в файл
  // программы. Считать запас по нулю нельзя — получилась бы бессмыслица
  // вроде «хватит на 103 миллиона записей». Берём то, что реально ляжет
  // в память при первом же сохранении.
  let факт=0;
  try{ факт=(JSON.stringify(J)+JSON.stringify(O)+JSON.stringify(S)+
             JSON.stringify(P)+JSON.stringify(A)+JSON.stringify(ПОДР)+
             JSON.stringify(НД)+JSON.stringify(ПОМ)+JSON.stringify(ЗАД)).length; }catch(e){}
  const всего=Math.max(занято,факт);
  const наЗапись = liveJ().length ? всего/liveJ().length : 0;
  return { всего:всего, по:по, занято:занято,
           доля: всего/ПРЕДЕЛ_ХРАНИЛИЩА,
           местаНаЗаписей: наЗапись>1 ? Math.round((ПРЕДЕЛ_ХРАНИЛИЩА-всего)/наЗапись) : null };
}

// Папку для копий надо запомнить между запусками, а localStorage хранит
// только строки — «ручку» на папку в него не положить. Для этого есть
// IndexedDB, она в этом браузере из file:// работает (проверено).
const ФС_БД="lnk_fs", ФС_ХР="ручки";
function идб(){
  return new Promise((ок,нет)=>{
    let r; try{ r=indexedDB.open(ФС_БД,1); }catch(e){ return нет(e); }
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore(ФС_ХР); }catch(e){} };
    r.onsuccess=()=>ок(r.result); r.onerror=()=>нет(r.error);
  });
}
function идбЗапись(ключ,знач){
  return идб().then(db=>new Promise((ок,нет)=>{
    const t=db.transaction(ФС_ХР,"readwrite");
    t.objectStore(ФС_ХР).put(знач,ключ);
    t.oncomplete=()=>{db.close();ок(true);}; t.onerror=()=>{db.close();нет(t.error);};
  })).catch(()=>false);
}
function идбЧтение(ключ){
  return идб().then(db=>new Promise((ок)=>{
    const t=db.transaction(ФС_ХР,"readonly"), z=t.objectStore(ФС_ХР).get(ключ);
    z.onsuccess=()=>{db.close();ок(z.result||null);}; z.onerror=()=>{db.close();ок(null);};
  })).catch(()=>null);
}

// в одной папке, выбранной один раз — тот же механизм, что у папки
// автокопий, включая хранение «ручки» в IndexedDB.
let _папкаДок=null;

    if(спросить){ p=await h.requestPermission({mode:"readwrite"});
                  if(p==="granted") return "есть"; }
    return "нужно разрешение";
  }catch(e){ return "нужно разрешение"; }
}

// Приборы, применённые по акту: у записи берётся её собственный набор
// (панель «Приборы и НД»), а если запись его не переопределяла —
// стандартный набор метода из «Методик контроля».
function приборыАкта(zs){
  const мт=getМетодики(), ид=[], видели={};
  zs.forEach(z=>methodsOf(z).forEach(м=>{
    const запись=(z.методы||{})[м]||{};
    const список=запись.приборы!=null?запись.приборы:((мт[м]||{}).приборы||[]);
    (список||[]).forEach(id=>{ if(!видели[id]){ видели[id]=1; ид.push(id); } });
  }));
  return ид.map(id=>live(S).find(x=>String(x.id)===String(id))).filter(Boolean);
}
// Специалисты акта и методы, по которым каждый работал — по полю
// «исполнитель» записей, тем же, по которому собираются подписи акта.
function специалистыАкта(zs){
  const поИмени={}; live(P).forEach(x=>{ if(x.вдок) поИмени[String(x.вдок).trim()]=x; });
  const карта=new Map();
  zs.forEach(z=>methodsOf(z).forEach(м=>{
    const и=String(((z.методы||{})[м]||{}).исп||"").trim(); if(!и) return;
    const c=поИмени[и]; if(!c) return;
    if(!карта.has(c.id)) карта.set(c.id,{спец:c, методы:[]});
    const п=карта.get(c.id); if(п.методы.indexOf(м)<0) п.методы.push(м);
  }));
  return [...карта.values()];
}

// Свидетельства о поверке печатаются по 4 на листе (ваше требование) —
// это отдельное задание печати с настройкой «4 страницы на листе», её
// нельзя задать из программы. Поэтому они кладутся своей подпапкой,
// название которой и есть напоминание, как её печатать.
const ПАПКА_ПОВЕРОК="Свидетельства о поверке (печатать по 4 на листе)";
// Состав пачки в том порядке, в каком её печатать. Имена файлов
// получают номер спереди: Проводник и Acrobat сортируют по имени, так
// порядок печати и задаётся. Чистая функция — ничего не пишет на диск,
// поэтому её видно на экране до сборки и можно проверить тестом.
function составПачки(ключ){
  const zs=записиАкта(ключ), из=[];
  let н=0, нп=0;
  const двузн=x=>(x<10?"0":"")+x;
  const добавить=(файл,что,подпапка)=>{
    const ф=String(файл||"").trim();
    if(!ф) return;
    const номер=подпапка?(++нп):(++н);
    из.push({файл:ф, что:что, подпапка:подпапка||"", имя:двузн(номер)+" "+ф});
  };
  // 1. Акт — первым листом. Его собирает сама программа (.docx), из
  //    папки брать нечего.
  из.push({акт:true, что:"акт о проведении работ", подпапка:"",
           имя:двузн(++н)+" Акт "+номерАкта(ключ)+".docx"});
  // 2. Протоколы — в том же порядке, что разделы перечня в самом акте.
  const видели={};
  ПОРЯДОК_В_АКТЕ.concat(METHODS).forEach(м=>{
    if(видели[м]) return; видели[м]=1;
    zs.filter(z=>обозначениеПротокола(z,м))
      .sort((a,b)=>(parseInt(номерМетода(a,м),10)||0)-(parseInt(номерМетода(b,м),10)||0))
      .forEach(z=>добавить(((z.методы||{})[м]||{}).файл, "протокол № "+обозначениеПротокола(z,м)));
  });
  // 3. Свидетельство об аттестации лаборатории.
  добавить(getЛаб().файл_свидетельства, "свидетельство об аттестации ЛНК");
  // 4. Удостоверения специалистов — только по методам, по которым они
  //    работали в этом акте; один файл на несколько методов не двоится.
  const файлыУд={};
  специалистыАкта(zs).forEach(({спец,методы})=>{
    аттестации(спец).forEach(а=>{
      if(!методы.some(м=>аттестацияОхватывает(а.метод,м))) return;
      const ф=String(а.файл||"").trim(); if(!ф||файлыУд[ф]) return;
      файлыУд[ф]=1;
      добавить(ф, "удостоверение "+(спец.вдок||спец.фио||"")+" · "+(а.метод||""));
    });
    добавить(спец.файл_пб, "удостоверение ПБ "+(спец.вдок||спец.фио||""));
  });
  // 5. Свидетельства о поверке — своей подпапкой, со своей нумерацией.
  приборыАкта(zs).forEach(п=>добавить(п.файл_поверки,
    "поверка: "+(п.наименование||"")+(п.зав?(" зав. № "+п.зав):""), ПАПКА_ПОВЕРОК));
  return из;
}
// Чего не хватает для полной пачки — считается по тем же правилам, что
// и сам состав: карточка в акте есть, а имя файла у неё не заполнено.
function пробелыПачки(ключ){
  const zs=записиАкта(ключ), нет=[];
  const видели={};
  ПОРЯДОК_В_АКТЕ.concat(METHODS).forEach(м=>{
    if(видели[м]) return; видели[м]=1;
    zs.filter(z=>обозначениеПротокола(z,м)).forEach(z=>{
      if(!String(((z.методы||{})[м]||{}).файл||"").trim())
        нет.push("протокол № "+обозначениеПротокола(z,м));
    });
  });
  if(!String(getЛаб().файл_свидетельства||"").trim()) нет.push("свидетельство об аттестации ЛНК");
  специалистыАкта(zs).forEach(({спец,методы})=>{
    const подходящие=аттестации(спец).filter(а=>методы.some(м=>аттестацияОхватывает(а.метод,м)));
    if(!подходящие.length || !подходящие.some(а=>String(а.файл||"").trim()))
      нет.push("удостоверение "+(спец.вдок||спец.фио||""));
    if(!String(спец.файл_пб||"").trim()) нет.push("ПБ "+(спец.вдок||спец.фио||""));
  });
  приборыАкта(zs).forEach(п=>{
    if(!String(п.файл_поверки||"").trim())
      нет.push("поверка: "+(п.наименование||"")+(п.зав?(" зав. № "+п.зав):""));
  });
  return нет;
}
// Сборка пачки в папку: подпапка на акт, в ней акт .docx и копии
// найденных файлов с номерами. Файл, которого в папке нет, не
// выдумывается — попадает в отчёт «не нашлось», чтобы это было видно,
// а не молча пропущено.
async function собратьПачку(ключ){
  const h=await папкаДок();
  if(!h){ toast("Сначала выберите папку с документами — «Обмен файлами»"); switchView("exchange"); return; }
  if(await правоНаПапкуДок(true)!=="есть"){ toast("Нет разрешения на папку с документами"); return; }
  const состав=составПачки(ключ);
  const имяПачки="Акт "+номерАкта(ключ)+" — пачка на печать";
  let готово=0; const ненайдены=[];
  try{
    const цель=await h.getDirectoryHandle(имяПачки,{create:true});
    const подпапки={};
    for(const п of состав){
      const куда = п.подпапка
        ? (подпапки[п.подпапка] = подпапки[п.подпапка] ||
            await цель.getDirectoryHandle(п.подпапка,{create:true}))
        : цель;
      let данные=null;
      if(п.акт){
        const д=актВWord(ключ,true); if(!д) continue; данные=д.данные;
      } else {
        try{ const ф=await h.getFileHandle(п.файл); данные=await (await ф.getFile()).arrayBuffer(); }
        catch(e){ ненайдены.push(п.файл+" — "+п.что); continue; }
      }
      const вых=await куда.getFileHandle(п.имя,{create:true});
      const w=await вых.createWritable(); await w.write(данные); await w.close();
      готово++;
    }
  }catch(e){ toast("Не удалось собрать пачку: "+e.name); return; }
  const пробелы=пробелыПачки(ключ);
  // Приборы берутся из отметок в записи или из стандартного набора
  // метода. Пока ни там, ни там ничего не отмечено, свидетельств о
  // поверке в пачке не будет вовсе — это не поломка, но догадаться
  // трудно, поэтому говорим прямо.
  const нетПриборов=!приборыАкта(записиАкта(ключ)).length;
  alert("Пачка собрана в папке «"+имяПачки+"».\n\n"+
    "Файлов записано: "+готово+"\n"+
    (нетПриборов?("\nСвидетельств о поверке в пачке нет: по методам этого акта не отмечено "+
      "ни одного прибора. Отметьте их в записи журнала (кнопка «Приборы и НД» у метода) "+
      "или разом в разделе «Методики контроля».\n"):"")+
    (ненайдены.length?("\nНе нашлось в папке с документами ("+ненайдены.length+"):\n· "+
      ненайдены.join("\n· ")+"\n"):"")+
    (пробелы.length?("\nИмя файла не заполнено в карточке ("+пробелы.length+"):\n· "+
      пробелы.join("\n· ")+"\n"):"")+
    "\nПечать: сначала содержимое самой папки (по порядку номеров), затем подпапку\n«"+
    ПАПКА_ПОВЕРОК+"» — отдельным заданием, поставив в Acrobat «несколько страниц на листе: 4».");
}

function данныеКопии(){
  const ws=getWS();
  return JSON.stringify(Object.assign({ тип:"резервная копия ЛНК", формат:2, место:ws.код,
    версия:DB.версия, сохранено:new Date().toISOString() }, всеДанные()), null, 1);
}
function имяКопии(){
  const d=new Date(), дв=n=>(n<10?"0":"")+n;
  return "ЛНК копия "+d.getFullYear()+"-"+дв(d.getMonth()+1)+"-"+дв(d.getDate())+
         " "+дв(d.getHours())+дв(d.getMinutes())+" ("+getWS().код+").json";
}
// Копий держим несколько поколений: одна-единственная копия бесполезна,
// если испортили данные и записали поверх. Старые сверх ДЕРЖАТЬ удаляются.
const ДЕРЖАТЬ_КОПИЙ=14;
async function чиститьСтарые(){
  const h=await папкаКопий(); if(!h) return 0;
  try{
    const свои=[];
    for await (const [имя,ручка] of h.entries())
      if(/^ЛНК копия .+\.json$/.test(имя) && ручка.kind==="file") свои.push(имя);
    свои.sort();                                   // имя начинается с даты — сортировка хронологическая
    const лишние=свои.slice(0, Math.max(0, свои.length-ДЕРЖАТЬ_КОПИЙ));
    for(const имя of лишние) await h.removeEntry(имя);
    return лишние.length;
  }catch(e){ return 0; }
}
async function копияВПапку(тихо){
  const h=await папкаКопий(); if(!h) return false;
  if(await правоНаПапку(!тихо)!=="есть") return false;
  try{
    const ф=await h.getFileHandle(имяКопии(),{create:true});
    const w=await ф.createWritable();
    await w.write(данныеКопии()); await w.close();
    try{ localStorage.setItem("lnk_last_backup", new Date().toISOString()); }catch(e){}
    await чиститьСтарые();
    if(!тихо) toast("Копия записана в папку");
    return true;
  }catch(e){ if(!тихо) toast("Не удалось записать копию: "+e.name); return false; }
}
// Копия делается сама, но не после каждой правки: раз в 10 минут работы
// достаточно, а чаще — только мешает диску и глазу.
let _когдаКопия=0;
function копияПоСлучаю(){
  const т=Date.now();
  if(т-_когдаКопия < 10*60*1000) return;
  _когдаКопия=т;
  папкаКопий().then(h=>{ if(h) копияВПапку(true); });
}
function когдаКопия(){
  try{ return localStorage.getItem("lnk_last_backup")||""; }catch(e){ return ""; }
}
function днейБезКопии(){
  const t=когдаКопия(); if(!t) return null;
  return Math.floor((Date.now()-new Date(t).getTime())/86400000);
}

// Один список всего, что хранит программа. Раньше его собирали в трёх
// местах порознь (ручная копия, автокопия в папку, файл обмена) — и они
// разошлись: в автокопию не попадали методики, в ручную копию — названия
// документов, а норм. документы с помещениями не попадали НИКУДА. Теперь
// список один: добавили реестр здесь — он сразу и в копии, и в обмене.
function всеДанные(){
  return { записи:J, объекты:O, приборы:S, специалисты:P, акты:A, ппр:ОТМ,
           подразделения:ПОДР, падежи:ПАДЕЖИ, задачи:ЗАД,
           нормдокументы:НД, помещения:ПОМ,
           лаборатория:getЛаб(), методики:getМетодики(), названия:имена() };
}
// Обратная сторона той же медали: применить принятый файл к базе.
// «Заменить» — для восстановления из копии (там так и задумано), иначе
// слияние со свежестью, как при обмене между местами.
function применитьДанные(d, заменить){
  const спис=(v)=>Array.isArray(v)?v:null;
  if(заменить){
    if(спис(d.объекты)){ O=d.объекты; saveReg(REG_OBJ,O); }
    if(спис(d.приборы)){ S=d.приборы; синхронизироватьЧасти(); saveReg(REG_SI,S); }
    if(спис(d.специалисты)){ P=d.специалисты; saveReg(REG_PPL,P); }
    if(спис(d.акты)){ A=d.акты; saveReg(REG_AKT,A); }
    if(спис(d.ппр)){ ОТМ=d.ппр; saveReg(REG_ППР,ОТМ); }
    if(спис(d.подразделения)){ ПОДР=d.подразделения; saveReg(REG_ПОДР,ПОДР); }
    if(спис(d.падежи)){ ПАДЕЖИ=d.падежи; saveReg(REG_ПАДЕЖ,ПАДЕЖИ); }
    if(спис(d.задачи)){ ЗАД=d.задачи; saveReg(REG_ЗАД,ЗАД); }
    if(спис(d.нормдокументы)){ НД=d.нормдокументы; saveReg(REG_НД,НД); }
    if(спис(d.помещения)){ ПОМ=d.помещения; saveReg(REG_ПОМ,ПОМ); }
    if(d.лаборатория && typeof d.лаборатория==="object") saveЛаб(d.лаборатория);
    if(d.методики && typeof d.методики==="object") saveМетодики(d.методики);
    if(d.названия && typeof d.названия==="object") saveИмена(d.названия);
    rebuildObjIndex();
    return null;
  }
  const r={ o:mergeInto(O,REG_OBJ,d.объекты), s:mergeInto(S,REG_SI,d.приборы),
            p:mergeInto(P,REG_PPL,d.специалисты) };
  mergeInto(A,REG_AKT,d.акты);
  mergeInto(ОТМ,REG_ППР,d.ппр);
  mergeInto(ПОДР,REG_ПОДР,d.подразделения);
  mergeInto(ПАДЕЖИ,REG_ПАДЕЖ,d.падежи);
  mergeInto(ЗАД,REG_ЗАД,d.задачи);
  mergeСправочник(НД,REG_НД,d.нормдокументы,ключНД);
  mergeСправочник(ПОМ,REG_ПОМ,d.помещения,ключПОМ);
  if(r.o.added||r.o.updated) rebuildObjIndex();
  return r;
}

// документов. Форма — по вашему бланку паспорта (Форма 3 СДАНК-01-2020).
//
// Актуализация: поле «проверено» — дата, когда в последний раз сверяли,
// что документ не отменён и не заменён новым изданием. Своего срока
// действия нормативные документы не имеют — это не поверка, а ваша
// внутренняя процедура. Один год — принятая практика (так же считает
// «Проверка данных»): без даты — «внимание» (могли не проверять),
// проверка старше года — «ошибка» (пора пересмотреть).
function ндАктуальноДо(дата){
  if(!дата) return "";
  const d=new Date(дата+"T00:00:00");
  d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
function ндСтатус(x){
  if(!x.проверено) return ["new","не проверялся"];
  const до=ндАктуальноДо(x.проверено);
  if(до<сегодня()) return ["bad","проверен "+ru(x.проверено)];
  return ["ok","проверен "+ru(x.проверено)];
}

// Не справочник записей (CRUD не нужен — методов ровно 8, весь список
// в METHODS), а фиксированный набор ссылок на уже существующие карточки
// приборов и норм. документов. Хранится тем же приёмом, что и карточка
// лаборатории (getЛаб/saveЛаб): один плоский объект плюс «изменено» —
// не отдельный REGS-справочник.
function getМетодики(){
  const пусто={}; METHODS.forEach(м=>{ пусто[м]={приборы:[],нд:[]}; });
  let рез=Object.assign({},пусто);
  try{ const r=localStorage.getItem("lnk_metodiki"); if(r) рез=Object.assign({},пусто,JSON.parse(r)); }catch(e){}
  METHODS.forEach(м=>{ if(!рез[м]||typeof рез[м]!=="object") рез[м]={приборы:[],нд:[]};
    рез[м].приборы=рез[м].приборы||[]; рез[м].нд=рез[м].нд||[]; });
  return рез;
}

// Сортировка списка для чекбоксов: карточки с совпадающим полем «метод»
// (оно уже есть у приборов и у норм. документов) — сверху, остальные —
// ниже по алфавиту. Не фильтрует, а только облегчает поиск в длинном
// списке — прибор без размеченного метода вполне может входить в набор.
function методСортировка(список, м){
  return список.slice().sort((a,b)=>{
    const ам=a.метод===м?0:1, бм=b.метод===м?0:1;
    if(ам!==бм) return ам-бм;
    return String(a.наименование||"").localeCompare(String(b.наименование||""),"ru");
  });
}

function siStatus(s){
  const d=s.поверка_до, m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");

}

// ── Заявка на поверку и план-график представления на поверку ──────
// Обе формы взяты ДОСЛОВНО из присланных образцов: состав и порядок
// колонок, строка с номерами колонок под шапкой, подстрочные подписи,
// ориентация страницы (заявка книжная, план-график альбомный — 15
// колонок). Ширины колонок — из самих образцов, пересчитаны под ширину
// текста программы, не выдуманы заново.
//
// Строка документа — это НАИМЕНОВАНИЕ, а не карточка: в образце
// «Люксметр Testo 540» идёт ОДНОЙ строкой с количеством 2 и двумя
// месяцами, потому что в картотеке это две карточки с разными сроками.
//
// Порядок строк — порядок картотеки, не алфавит: в образцах он не
// алфавитный (видимо, по видам измерений), своего порядка не выдумываю.
let годПоверки = new Date().getFullYear()+1;   // заявка подаётся на следующий год
function имяПрибораДок(п){
  return [String(п.наименование||"").trim(), String(п.тип||"").trim()].filter(Boolean).join(" ");
}
// Комплектность (состав) — приборы, отмеченные «неотъемлемая часть»
// этого прибора (то же поле основной_ид, что и в Форме 2 паспорта).
// В образце состав записан как «Мера СО-2 – 1 шт.; мера СО-3 – 1 шт.».
function комплектностьПрибора(п){
  const своя=String(п.комплектность||"").trim();
  if(своя) return своя;                 // вписанное руками — как есть
  const части={};
  live(S).forEach(x=>{ if(x.основной_ид===п.id){
    const и=имяПрибораДок(x); части[и]=(части[и]||0)+1; } });
  return Object.keys(части).map(и=>и+" – "+части[и]+" шт.").join("; ");
}
function месяцПрибора(п){
  const м=String(п.месяц_поверки||"").trim();
  return МЕСЯЦЫ.indexOf(м)>=0 ? м : "";
}
function группыПоверки(){
  const карта=new Map();
  приборыДляЗаявки().forEach(п=>{
    if(!месяцПрибора(п)) return;       // без месяца прибор в документы не идёт
    const ключ=имяПрибораДок(п).toLowerCase();
    if(!карта.has(ключ)) карта.set(ключ,{имя:имяПрибораДок(п), приборы:[]});
    карта.get(ключ).приборы.push(п);
  });
  return [...карта.values()].map(г=>{
    const помес={};
    г.приборы.forEach(п=>{ const м=месяцПрибора(п); помес[м]=(помес[м]||0)+1; });
    return { имя:г.имя, кол:г.приборы.length,
             месяцы:МЕСЯЦЫ.filter(м=>помес[м]), помес:помес,
             класс:(г.приборы.find(п=>String(п.класс_точности||"").trim())||{}).класс_точности||"",
             комплект:г.приборы.map(комплектностьПрибора).filter(Boolean)[0]||"" };
  });
}
// Неотъемлемая часть (датчик, преобразователь, мера из комплекта)
// поверяется вместе с основным прибором — так сказал заказчик, поэтому
// даты поверки у части не её собственные, а берутся у основного и
// руками не правятся (то же решение, что и с «действительно до» у
// аттестации специалиста: поле перестало быть источником истины).
// Свидетельство у комплектного прибора одно на весь комплект: у части
// тот же номер и тот же файл, что у основного (указание заказчика) —
// поэтому они в том же списке, что и даты, и так же не редактируются.
const ПОЛЯ_ПОВЕРКИ_ЧАСТИ=["поверка_дата","поверка_до","свидетельство","файл_поверки"];
// Приведение уже сохранённых данных: у каждой части даты выставляются
// по основному прибору. Зовётся при загрузке, после сохранения карточки,
// после импорта из Excel и после приёма обмена/копии — то есть на всех
// путях, какими данные попадают в S. Возвращает, менялось ли что-то.
function синхронизироватьЧасти(){
  let менялось=false;
  live(S).forEach(ч=>{
    if(!ч.основной_ид) return;
    const осн=S.find(x=>x.id===ч.основной_ид);
    if(!осн || осн.id===ч.id) return;       // битую ссылку ловит «Проверка данных»
    ПОЛЯ_ПОВЕРКИ_ЧАСТИ.forEach(к=>{
      const надо=осн[к]||"";
      if((ч[к]||"")!==надо){ ч[к]=надо; менялось=true; }
    });
  });
  return менялось;
}
// Поля, которых у неотъемлемой части не бывает: в заявку и план-график
// она идёт в составе основного прибора, отдельной строкой — нет, значит
// и месяц представления, и комплектность, и класс точности ей не нужны
// (со слов заказчика). Прячем их и очищаем, чтобы в данных не осталось
// значения, которое потом молча всплывёт в документе.
const ПОЛЯ_НЕ_У_ЧАСТИ=["месяц_поверки","класс_точности","комплектность"];
// Поля, которые у части обычно те же, что у основного прибора, но
// законно могут отличаться (датчик другого года выпуска, свой владелец):
// подставляются ТОЛЬКО в пустые и остаются редактируемыми — в отличие от
// поверки, которая у части не своя вовсе.
const ПОЛЯ_ОТ_ОСНОВНОГО=["изготовитель","год_выпуска","дата_ввода","владелец"];
// Форма: поверка части показывается нередактируемой и подставляется из
// выбранного основного прибора сразу, ещё до сохранения — чтобы было
// видно, что именно уйдёт в карточку.
function частьВыбрана(id){
  const осн=id?S.find(x=>String(x.id)===String(id)):null;
  ПОЛЯ_ПОВЕРКИ_ЧАСТИ.forEach(к=>{
    const поле=document.getElementById("rf_"+к); if(!поле) return;
    поле.readOnly=!!осн;
    поле.classList.toggle("отосновного", !!осн);
    поле.title=осн?"Берётся у основного прибора, не редактируется":"";
    if(осн) поле.value=осн[к]||"";
  });
  ПОЛЯ_НЕ_У_ЧАСТИ.forEach(к=>{
    const поле=document.getElementById("rf_"+к); if(!поле) return;
    const строка=поле.closest("label"); if(строка) строка.style.display=осн?"none":"";
    if(осн) поле.value="";             // чтобы не сохранилось скрытым
  });
  const взято=[];
  if(осн) ПОЛЯ_ОТ_ОСНОВНОГО.forEach(к=>{
    const поле=document.getElementById("rf_"+к); if(!поле) return;
    if(!поле.value && осн[к]){ поле.value=осн[к]; взято.push(к); }
  });
  if(осн) toast("Поверка взята у основного прибора"+
    (взято.length?(", оттуда же подставлено: "+взято.length+" поля (можно поправить)"):"")+
    " — "+(осн.наименование||""));
}

// Месяц ставится в карточке прибора, но приборов сорок с лишним, и
// открывать каждую карточку ради одного поля — работа на полчаса.
// Поэтому тот же месяц можно проставить списком прямо здесь; пишется
// он в ту же карточку, это не отдельное хранилище.
let месяцыОткрыты=false;
// «1 наименование / 2 наименования / 5 наименований» — счётная форма.
function склЧисло(n, одно, два, много){
  const д=n%10, с=n%100;
  return n+" "+((с>=11&&с<=14)||д===0||д>=5 ? много : д===1 ? одно : два);
}

function месяцыРедактор(){
  // Списанных и неотъемлемых частей в списке нет — их не представляют на

    (месяцПрибора(b)?1:0)-(месяцПрибора(a)?1:0) || имяПрибораДок(a).localeCompare(имяПрибораДок(b),"ru"));

    абз(t,jc,false)+(под?абз(под,jc,true):'')+'</w:tc>';
  const нет='<w:top w:val="none" w:sz="0" w:space="0" w:color="auto"/>'+
            '<w:left w:val="none" w:sz="0" w:space="0" w:color="auto"/>'+

// Сборка простого .docx из одного тела и своего sectPr (ориентация).
// Колонтитулов и нумерации в этих двух формах нет — в образцах их тоже
// нет, поэтому частей меньше, чем у акта и паспорта.
function wФайлDocx(имя, тело, sectPr){
  const НС='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '+
           'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const документ='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document '+НС+'><w:body>'+тело+sectPr+'</w:body></w:document>';
  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  dlBlob(имя, zipStore([
    {имя:"[Content_Types].xml", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
      '</Types>'},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="word/document.xml"/>'+
      '</Relationships>'},
    {имя:"word/document.xml", данные:документ}
  ]));
}

let аттПрогноз={год:new Date().getFullYear()+1};
function setАттПрогнозГод(г){ аттПрогноз.год=+г; renderPeople(); }
// Ширина колонки ФИО в «Специалистах» — по самой широкой фамилии в
// списке, а не общий min-width:280px у td.obj (тот стоит для других
// таблиц программы, где имена и названия обычно длиннее). Тот же приём,
// что и у ширинаДолжностей в акте — canvas-замер настоящим шрифтом
// таблицы (table{font-size:13px} перебивает шрифт body, меряем именно им),
// не оценка на глаз.
function мераUI(){
  if(!мераUI._к) мераUI._к=document.createElement("canvas").getContext("2d");
  return мераUI._к;
}
function ширинаФИОКолонки(значения){
  const ctx=мераUI(); if(!ctx) return 200;
  ctx.font='13px "Segoe UI", system-ui, Arial, sans-serif';
  let макс=ctx.measureText("ФИО").width;
  (значения||[]).forEach(s=>{ макс=Math.max(макс, ctx.measureText(String(s||"")).width); });
  // отступы ячейки (12px слева и справа) + запас, чтобы не переносило
  // вплотную — тем же принципом, что и у ширинаДолжностей (3%, не меньше
  // небольшого фиксированного зазора).
  return Math.ceil(макс*1.03)+24+10;
}
// Сортировка списка специалистов — тот же приём, что у журнала
// (jsort/sortJournal): состояние в localStorage, стрелка на заголовке,
// пустые значения всегда внизу. Статусные колонки сортируются по
// СЫРОЙ дате «до» (не по тексту статуса — «просрочено» не должно
// сортироваться как обычная строка вперемешку с «до …»).
let псорт=(function(){ try{ const r=localStorage.getItem("lnk_psort");
  if(r){ const o=JSON.parse(r); if(o&&o.c) return {c:o.c,d:o.d===1?1:-1}; } }catch(e){}
  return {c:"фио", d:1}; })();
function псортSave(){ try{ localStorage.setItem("lnk_psort",JSON.stringify(псорт)); }catch(e){} }
function sortPeople(c){
  if(псорт.c===c) псорт.d=-псорт.d; else { псорт.c=c; псорт.d=1; }
  псортSave(); renderPeople();
}
function peopleSortKey(p,c){
  switch(c){
    case "должность": return p.должность||"";
    case "функции": return p.функции||"";
    case "стаж": return p.стаж||"";
    case "инструктаж": return инструктажДо(p.инструктаж_дата)||"";
    case "огрпр": return огрПространстваДо(p.огр_простр_дата)||"";
    case "электробез": return электробезДо(p.эл_безоп_дата)||"";
    case "пожбез": return пожбезДо(p.пожбез_дата)||"";
    case "пб": return пбДо(p)||"";
    case "аттестация": return ближайшаяАттестацияДата(p)||"";
    case "классность": return ближайшаяКлассностьДата(p)||"";
    default: return p.вдок||p.фио||"";
  }
}
function peopleRows(){
  return live(P).slice().sort((a,b)=>{
    const A=String(peopleSortKey(a,псорт.c)||""), B=String(peopleSortKey(b,псорт.c)||"");
    if(!A && !B) return 0;
    if(!A) return 1;
    if(!B) return -1;
    return A.localeCompare(B,"ru",{numeric:true})*псорт.d;
  });
}
// Сортировка прогноза аттестации — отдельное состояние (свои колонки),
// применяется поверх прогнозАттестации(год), который сам отбирает и
// расставляет строки по сроку; клик по заголовку переставляет их же.
let прогСорт=(function(){ try{ const r=localStorage.getItem("lnk_progsort");
  if(r){ const o=JSON.parse(r); if(o&&o.c) return {c:o.c,d:o.d===1?1:-1}; } }catch(e){}
  return {c:"до", d:1}; })();
function прогСортSave(){ try{ localStorage.setItem("lnk_progsort",JSON.stringify(прогСорт)); }catch(e){} }
function sortПрогноз(c){
  if(прогСорт.c===c) прогСорт.d=-прогСорт.d; else { прогСорт.c=c; прогСорт.d=1; }
  прогСортSave(); renderPeople();
}
function прогнозКлюч(з,c){
  switch(c){
    case "фио": return з.специалист.вдок||з.специалист.фио||"";
    case "метод": return з.метод||"";
    case "уровень": return з.уровень||"";
    case "вид": return з.вид||"";
    case "действие": return з.действие||"";
    default: return з.до||"";
  }
}
function прогнозРяды(год){
  return прогнозАттестации(год).slice().sort((a,b)=>{
    const A=String(прогнозКлюч(a,прогСорт.c)||""), B=String(прогнозКлюч(b,прогСорт.c)||"");
    if(!A && !B) return 0;
    if(!A) return 1;
    if(!B) return -1;
    return A.localeCompare(B,"ru",{numeric:true})*прогСорт.d;
  });
}

// ── Обмен между рабочими местами ──────────────────────────
// Файлами, без сети. Слияние по id записи: новых нет — добавляем;
// есть — берём ту, у кого «изменено» свежее. Код места входит в id
// новых записей, поэтому места не затирают друг друга.
function mergeJournal(incoming){
  let added=0, updated=0, skipped=0;
  const idx={}; J.forEach((z,i)=>{ idx[z.id]=i; });
  incoming.forEach(r=>{
    if(!r||!r.id) return;
    if(idx[r.id]==null){ J.push(r); idx[r.id]=J.length-1; if(!r.удалено) added++; }
    else { const cur=J[idx[r.id]];
      if(lastTs(r) > lastTs(cur)){ J[idx[r.id]]=r; updated++; }
      else skipped++; }
  });
  if(added||updated) saveJournal();
  return {added,updated,skipped};
}
// Два места могли выдать один номер, если оба брали право порознь.
// Молчать об этом нельзя: номер уже мог уйти на подписанный документ.
function проверитьСтолкновения(){
  const карта={}, из=[];
  liveJ().forEach(z=>{ const г=годЗаписи(z); if(!г) return;
    methodsOf(z).forEach(м=>{ const н=номерМетода(z,м); if(!/^\d+$/.test(н)) return;
      const ключ=м+"-"+г+"-"+н; (карта[ключ]=карта[ключ]||[]).push(z); });
    const m=/^АКТ\s+(\d+)-(\d{4})$/.exec(String(z.акт||"").trim());
    if(m){ const ключ="АКТ-"+m[2]+"-"+m[1]; (карта[ключ]=карта[ключ]||[]).push(z); }
  });
  Object.keys(карта).forEach(k=>{
    const сп=карта[k];
    // Акт законно повторяется: один акт охватывает несколько объектов.
    if(k.indexOf("АКТ-")===0) return;
    if(сп.length>1) из.push(k.replace(/^(\S+?)-(\d{4})-(\d+)$/,"$3-$2-$1")+
      ": " + сп.map(z=>(z.объект||"без объекта").slice(0,28)).join(" / "));
  });
  return из;
}

let _exIn;
function exchangeImport(){
  if(!_exIn){
    _exIn=document.createElement("input"); _exIn.type="file"; _exIn.accept=".json"; _exIn.multiple=true; _exIn.style.display="none"; document.body.appendChild(_exIn);
    _exIn.addEventListener("change",e=>{
      const files=[...e.target.files]; if(!files.length) return;
      let done=0, tot={j:0,o:0,s:0,p:0}, отчёт=[];
      files.forEach(f=>{
        const rd=new FileReader();
        rd.onload=()=>{
          try{
            const d=JSON.parse(rd.result);
            const jarr=Array.isArray(d)?d:d.записи;
            if(!Array.isArray(jarr) && !d.объекты && !d.приборы && !d.специалисты)
              throw new Error("не файл обмена");
            const rj=Array.isArray(jarr)?mergeJournal(jarr):{added:0,updated:0,skipped:0};
            // Право выдачи — свежее побеждает, как и всё остальное.
            if(d.право && d.право.изменено && d.право.изменено > getGrant().изменено){
              saveGrant({место:d.право.место||"", изменено:d.право.изменено});
            }
            const слито=применитьДанные(d, false);
            const ro=слито.o, rs=слито.s, rp=слито.p;
            // Карточка лаборатории — свежее побеждает, как право и названия.
            if(d.лаборатория && d.лаборатория.изменено &&
               d.лаборатория.изменено > (getЛаб().изменено||""))
              saveЛаб(d.лаборатория);
            // Методики контроля — свежее побеждает, тем же приёмом, что и
            // карточка лаборатории.
            if(d.методики && d.методики.изменено &&
               d.методики.изменено > (getМетодики().изменено||""))
              saveМетодики(d.методики);
            // Названия документов по методам — свежее побеждает.
            if(d.названия && d.названия.изменено && d.названия.изменено > имена().изменено)
              saveИмена({имена:Object.assign({}, имена().имена, d.названия.имена||{}),
                         ед:Object.assign({}, имена().ед, d.названия.ед||{}),
                         изменено:d.названия.изменено});
            if(ro.added||ro.updated) rebuildObjIndex();
            tot.j+=rj.added+rj.updated; tot.o+=ro.added+ro.updated; tot.s+=rs.added+rs.updated; tot.p+=rp.added+rp.updated;
            отчёт.push((d.место?("["+d.место+"] "):"")+f.name+
              ": журнал +"+rj.added+"/"+rj.updated+", объекты +"+ro.added+"/"+ro.updated+
              ", СИ +"+rs.added+"/"+rs.updated+", спец. +"+rp.added+"/"+rp.updated);
          }catch(err){ отчёт.push(f.name+": ошибка — "+err.message); }
          if(++done===files.length){
            try{ localStorage.setItem("lnk_last_import", new Date().toISOString()); }catch(e){}
            renderExchange();
            const столк=проверитьСтолкновения();
            if(столк.length) alert("ВНИМАНИЕ: одинаковые номера у разных записей.\n\n"+
              столк.slice(0,12).join("\n")+(столк.length>12?("\n… всего "+столк.length):"")+
              "\n\nТакое бывает, если два места выдавали номера порознь. Исправьте вручную: "+
              "откройте записи и задайте верные номера.");
            alert("Принято файлов: "+files.length+"\n\n"+отчёт.join("\n")+
              "\n\nВсего изменений: журнал "+tot.j+", объекты "+tot.o+", приборы "+tot.s+", специалисты "+tot.p+
              ".\n(в записи «+новых/обновлено»)");
            toast("Обмен принят");
          }
        };
        rd.readAsText(f);
      });
      e.target.value="";
    });
  }
  _exIn.click();
}

// План взят из вашей книги «План-график ППР 2026-2030», лист «Пятилетний»,
// и ничего в нём не досочинено. Периодичность записана долей года и видом
// обслуживания («0,25 ТО-4»): доля подтверждается самой разметкой —
// 0,25 стоит раз в квартал, 0,083 ежемесячно, 0,027 примерно каждые десять
// дней, 0,0027 по рабочим дням. А что именно означают номера ТО-1…ТО-4, в
// книге не написано — они показаны как есть, расшифровку не выдумываю.
//
// Главное, чего в книге нет и ради чего раздел нужен: ОТМЕТКА О ВЫПОЛНЕНИИ.
// План на бумаге отвечает, что надо сделать; отметки отвечают, что сделано.
const ППР = (function(){
  try{ const t=document.getElementById("lnk-ppr").textContent.trim();
       const d=t?JSON.parse(t):null;
       return (d && Array.isArray(d.позиции)) ? d : {годы:[],позиции:[],замечания:[]};
  }catch(e){ return {годы:[],позиции:[],замечания:[]}; }
})();
const МЕС3=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

// Отметки — рабочие данные: правятся, ходят в обмене, попадают в копию.
const REG_ППР="lnk_ppr";
let ОТМ;
function ключОтметки(п,год,мес){ return п.id+"|"+год+"|"+мес; }
function отметка(п,год,мес){
  return live(ОТМ).find(о=>о.id===ключОтметки(п,год,мес))||null;
}
function отметить(идПоз,год,мес,кто){
  const п=ППР.позиции.find(x=>x.id===идПоз); if(!п) return;
  const к=ключОтметки(п,год,мес);
  const был=ОТМ.find(о=>о.id===к);
  if(был && !был.удалено){                       // повторное нажатие снимает отметку
    был.удалено=new Date().toISOString(); был.изменено=был.удалено;
  } else if(был){
    был.удалено=""; был.выполнено=new Date().toISOString().slice(0,10);
    был.кто=кто||был.кто||""; был.изменено=new Date().toISOString();
  } else {
    ОТМ.push({id:к, поз:идПоз, год:год, мес:мес,
              выполнено:new Date().toISOString().slice(0,10), кто:кто||"",
              место:getWS().код, изменено:new Date().toISOString()});
  }
  saveReg(REG_ППР,ОТМ);
  renderPlan();
}

function итогиГода(год){
  let работ=0, часы=0, сделано=0, часовСделано=0;
  for(let м=1;м<=12;м++){
    работыМесяца(год,м).forEach(р=>{
      работ++; часы+=р.часы;
      if(р.отм){ сделано++; часовСделано+=р.часы; }
    });
  }
  return {работ, часы:+часы.toFixed(2), сделано,
          часовСделано:+часовСделано.toFixed(2),
          доля: работ?сделано/работ:0};
}
// Один источник правды о «сейчас»: и подсветка ячеек, и счёт просроченного
// должны считать прошедшим одно и то же, иначе цифра и цвет разойдутся.
function прошедший(год,мес){
  const н=new Date(), тг=н.getFullYear(), тм=н.getMonth()+1;
  return год<тг || (год===тг && мес<тм);
}
function текущийМесяц(год,мес){
  const н=new Date(); return год===н.getFullYear() && мес===н.getMonth()+1;
}
// Просрочено — запланированное на прошедшие месяцы и не отмеченное.
// Текущий месяц не в счёт: он ещё идёт.
function просрочено(год){
  const тг=new Date().getFullYear();
  if(год>тг) return [];
  const до = (год<тг) ? 12 : new Date().getMonth();
  const из=[];
  for(let м=1;м<=до;м++)
    работыМесяца(год,м).forEach(р=>{ if(!р.отм) из.push({мес:м, поз:р.поз, часы:р.часы}); });
  return из;
}

// Что по ППР приходится на текущий месяц — для пульта.
function ппрМесяца(){
  const н=new Date(), год=н.getFullYear(), мес=н.getMonth()+1;
  const р=работыМесяца(год,мес);
  const осталось=р.filter(x=>!x.отм);
  return {год, мес, имя:МЕСЯЦЫ[мес-1], всего:р.length,
          сделано:р.length-осталось.length, осталось:осталось.length,
          список:осталось};
}

    '<w:pgMar w:top="1134" w:right="1276" w:bottom="1134" w:left="1559" '+
    'w:header="567" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';

  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const файлы=[
    {имя:"[Content_Types].xml", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
      '</Types>'},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="word/document.xml"/>'+

  ];
  dlBlob("План ППР "+год+".docx", zipStore(файлы));
