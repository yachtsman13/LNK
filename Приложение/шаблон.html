<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Система ЛНК</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --ink:#1b2430; --muted:#5b6675; --faint:#8a94a2;
    --line:#d6dbe3; --brand:#1f5c8f; --brand-d:#164668; --brand-soft:#e7f0f8;
    --ok:#1c7a4a; --okbg:#e3f3ea; --warn:#b26a00; --warnbg:#fff2dc;
    --danger:#b3261e; --dangerbg:#fbe6e4; --row:#f6f8fb;
    --shadow:0 1px 3px rgba(20,30,50,.12),0 6px 20px rgba(20,30,50,.06);
    --head-bg:#f2f5f9; --input-bg:#fff; --tip-bg:#1b2430; --tip-ink:#fff;
    --top-bg:var(--brand); --top-ink:#fff; --top-tag:rgba(255,255,255,.18);
    --logo-bg:#fff; --logo-ink:var(--brand); --radius:8px; --card-radius:12px;
  }

  /* ── Стили оформления (переключаются в шапке) ─────────── */
  /* Тёмный с оранжевым акцентом */
  :root[data-theme="ph"]{
    --bg:#0f0f0f; --panel:#1c1c1c; --ink:#f3f3f3; --muted:#9a9a9a; --faint:#6a6a6a;
    --line:#2e2e2e; --brand:#ff9000; --brand-d:#ffa733; --brand-soft:#2a1f00; --row:#171717;
    --ok:#5cd08a; --okbg:#123320; --warn:#e0a300; --warnbg:#332608; --danger:#ff6b60; --dangerbg:#3a1512;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
    --head-bg:#242424; --input-bg:#141414; --tip-bg:#ff9000; --tip-ink:#000;
    --top-bg:#000; --top-ink:#fff; --top-tag:rgba(255,144,0,.25);
    --logo-bg:#ff9000; --logo-ink:#000;
  }
  /* Метро — плоские блоки, прямые углы */
  :root[data-theme="metro"]{
    --bg:#e8e8e8; --panel:#fff; --ink:#1b1b1b; --muted:#5a5a5a; --faint:#8a8a8a;
    --line:#cfcfcf; --brand:#2d89ef; --brand-d:#1e6fd0; --brand-soft:#d6e6fb; --row:#f2f2f2;
    --head-bg:#efefef; --input-bg:#fff; --tip-bg:#2d89ef; --tip-ink:#fff;
    --top-bg:#2d89ef; --top-ink:#fff; --top-tag:rgba(255,255,255,.22);
    --logo-bg:#fff; --logo-ink:#2d89ef; --radius:0; --card-radius:0;
  }
  :root[data-theme="metro"] .card{box-shadow:none}
  :root[data-theme="metro"] .btn{box-shadow:none}
  :root[data-theme="metro"] .nav.on{background:var(--brand);color:#fff}
  :root[data-theme="metro"] .nav.on .cnt{background:rgba(255,255,255,.25);color:#fff}
  :root[data-theme="metro"] .pill{background:var(--brand);color:#fff}
  :root[data-theme="metro"] h1,:root[data-theme="metro"] .head h2{font-weight:300;letter-spacing:.3px}
  /* VK — синий, светлый, скруглённый */
  :root[data-theme="vk"]{
    --bg:#edeef0; --panel:#fff; --ink:#000000; --muted:#626d7a; --faint:#99a2ad;
    --line:#e7e8ec; --brand:#2787f5; --brand-d:#1a6ee0; --brand-soft:#e5f0fd; --row:#f7f8fa;
    --head-bg:#f0f2f5; --input-bg:#f0f2f5; --tip-bg:#2787f5; --tip-ink:#fff;
    --top-bg:#2787f5; --top-ink:#fff; --top-tag:rgba(255,255,255,.22);
    --logo-bg:#fff; --logo-ink:#2787f5; --radius:10px; --card-radius:12px;
  }
  /* Яндекс — жёлтая шапка, красный акцент */
  :root[data-theme="ya"]{
    --bg:#f2f2f2; --panel:#fff; --ink:#21201f; --muted:#6b6b6b; --faint:#9a9793;
    --line:#e6e4e0; --brand:#fc3f1d; --brand-d:#e5330f; --brand-soft:#ffe9e4; --row:#f7f6f4;
    --head-bg:#f4f2ef; --input-bg:#fff; --tip-bg:#21201f; --tip-ink:#fff;
    --top-bg:#ffdb4d; --top-ink:#21201f; --top-tag:rgba(0,0,0,.10);
    --logo-bg:#fc3f1d; --logo-ink:#fff;
  }
  /* Мой вкус — графитово-индиговый, мягкие тени */
  :root[data-theme="taste"]{
    --bg:#f4f5fb; --panel:#ffffff; --ink:#1e2233; --muted:#5c6480; --faint:#9096ad;
    --line:#e6e7f2; --brand:#5b5bd6; --brand-d:#4a4ac0; --brand-soft:#ecebfc; --row:#f8f8fd;
    --okbg:#e8f5ee; --warnbg:#fdf1dc; --dangerbg:#fbe7e5;
    --shadow:0 1px 2px rgba(40,40,90,.08),0 10px 30px rgba(40,40,90,.10);
    --head-bg:#f4f4fb; --input-bg:#fff; --tip-bg:#2b2f45; --tip-ink:#fff;
    --top-bg:#4f46e5; --top-ink:#fff; --top-tag:rgba(255,255,255,.20);
    --logo-bg:#fff; --logo-ink:#4f46e5; --card-radius:14px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}

  .app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:52px 1fr 30px;
    grid-template-areas:"top top" "side main" "side foot";height:100vh}
  .top{grid-area:top;background:var(--top-bg);color:var(--top-ink);display:flex;align-items:center;
    gap:12px;padding:0 16px;box-shadow:var(--shadow);z-index:3}
  .top .logo{width:26px;height:26px;border-radius:6px;background:var(--logo-bg);color:var(--logo-ink);
    display:grid;place-items:center;font-weight:800}
  .top h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .top .tag{font-size:11px;background:var(--top-tag);padding:2px 8px;border-radius:20px}
  .top .spring{flex:1}
  .top .who{font-size:12px;opacity:.92}
  .top .styleSel{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95}
  .top .styleSel select{font:inherit;font-size:12px;color:var(--top-ink);
    background:var(--top-tag);border:0;border-radius:7px;padding:5px 8px;cursor:pointer}
  .top .styleSel select option{color:#1b2430;background:#fff}

  .side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
    padding:10px 8px;overflow:auto}
  .side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
    padding:12px 10px 4px}
  .nav{display:flex;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    padding:9px 10px;border-radius:8px;margin:1px 0;gap:9px;align-items:center}
  .nav:hover{background:var(--row)}
  .nav.on{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
  .nav .ic{width:18px;text-align:center;opacity:.85}
  .nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--row);
    border-radius:20px;padding:1px 8px}
  .nav.on .cnt{background:#fff}

  .main{grid-area:main;overflow:auto;padding:18px 22px}
  .foot{grid-area:foot;background:var(--panel);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:0 16px;font-size:11.5px;color:var(--muted)}
  .foot b{color:var(--ink);font-weight:600}

  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .head h2{margin:0;font-size:19px;font-weight:650}
  .head .sub{color:var(--muted);font-size:12.5px;margin-left:2px}
  .head .spring{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;
    border-radius:8px;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
  .btn:hover{border-color:#b9c2ce}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}

  .search{flex:1;min-width:200px;max-width:380px;position:relative}
  .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;
    background:var(--input-bg);font:inherit}
  .search .ic{position:absolute;left:11px;top:8px;color:var(--faint)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);
    box-shadow:var(--shadow);overflow:hidden}
  .tblwrap{overflow:auto;max-height:calc(100vh - 190px)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--head-bg);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;
    font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:nth-child(even){background:var(--row)}
  tbody tr:hover{background:var(--brand-soft)}
  td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  td.obj{min-width:280px}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;display:inline-block;
    margin:1px 2px 1px 0;background:var(--brand-soft);color:var(--brand-d)}
  .st{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
  .st.ok{background:var(--okbg);color:var(--ok)} .st.work{background:var(--warnbg);color:var(--warn)}
  .st.new{background:var(--brand-soft);color:var(--brand-d)} .st.bad{background:var(--dangerbg);color:var(--danger)}
  .empty{padding:44px;text-align:center;color:var(--muted)}
  .muted{color:var(--muted)}

  /* Детальная карточка справа */
  .veil{position:fixed;inset:0;background:rgba(20,30,50,.35);display:none;z-index:10}
  .veil.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100%);background:var(--panel);
    box-shadow:-8px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:.22s;
    z-index:11;display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .drawer .dh h3{margin:0;font-size:16px;flex:1}
  .drawer .dh .x{border:0;background:var(--row);border-radius:8px;width:30px;height:30px;color:var(--muted)}
  .drawer .db{padding:6px 20px 24px;overflow:auto}
  .fld{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:150px 1fr;gap:12px}
  .fld .k{color:var(--muted);font-size:12.5px}
  .fld .v{font-size:13.5px;white-space:pre-wrap}
  .sect{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);
    margin:18px 0 2px;font-weight:700}
  .mtab{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
  .mtab td,.mtab th{border:1px solid var(--line);padding:6px 9px;text-align:left}
  .mtab th{background:var(--head-bg);font-size:11px;text-transform:uppercase;color:var(--muted)}

  .toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--tip-bg);color:var(--tip-ink);padding:10px 18px;border-radius:10px;opacity:0;
    transition:.25s;z-index:30;box-shadow:var(--shadow);font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .placeholder{display:grid;place-items:center;height:65%;color:var(--muted);text-align:center}
  .placeholder .big{font-size:44px;margin-bottom:10px;opacity:.5}

  /* Фильтры журнала */
  .filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:-4px 0 12px}
  .filters label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .filters select{font:inherit;font-size:13px;color:var(--ink);background:var(--input-bg);
    border:1px solid var(--line);border-radius:var(--radius);padding:5px 8px;cursor:pointer}
  .filters .btn{padding:5px 10px;box-shadow:none}
  .filters .fnote{font-size:12px;color:var(--faint);margin-left:auto}
  .filters.seg .btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .filters.seg .btn b{font-weight:700;opacity:.85}
  .pill.nonum{background:transparent;color:var(--muted);border:1px dashed var(--line)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--brand-d);background:var(--brand-soft)}

  /* Пульт */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin-bottom:18px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);
    box-shadow:var(--shadow);padding:14px 16px}
  .tile.click{cursor:pointer} .tile.click:hover{border-color:var(--brand)}
  .tile .n{font-size:27px;font-weight:700;line-height:1.05}
  .tile .l{color:var(--muted);font-size:12.5px;margin-top:4px}
  .tile.bad .n{color:var(--danger)} .tile.warn .n{color:var(--warn)}
  .tile.ok .n{color:var(--ok)} .tile.accent .n{color:var(--brand)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  @media(max-width:920px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);
    box-shadow:var(--shadow);padding:16px 18px}
  .panel h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
  .panel h3 .pc{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
  .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar .bn{width:42px;color:var(--muted);font-weight:600}
  .bar .bt{flex:1;background:var(--row);border-radius:6px;height:20px;overflow:hidden}
  .bar .bf{display:block;height:100%;background:var(--brand);border-radius:6px;min-width:2px}
  .bar .bc{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .plist{font-size:13px}
  .plist .pr{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .plist .pr:last-child{border-bottom:0} .plist .pr:hover{background:var(--brand-soft)}
  .plist .pr .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{color:var(--muted);font-size:12.5px;padding:6px 0}

  /* Редактор записи */
  .form{max-width:780px}
  .form .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .form label.wide{grid-column:1/-1}
  .form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--radius);font:inherit;color:var(--ink);background:var(--input-bg)}
  .form textarea{resize:vertical;min-height:52px}
  .form .hint{font-size:11.5px;color:var(--faint);min-height:15px}
  .mrow{display:grid;grid-template-columns:70px 1fr 1.5fr;gap:8px;align-items:center;margin:5px 0}
  .mrow .mname{font-weight:600;color:var(--muted);font-size:13px}
  .formbtns{display:flex;gap:10px;margin-top:20px;align-items:center}
  .btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
  .btn.danger:hover{filter:brightness(.92)}
  .drawer .db .dbtns{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}

  /* Документ (акт/заключение) */
  .draftnote{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);
    border-radius:var(--radius);padding:9px 13px;font-size:12.5px;margin-bottom:14px}
  .sheet{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:40px 48px;
    border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow);
    font-family:"Times New Roman",Georgia,serif;font-size:15px;line-height:1.5}
  .sheet .org{text-align:center;font-weight:700;min-height:22px;outline:none}
  .sheet .org:empty:before,.sheet .concl:empty:before{content:attr(data-ph);color:#aaa;font-weight:400;font-style:italic}
  .sheet h1{text-align:center;font-size:20px;letter-spacing:1px;margin:16px 0 2px}
  .sheet .docsub{text-align:center;font-size:14px;margin-bottom:4px}
  .sheet .docmeta{text-align:center;color:#333;margin-bottom:18px}
  .sheet .doch{font-weight:700;margin:16px 0 6px}
  .doctbl{width:100%;border-collapse:collapse;margin:4px 0}
  .doctbl td,.doctbl th{border:1px solid #8a8a8a;padding:6px 10px;font-size:13.5px;text-align:left;vertical-align:top}
  .doctbl th{background:#f0f0f0}
  .doctbl td.k{width:36%;color:#333}
  .sheet .concl{min-height:70px;border:1px solid #ccc;border-radius:4px;padding:8px 10px;outline:none}
  .sheet .signs{margin-top:26px}
  .signrow{display:flex;align-items:flex-end;gap:12px;margin:16px 0 4px}
  .signrow .line{flex:0 0 200px;border-bottom:1px solid #333;height:16px}
  .signrow .nm{color:#333;font-size:13.5px}

  /* Акт о проведении работ: вёрстка снята с ваших актов 28-2026 и 35-2026 */
  .sheet .labcert{font-size:12.5px;margin-bottom:30px}
  .sheet h1.akt{margin:0 0 2px;letter-spacing:0}
  .sheet .aktsub{text-align:center;font-size:15px;margin-bottom:20px}
  .sheet .aktp{text-align:justify;margin:0 0 11px;text-indent:1.25cm}
  .sheet .aktp.noind{text-indent:0}
  .nbr{white-space:nowrap;display:inline-block}
  .fld{background:#fff8dc;border-bottom:1px dotted #a07800;padding:0 3px;outline:none;
    min-width:70px;display:inline-block}
  .fld:empty:before{content:attr(data-ph);color:#a07800;font-style:italic}
  .fld.flow{display:inline;min-width:0}
  .fld.blk{display:block;text-indent:0;border:1px dotted #a07800;border-bottom:1px dotted #a07800;
    border-radius:4px;padding:6px 9px;margin:2px 0}
  .fldhint{font-family:var(--font);font-size:11.5px;color:#a07800;margin:2px 0 10px;text-indent:0}
  .signtbl{width:100%;border-collapse:collapse;margin-top:30px}
  .signtbl td{border:0;padding:10px 0;font-size:14.5px;vertical-align:bottom}
  .signtbl td.pos{width:64%}
  .signtbl td.nm{text-align:right;white-space:nowrap}
  .aktbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .btn.small{padding:4px 9px;font-size:12px}
  td.mets{font-size:12px;color:var(--muted)}

  @media print{
    .app{display:block;height:auto}
    .top,.side,.foot,.head,.veil,.drawer,.noprint{display:none!important}
    .main{padding:0;overflow:visible} .card{border:0;box-shadow:none}
    .tblwrap{max-height:none;overflow:visible}
    .print-only{display:block!important} @page{margin:14mm}
    .sheet{border:0;box-shadow:none;max-width:none;padding:0;color:#000}
    .sheet .concl{border:0;padding:0}
    /* На бумаге подсветка полей не нужна — только текст */
    .fld{background:transparent!important;border:0!important;padding:0}
    .fld.blk{border:0!important;padding:0;margin:0}
    .fldhint{display:none}
    .signtbl td{border:0!important;font-size:13.5px!important;color:#000!important}

    /* Многостраничная печать таблиц */
    thead{display:table-header-group}      /* шапка повторяется на каждой странице */
    tr{break-inside:avoid}                 /* строка не рвётся между страницами */
    th{position:static;background:#eee!important;color:#000!important;
       border:1px solid #999;font-size:10.5px}
    /* В документе всё чёрным: экранные «приглушённые» цвета на бумаге
       выглядят выцветшими. И никакой подсветки строки под курсором. */
    td,td.num,td.obj,.muted{border-color:#999;font-size:11px;color:#000!important}
    td{border:1px solid #999}
    tbody tr:hover{background:transparent}
    table{font-size:11px}
    .pill{background:none!important;color:#000!important;border:1px solid #999;padding:0 3px}
    .st{background:none!important;color:#000!important;padding:0}
    .pnum{display:table-cell!important}
    body{background:#fff}
  }
  .print-only{display:none}
  .print-head .ph-title{font-size:17px;font-weight:700;text-align:center}
  .print-head .ph-sub{font-size:12px;text-align:center;color:#333;margin:4px 0 12px}
  .print-sign{margin-top:22px;font-size:12.5px}
  .print-sign .sl{display:inline-block;width:220px;border-bottom:1px solid #333;margin:0 8px}
  .pnum{display:none}
  .noprint{}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">Л</div>
    <h1>Система ЛНК</h1>
    <span class="tag" id="verTag">проба • реальные данные</span>
    <div class="spring"></div>
    <label class="styleSel">Стиль

<script id="lnk-data" type="application/json">/*ДАННЫЕ*/</script>
<script>
"use strict";
const DB = JSON.parse(document.getElementById("lnk-data").textContent);
const METHODS = DB.методы || ["ВИК","УЗД","УЗТ","АЭ","ТВ","ТК","ВД","МК"];
const objById = {}, objByName = {};   // строятся из рабочего справочника O
let curView="journal", query="";

// «Живые» записи — без удалённых. Удаление не выкидывает запись, а ставит
// метку z.удалено (надгробие): так удаление можно перенести файлом обмена
// тем же слиянием по свежести. Показываем и считаем только живые.
function liveJ(){ return J.filter(z=>!z.удалено); }
// Метка последнего события записи — правка или удаление, что позже. По ней
// слияние решает, чья версия свежее (в т.ч. «удалено» против «изменено»).
function lastTs(z){ const a=z.изменено||"", b=z.удалено||""; return a>b?a:b; }

// ── Номера протоколов и актов ─────────────────────────────
// Счётчик не хранится отдельно: следующий номер — это «максимум из уже
// выданных + 1». Так счётчик не может разойтись с данными и не требует
// отдельной синхронизации при обмене — журналы сливаются, и множество
// занятых номеров сливается вместе с ними.
//
// Считаем по ВСЕМ записям, включая удалённые и аннулированные: номер
// повторно не используется, дыра от аннулированной записи остаётся
// навсегда (правило заказчика).
function годЗаписи(z){ return (z.дата||"").slice(0,4); }
function номерМетода(z,м){ const v=(z.методы||{})[м]; return v?String(v.н||"").trim():""; }
function следующийПротокол(метод, год){
  let max=0;
  J.forEach(z=>{ if(годЗаписи(z)!==String(год)) return;
    const н=номерМетода(z,метод);
    if(/^\d+$/.test(н)) max=Math.max(max, +н); });
  return max+1;
}
function следующийАкт(год){
  let max=0;
  J.forEach(z=>{ if(годЗаписи(z)!==String(год)) return;
    const m=/^АКТ\s+(\d+)-(\d{4})$/.exec(String(z.акт||"").trim());
    if(m && m[2]===String(год)) max=Math.max(max, +m[1]); });
  return max+1;
}
function дваЗнака(n){ return n<10 ? "0"+n : String(n); }
// Полное обозначение протокола: 01-2026-ТК. Идёт в поле #Номер документа.
function обозначениеПротокола(z,м){
  const н=номерМетода(z,м), г=годЗаписи(z);
  return (/^\d+$/.test(н) && г) ? дваЗнака(+н)+"-"+г+"-"+м : "";
}
function методыБезНомера(z){ return methodsOf(z).filter(м=>!/^\d+$/.test(номерМетода(z,м))); }
function ждётНомеров(z){ return methodsOf(z).length>0 && методыБезНомера(z).length>0; }

// ── Право выдачи номеров (эстафета) ───────────────────────
// Право в каждый момент у одного места. Оно лежит в общих данных и
// ходит с обменом: два места не выдадут один номер, потому что выдавать
// может только держатель. Приём тот же, что у «роли мастера».
const GRANT_KEY="lnk_grant";
function getGrant(){
  try{ const r=localStorage.getItem(GRANT_KEY); if(r){ const o=JSON.parse(r);
        return {место:o.место||"", изменено:o.изменено||""}; } }catch(e){}
  return {место:"", изменено:""};
}
function saveGrant(g){ try{ localStorage.setItem(GRANT_KEY, JSON.stringify(g)); }catch(e){} }
function правоМоё(){ const g=getGrant(); return !!g.место && g.место===getWS().код; }
function правоСвободно(){ return !getGrant().место; }

// ── Рабочий журнал (правки живут в localStorage поверх вшитых данных) ──
// Данные вшиты в файл, поэтому редактируемая копия журнала хранится в
// памяти браузера. КЛЮЧ НЕ ЗАВИСИТ ОТ ВЕРСИИ ПРОГРАММЫ — иначе новая
// версия смотрела бы в другой «ящик» и открывалась пустой. Браузер держит
// память для file:// независимо от конкретного файла, поэтому обновление
// программы (замена файла) ваши записи сохраняет.
const STORE_KEY = "lnk_journal";
let J;
function loadJournal(){
  try{
    let raw = localStorage.getItem(STORE_KEY);
    if(!raw){                                   // перенос со старого ключа с версией (до 3.1)
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.indexOf("lnk_journal_")===0){ raw=localStorage.getItem(k); break; }
      }
    }
    if(raw){ const p=JSON.parse(raw); const rows=Array.isArray(p)?p:p.rows;
             if(Array.isArray(rows)) return rows; }
  }catch(e){}
  return JSON.parse(JSON.stringify(DB.журнал));   // первый запуск — копия вшитых
}
// Разовая чистка переноса: в 22 записях в «№ акта» лежал номер протокола
// вида 01-2026-ТК. Он и так стоит в колонке своего метода, а по правилу
// заказчика для ТК и ВД акт не оформляется — значит поле просто лишнее.
function починитьАкты(){
  let n=0;
  J.forEach(z=>{ if(/^\d+-\d{4}-[А-Я]{2}$/.test(String(z.акт||"").trim())){ z.акт=""; n++; } });
  if(n) saveJournal();
  return n;
}
function saveJournal(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({baseVersion:DB.версия, сохранено:new Date().toISOString(), rows:J})); }
  catch(e){ переполнение(e); }
  setChrome();
  копияПоСлучаю();
}
// Отказ записи — не мелочь на полсекунды: правка НЕ сохранена. Молчать
// об этом нельзя, поэтому не подсказка внизу экрана, а окно с ответом,
// что делать.
function переполнение(e){
  const квота = e && (e.name==="QuotaExceededError" || e.code===22);
  if(квота) alert("ПАМЯТЬ БРАУЗЕРА ЗАПОЛНЕНА — правка не сохранена.\n\n"+
    "Что сделать сейчас:\n"+
    "1. «Обмен» → «Сохранить копию» (файл уйдёт в папку загрузок).\n"+
    "2. Удалите из журнала то, что уже сдано в архив, либо сообщите мне — "+
    "перенесу базу в хранилище на 1 ГБ вместо 5 МБ.\n\n"+
    "Пока память не освободится, новые правки сохраняться не будут.");
  else toast("Не удалось сохранить в память браузера");
}
// ── Рабочее место (код для обмена) ────────────────────────
// Код места входит в id новых записей — тогда при слиянии журналов
// с разных мест записи не сталкиваются (у каждого места свои id).
function getWS(){
  try{ const r=localStorage.getItem("lnk_ws"); if(r){ const o=JSON.parse(r);
        return {код:(o.код||"М1"), мастер:!!o.мастер}; } }catch(e){}
  return {код:"М1", мастер:false};
}
function saveWS(o){
  try{ localStorage.setItem("lnk_ws", JSON.stringify(o)); }catch(e){}
  const el=document.getElementById("wsName"); if(el) el.textContent=o.код;
}
function newId(pfx){
  return (pfx||"З") + "-" + getWS().код + "-" + Date.now().toString(36).toUpperCase()
    + "-" + Math.random().toString(36).slice(2,5).toUpperCase();
}

// ── Справочники как рабочие копии (для правки и обмена) ────
// Объекты, приборы, специалисты — тоже редактируемые и переносятся
// обменом, поэтому живут в памяти браузера, как журнал. Те же правила:
// «живые» без удалённых, слияние по свежести, мягкое удаление.
const REG_OBJ="lnk_obj", REG_SI="lnk_si", REG_PPL="lnk_ppl";
// Акт охватывает много записей журнала (в вашем акте 28-2026 — 23 объекта),
// поэтому у него есть свои поля: контракт, фраза об объектах, подписи.
// В записи журнала их держать негде — они общие на весь акт.
const REG_AKT="lnk_akts";
let O, S, P, A;
function loadReg(key, seed){
  try{ const raw=localStorage.getItem(key); if(raw){ const p=JSON.parse(raw);
       const rows=Array.isArray(p)?p:p.rows; if(Array.isArray(rows)) return rows; } }catch(e){}
  return JSON.parse(JSON.stringify(seed||[]));
}
function saveReg(key, arr){
  try{ localStorage.setItem(key, JSON.stringify({версия:DB.версия, сохранено:new Date().toISOString(), rows:arr})); }
  catch(e){ переполнение(e); }
  копияПоСлучаю();
}
function live(arr){ return arr.filter(z=>!z.удалено); }
function rebuildObjIndex(){
  for(const k in objById) delete objById[k];
  for(const k in objByName) delete objByName[k];
  live(O).forEach(o=>{ objById[o.id]=o; if(o.наименование) objByName[o.наименование]=o; });
}
// Общее слияние по id со свежестью (журнал и справочники одинаково).
function mergeInto(arr, key, incoming){
  let added=0, updated=0, skipped=0; const idx={}; arr.forEach((z,i)=>idx[z.id]=i);
  (incoming||[]).forEach(r=>{ if(!r||!r.id) return;
    if(idx[r.id]==null){ arr.push(r); idx[r.id]=arr.length-1; if(!r.удалено) added++; }
    else { if(lastTs(r) > lastTs(arr[idx[r.id]])){ arr[idx[r.id]]=r; updated++; } else skipped++; } });
  if(key && (added||updated)) saveReg(key, arr);
  return {added,updated,skipped};
}

// Отдать файл на скачивание (обмен, копии).
function dl(name, text){
  const blob=new Blob([text],{type:"application/json;charset=utf-8"}), url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();}, 400);
}

// ── helpers ───────────────────────────────────────────────
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function ru(d){ if(!d) return ""; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d); return m?`${m[3]}.${m[2]}.${m[1]}`:d; }
function statusClass(s){ s=(s||"").toLowerCase();
  if(s.includes("зарегистр")) return "ok";
  if(s.includes("аннул")) return "bad";
  if(s.includes("работ")||s.includes("чернов")) return "work";
  return "new"; }
function methodsOf(z){ return Object.keys(z.методы||{}); }

// Шапка печатного документа: на экране не видна, в PDF/на бумаге —
// заголовок, что именно отобрано и когда сформировано. Без этого
// распечатка не документ, а безымянная таблица.
function printHead(title, подзаголовок){
  const орг=getOrg();
  return `<div class="print-only print-head">
    ${орг?`<div class="ph-sub" style="margin:0 0 6px">${esc(орг)}</div>`:""}
    <div class="ph-title">${esc(title)}</div>
    <div class="ph-sub">${подзаголовок?esc(подзаголовок)+" · ":""}сформировано ${ru(new Date().toISOString().slice(0,10))}</div>
  </div>`;
}
function printSign(){
  return `<div class="print-only print-sign">Составил: <span class="sl"></span> /
    <span class="sl"></span>/<div style="margin-top:10px;font-size:11px;color:#555">
    (подпись) &nbsp;&nbsp;&nbsp;&nbsp; (расшифровка)</div></div>`;
}

function setChrome(){
  document.getElementById("cJournal").textContent=liveJ().length;
  document.getElementById("cObjects").textContent=live(O).length;
  document.getElementById("cSi").textContent=live(S).length;
  document.getElementById("cPeople").textContent=live(P).length;
  const cd=document.getElementById("cDocs");
  if(cd) cd.textContent=liveJ().filter(ждётНомеров).length;
  document.getElementById("fRows").textContent=liveJ().length;
  document.getElementById("fBuilt").textContent=ru(DB.собрано)||DB.собрано||"—";
  document.getElementById("verTag").textContent="v"+(DB.версия||"?")+" • реальные данные";
}

// ── Журнал: фильтры и сортировка ──────────────────────────
// Фильтры намеренно НЕ запоминаются между открытиями: иначе можно
// открыть журнал, увидеть 12 записей вместо 315 и решить, что данные
// пропали. Сортировка запоминается — она ничего не прячет.
let jf={год:"",метод:"",статус:""};
let jsort=(function(){ try{ const r=localStorage.getItem("lnk_jsort");
  if(r){ const o=JSON.parse(r); if(o&&o.c) return {c:o.c,d:o.d===1?1:-1}; } }catch(e){}
  return {c:"дата", d:-1}; })();   // по умолчанию — свежие сверху

function jsortSave(){ try{ localStorage.setItem("lnk_jsort",JSON.stringify(jsort)); }catch(e){} }
function setJF(k,v){ jf[k]=v; renderJournal(); }
function resetJF(){ jf={год:"",метод:"",статус:""}; query=""; renderJournal(); }
function sortJournal(c){
  if(jsort.c===c) jsort.d=-jsort.d; else { jsort.c=c; jsort.d=(c==="дата")?-1:1; }
  jsortSave(); renderJournal();
}
// Отобранные и отсортированные записи. Одна функция на список, экспорт
// и печать — чтобы в Excel уходило ровно то, что видно на экране.
function journalRows(){
  const q=(query||"").toLowerCase();
  const rows=liveJ().filter(z=>{
    if(jf.год && (z.дата||"").slice(0,4)!==jf.год) return false;
    if(jf.метод && !(z.методы&&z.методы[jf.метод])) return false;
    if(jf.статус && (z.статус||"")!==jf.статус) return false;
    if(q && !((z.объект||"")+(z.акт||"")+(z.наименование||"")+(z.зав||"")+(z.рег||"")+
              methodsOf(z).join(" ")+(z.дата||"")).toLowerCase().includes(q)) return false;
    return true;
  });
  const key=z=>{ switch(jsort.c){
    case "акт": return z.акт||"";
    case "объект": return z.объект||"";
    case "методы": return methodsOf(z).join(" ");
    case "статус": return z.статус||"";
    default: return z.дата||""; } };
  // Пустые значения всегда внизу — и по возрастанию, и по убыванию:
  // иначе сортировка по № акта поднимает наверх записи без номера.
  return rows.sort((a,b)=>{
    const A=String(key(a)||""), B=String(key(b)||"");
    if(!A && !B) return 0;
    if(!A) return 1;
    if(!B) return -1;
    return A.localeCompare(B,"ru",{numeric:true})*jsort.d;
  });
}

// ── Журнал ────────────────────────────────────────────────
function renderJournal(){
  const rows=journalRows();
  const годы=[...new Set(liveJ().map(z=>(z.дата||"").slice(0,4)).filter(Boolean))].sort().reverse();
  const статусы=[...new Set(liveJ().map(z=>z.статус).filter(Boolean))].sort();
  const методыЕсть=METHODS.filter(m=>liveJ().some(z=>z.методы&&z.методы[m]));
  const естьФильтр=jf.год||jf.метод||jf.статус||query;
  const opt=(cur,arr,пусто)=>`<option value="">${пусто}</option>`+
    arr.map(v=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v)}</option>`).join("");
  const стрелка=c=>jsort.c===c?(jsort.d===1?" ▲":" ▼"):"";
  const th=(c,l)=>`<th class="sortable" onclick="sortJournal('${c}')">${l}${стрелка(c)}</th>`;
  // Колонка «№ п/п» существует всегда, но видна только в печати:
  // на экране она не нужна, а в распечатке без неё строки не сослаться.
  const body=rows.length?rows.map((z,i)=>`
    <tr onclick="showJournal('${esc(z.id)}')">
      <td class="pnum num">${i+1}</td>
      <td class="num">${esc(z.акт)||"—"}</td>
      <td class="num">${ru(z.дата)}</td>
      <td class="obj">${esc(z.объект)}${z.зав?`<div class="muted" style="font-size:11.5px">зав. № ${esc(z.зав)}${z.рег?` · рег. ${esc(z.рег)}`:""}</div>`:""}</td>
      <td>${methodsOf(z).map(m=>{const н=номерМетода(z,m);
        return `<span class="pill${н?"":" nonum"}" title="${н?"протокол "+esc(обозначениеПротокола(z,m)):"номер не выдан"}">${m}${н?" "+esc(н):""}</span>`;
        }).join("")||"<span class='muted'>—</span>"}</td>
      <td><span class="st ${statusClass(z.статус)}">${esc(z.статус)||"—"}</span>${ждётНомеров(z)?`<div class="muted" style="font-size:11px">ждёт номера</div>`:""}</td>
    </tr>`).join(""):`<tr><td colspan="6" class="empty">Ничего не найдено.</td></tr>`;
  // Что именно отобрано — попадёт в подзаголовок распечатки.
  const отбор=[jf.год?("год "+jf.год):"", jf.метод?("метод "+jf.метод):"",
    jf.статус?("статус: "+jf.статус):"", query?("поиск: «"+query+"»"):""].filter(Boolean).join(", ");
  document.getElementById("main").innerHTML=`
    ${printHead("Журнал учёта заключений ЛНК",
      (отбор?("отобрано: "+отбор+" · "):"")+"записей "+rows.length)}
    <div class="head">
      <h2>Журнал</h2><span class="sub" id="cnt">${rows.length} из ${liveJ().length}</span>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Поиск: объект, № акта, зав. №, метод…" value="${esc(query)}"></div>
      <div class="spring"></div>
      <button class="btn primary" onclick="editJournal(null)">＋ Добавить запись</button>
      <button class="btn" onclick="exportCSV()">▤ Excel</button>
      <button class="btn" onclick="window.print()">⎙ PDF</button>
      <button class="btn" onclick="backupSave()" title="Резервная копия всей базы в файл">▼ Копия</button>
    </div>
    <div class="filters noprint">
      <label>Год <select onchange="setJF('год',this.value)">${opt(jf.год,годы,"все")}</select></label>
      <label>Метод <select onchange="setJF('метод',this.value)">${opt(jf.метод,методыЕсть,"любой")}</select></label>
      <label>Статус <select onchange="setJF('статус',this.value)">${opt(jf.статус,статусы,"любой")}</select></label>

function завЗаписи(z){

// Черновик фразы об объектах. Две формы — обе ваши:
//   один тип на всех  → «Баллон … , зав. №№ 1, 2, 3»          (акт 28-2026)
//   разные объекты    → «испаритель …; конденсатор … и ресивер …» (акт 35-2026)
function черновикОбъектов(zs){
  const имена=[...new Set(zs.map(именоватьОбъект).filter(Boolean))];
  if(имена.length===1){
    const завы=zs.map(завЗаписи).filter(Boolean);
    return имена[0]+(завы.length?(", зав. №№ "+завы.join(", ")):"");
  }
  const части=zs.map(z=>{
    const ч=[именоватьОбъект(z)];
    if(завЗаписи(z)) ч.push("зав. № "+завЗаписи(z));
    if(регЗаписи(z)) ч.push("рег. № "+регЗаписи(z));
    return ч.filter(Boolean).join(", ");
  }).filter(Boolean);
  if(части.length>1) return части.slice(0,-1).join("; ")+" и "+части[части.length-1];
  return части[0]||"";
}

// ── Выгрузка акта в Word (.docx) ──────────────────────────
// Печать в PDF документ закрывает, а перед подписанием формулировку
// обычно правят. Поэтому акт выгружается настоящим .docx: Word откроет
// его как свой, без предупреждений о формате.
//
// Библиотек нет и быть не может (программа — один файл, без сети),
// поэтому .docx собирается здесь: это ZIP, и он пишется без сжатия
// (метод «store») — так архив укладывается в полсотни строк, а Word
// такие файлы принимает наравне со сжатыми.
function crc32(buf){
  let tbl=crc32.t;
  if(!tbl){ tbl=crc32.t=new Int32Array(256);
    for(let n=0;n<256;n++){ let c=n;
      for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      tbl[n]=c; } }
  let crc=-1;
  for(let i=0;i<buf.length;i++) crc=(crc>>>8)^tbl[(crc^buf[i])&0xFF];
  return (crc^-1)>>>0;
}
function zipStore(файлы){
  const enc=new TextEncoder(), куски=[], центр=[];
  let смещение=0;
  файлы.forEach(f=>{
    const имя=enc.encode(f.имя);
    const d=(typeof f.данные==="string")?enc.encode(f.данные):f.данные;
    const c=crc32(d);
    const lf=new Uint8Array(30+имя.length), lv=new DataView(lf.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true);
    lv.setUint16(6,0x0800,true);            // имена в UTF-8
    lv.setUint16(8,0,true);                 // без сжатия
    lv.setUint32(14,c,true); lv.setUint32(18,d.length,true); lv.setUint32(22,d.length,true);
    lv.setUint16(26,имя.length,true);
    lf.set(имя,30);
    куски.push(lf,d);

    const cd=new Uint8Array(46+имя.length), cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
    cv.setUint32(16,c,true); cv.setUint32(20,d.length,true); cv.setUint32(24,d.length,true);
    cv.setUint16(28,имя.length,true); cv.setUint32(42,смещение,true);
    cd.set(имя,46);
    центр.push(cd);
    смещение+=lf.length+d.length;
  });
  const размерЦентра=центр.reduce((a,x)=>a+x.length,0);
  const eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,файлы.length,true); ev.setUint16(10,файлы.length,true);
  ev.setUint32(12,размерЦентра,true); ev.setUint32(16,смещение,true);
  return new Blob(куски.concat(центр,[eocd]),
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function dlBlob(имя, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=имя;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 400);
}

// Разметка взята из вашего акта: Times New Roman 14 пт (sz 28 полупунктов),
// межстрочный ровно 18 пт (line 360 exact), абзацный отступ 1,25 см (709),
// выключка по ширине, А4 с вашими полями, отдельная шапка первой страницы.
const X = s => String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
const ФОНТ='<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';
const КЕГЛЬ='<w:sz w:val="28"/><w:szCs w:val="28"/>';
function rPr(жирный){ return '<w:rPr>'+ФОНТ+(жирный?'<w:b/>':'')+КЕГЛЬ+'</w:rPr>'; }
const ШР=ФОНТ+КЕГЛЬ;
function wRun(t,жирный){
  return '<w:r>'+rPr(жирный)+'<w:t xml:space="preserve">'+X(t)+'</w:t></w:r>';
}
function wP(t,вид){
  вид=вид||{};
  const jc=вид.jc||"both";
  const ind=вид.отступ===false?'':'<w:ind w:firstLine="709"/>';
  return '<w:p><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="exact"/>'+
    ind+'<w:jc w:val="'+jc+'"/>'+rPr(вид.жирный)+'</w:pPr>'+
    (t?wRun(t,вид.жирный):'')+'</w:p>';
}
function актВWord(ключ){
  const zs=записиАкта(ключ);
  if(!zs.length){ toast("По акту "+ключ+" записей нет"); return; }
  const a=актЗапись(ключ,false);
  const пусто=()=>wP("",{отступ:false});
  const фраза=a.объекты||черновикОбъектов(zs);
  const подр=a.подразделение||[...new Set(zs.map(z=>z.подразделение).filter(Boolean))].join(", ");

  let тело="";
  тело+=wP("АКТ № "+номерАкта(ключ),{jc:"center",жирный:true,отступ:false});
  тело+=wP("о проведении работ",{jc:"center",жирный:true,отступ:false});
  тело+=пусто()+пусто()+пусто();
  тело+=wP("В соответствии с контрактом от "+(a.контракт_дата||"__.__.____")+
           " № "+(a.контракт_номер||"______")+" проведены работы в "+(подр||"___")+
           " по неразрушающему контролю в рамках экспертизы промышленной безопасности на "+
           фраза+".");
  тело+=пусто();
  тело+=wP("Результаты работ отражены в следующих документах.");
  тело+=пусто();
  const нетИмени=[];
  спискиАкта(zs).forEach(g=>{
    const имя=имяДок(g.м);
    if(!имя) нетИмени.push(g.м);
    тело+=wP((имя||("Документы по методу "+g.м))+" №№ "+g.номера.join(", ")+".");
    тело+=пусто();
  });
  тело+=пусто();

  // Таблица подписей — без рамок, прижата вправо, как у вас (3963 + 5098)
  const яч=(t,ш)=>'<w:tc><w:tcPr><w:tcW w:w="'+ш+'" w:type="dxa"/></w:tcPr>'+
    '<w:p><w:pPr><w:spacing w:after="0" w:line="280" w:lineRule="exact"/><w:jc w:val="center"/>'+
    rPr(false)+'</w:pPr>'+(t?wRun(t):'')+'</w:p></w:tc>';
  const строки=подписиАкта(ключ,zs).map(r=>
    '<w:tr><w:trPr><w:trHeight w:val="805"/><w:jc w:val="right"/></w:trPr>'+
    яч(r.д,3963)+яч(r.ф,5098)+'</w:tr>').join("");
  const нет='<w:top w:val="none" w:sz="0" w:space="0" w:color="auto"/>'+
            '<w:left w:val="none" w:sz="0" w:space="0" w:color="auto"/>'+
            '<w:bottom w:val="none" w:sz="0" w:space="0" w:color="auto"/>'+
            '<w:right w:val="none" w:sz="0" w:space="0" w:color="auto"/>'+
            '<w:insideH w:val="none" w:sz="0" w:space="0" w:color="auto"/>'+
            '<w:insideV w:val="none" w:sz="0" w:space="0" w:color="auto"/>';
  тело+='<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:jc w:val="right"/>'+
    '<w:tblBorders>'+нет+'</w:tblBorders>'+
    '<w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar>'+
    '</w:tblPr><w:tblGrid><w:gridCol w:w="3963"/><w:gridCol w:w="5098"/></w:tblGrid>'+
    строки+'</w:tbl>'+пусто();

  const НС='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '+
           'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const шапкаПервой='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:hdr '+НС+'>'+wP(a.шапка||getLabCert()||"Лаборатория НК, св. № ____ от __.__.____ г.",
                        {jc:"left",отступ:false})+'</w:hdr>';
  const шапкаПрочих='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:hdr '+НС+'><w:p><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="exact"/>'+
    '<w:jc w:val="center"/>'+rPr(false)+'</w:pPr>'+
    '<w:fldSimple w:instr=" PAGE "><w:r>'+rPr(false)+'<w:t>2</w:t></w:r></w:fldSimple>'+
    '</w:p></w:hdr>';

  const документ='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document '+НС+'><w:body>'+тело+
    '<w:sectPr><w:headerReference w:type="default" r:id="rId1"/>'+
    '<w:headerReference w:type="first" r:id="rId2"/>'+
    '<w:pgSz w:w="11906" w:h="16838" w:code="9"/>'+
    '<w:pgMar w:top="1134" w:right="1276" w:bottom="567" w:left="1559" '+
    'w:header="567" w:footer="0" w:gutter="0"/><w:titlePg/></w:sectPr></w:body></w:document>';

  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const файлы=[
    {имя:"[Content_Types].xml", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
      '<Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>'+
      '<Override PartName="/word/header2.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>'+
      '</Types>'},
    {имя:"_rels/.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="word/document.xml"/>'+
      '</Relationships>'},
    {имя:"word/_rels/document.xml.rels", данные:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/header" Target="header1.xml"/>'+
      '<Relationship Id="rId2" Type="'+R+'/header" Target="header2.xml"/>'+
      '</Relationships>'},
    {имя:"word/document.xml", данные:документ},
    {имя:"word/header1.xml", данные:шапкаПрочих},
    {имя:"word/header2.xml", данные:шапкаПервой}
  ];
  dlBlob("Акт "+номерАкта(ключ)+".docx", zipStore(файлы));
  toast("Акт выгружен в Word"+(нетИмени.length?(" · без названия: "+нетИмени.join(", ")):""));
}

function renderAkt(ключ){
  const zs=записиАкта(ключ);

  curView="akt";
  document.querySelectorAll(".nav").forEach(n=>n.classList.remove("on"));
  const a=актЗапись(ключ,false);
  const e=(v)=>esc(v||"");
  const поле=(п,ph,знач)=>`<span class="fld" contenteditable="true" data-ph="${ph}"
      oninput="saveАкт('${e(ключ)}','${п}',this.innerText)">${e(знач)}</span>`;
  const фраза=a.объекты || черновикОбъектов(zs);
  const своя=!!a.объекты;
  const подр=a.подразделение || [...new Set(zs.map(z=>z.подразделение).filter(Boolean))].join(", ");

  const абзацы=спискиАкта(zs).map(g=>{
    const имя=имяДок(g.м);
    const шапка=имя
      ? `<span class="fld" contenteditable="true" data-ph="название документов"
           oninput="saveИмяДок('${g.м}',this.innerText)">${e(имя)}</span>`
      : `<span class="fld" contenteditable="true" data-ph="как называются документы по методу ${g.м} — впишите"
           oninput="saveИмяДок('${g.м}',this.innerText)"></span>`;
    return `<p class="aktp">${шапка} <span class="nbr">№№</span> ${g.номера.map(e).join(", ")}.</p>`+
      (имя?"":`<div class="fldhint">Метода ${g.м} в присланных актах не было — название документов не выдумываю. Впишите один раз, оно запомнится.</div>`);
  }).join("") || `<p class="aktp"><i>Ни у одного метода нет выданного номера — выдайте номера в записях.</i></p>`;

  const подписи=подписиАкта(ключ,zs);
  const строкиП=подписи.map((r,i)=>`
    <tr>
      <td class="pos"><span class="fld" contenteditable="true" data-ph="должность"
        oninput="saveПодпись('${e(ключ)}',${i},'д',this.innerText)">${e(r.д)}</span>
        <button class="btn small noprint" style="margin-left:6px" title="убрать строку"
          onclick="подписьМинус('${e(ключ)}',${i})">×</button></td>
      <td class="nm"><span class="fld" contenteditable="true" data-ph="И.О. Фамилия"
        oninput="saveПодпись('${e(ключ)}',${i},'ф',this.innerText)">${e(r.ф)}</span></td>
    </tr>`).join("");

  const безНомера=zs.filter(ждётНомеров).length;
  document.getElementById("main").innerHTML=`
    <div class="head noprint">
      <button class="btn" onclick="switchView('docs')">← К списку</button>
      <h2 style="font-size:16px">Акт № ${e(номерАкта(ключ))}</h2>
      <span class="sub">объектов ${zs.length}</span>
      <div class="spring"></div>
      <button class="btn" onclick="актВWord('${e(ключ)}')">⤓ Word (.docx)</button>
      <button class="btn primary" onclick="window.print()">⎙ Печать / PDF</button>
    </div>
    <div class="aktbar noprint">
      <button class="btn small" onclick="сбросФразы('${e(ключ)}')">↺ Пересобрать фразу об объектах</button>
      <button class="btn small" onclick="подписьПлюс('${e(ключ)}')">+ Строка подписи</button>
      ${безНомера?`<span class="st work">${безНомера} записей ждут номера</span>`:""}
    </div>
    <div class="draftnote noprint">Жёлтым — поля, которые заполняются руками: их неоткуда взять из
      журнала. Всё вписанное сохраняется и уходит в обмен вместе с актом.
      <b>Фразу об объектах проверьте по падежу</b>: в акте пишется «на баллонах…», а из
      справочника приходит «Баллон…». Склонение я не подставляю — на подписываемом
      документе ошибка в падеже хуже, чем ручная правка один раз.</div>
    <div class="sheet">

      <h1 class="akt">АКТ № ${e(номерАкта(ключ))}</h1>
      <div class="aktsub">о проведении работ</div>

      <p class="aktp">В соответствии с контрактом от ${поле("контракт_дата","__.__.____",a.контракт_дата)}

        в ${поле("подразделение","заказывающее подразделение",подр)}

          oninput="saveАкт('${e(ключ)}','объекты',this.innerText)">${e(фраза)}</span>.</p>
      <div class="fldhint">${своя?"Фраза об объектах правлена вами.":"Фраза об объектах — черновик из "+zs.length+" записей журнала."}</div>

      <p class="aktp noind">Результаты работ отражены в следующих документах.</p>
      ${абзацы}

      <table class="signtbl"><tbody>${строкиП}</tbody></table>
    </div>`;
}

// ── Выдача номеров ────────────────────────────────────────
function нетПрава(){
  const g=getGrant();
  alert("Выдавать номера может только место, у которого сейчас право выдачи.\n\n"+
    (g.место ? ("Сейчас право у места: "+g.место) : "Право пока никому не назначено.")+
    "\n\nВкладка «Обмен» → «Право выдачи номеров»: там можно принять право на себя "+
    "или передать его другому месту.\n\nЗаписи при этом вводятся как обычно — они просто ждут номера.");
  switchView("exchange");
}
function выдатьНомера(id){
  if(!правоМоё()){ нетПрава(); return; }
  const z=J.find(x=>String(x.id)===String(id)); if(!z) return;
  const г=годЗаписи(z);
  if(!г){ toast("У записи не заполнена дата — год берётся из неё"); return; }
  const нет=методыБезНомера(z);
  if(!нет.length){ toast("У всех методов записи номера уже есть"); return; }
  const выдано=[];
  нет.forEach(м=>{
    const н=следующийПротокол(м,г);
    z.методы[м]=Object.assign({}, z.методы[м], {н:String(н)});
    выдано.push(дваЗнака(н)+"-"+г+"-"+м);
  });
  z.изменено=new Date().toISOString(); z.место=getWS().код;
  saveJournal();
  if(curView==="journal") renderJournal(); else if(curView==="docs") renderDocs();
  showJournal(id);
  alert("Выданы номера протоколов:\n\n"+выдано.join("\n"));
}
function выдатьАкт(id){
  if(!правоМоё()){ нетПрава(); return; }
  const z=J.find(x=>String(x.id)===String(id)); if(!z) return;
  const г=годЗаписи(z);
  if(!г){ toast("У записи не заполнена дата — год берётся из неё"); return; }
  if(String(z.акт||"").trim()){ toast("У записи уже есть номер акта"); return; }
  const мет=methodsOf(z);
  const толькоТКВД = мет.length>0 && мет.every(м=>м==="ТК"||м==="ВД");
  if(толькоТКВД && !confirm("По методам "+мет.join(", ")+" акт, как правило, не оформляется.\n\nВсё равно выдать номер акта?")) return;
  const н=следующийАкт(г);
  z.акт="АКТ "+дваЗнака(н)+"-"+г;
  z.изменено=new Date().toISOString(); z.место=getWS().код;
  saveJournal();
  if(curView==="journal") renderJournal(); else if(curView==="docs") renderDocs();
  showJournal(id);
  toast("Выдан номер акта: "+z.акт);
}
function принятьПраво(){
  const g=getGrant(), ws=getWS();
  if(g.место===ws.код){ toast("Право уже у вас"); return; }
  const было = g.место ? ("Сейчас право у места: "+g.место+".\n\nЕсли там сейчас тоже выдают номера и вы "+
      "оба возьмёте право порознь, два места могут выдать один номер. Программа покажет такое "+
      "столкновение при обмене, но исправлять придётся вручную.\n\n") : "Право пока никому не назначено.\n\n";
  if(!confirm(было+"Принять право выдачи номеров на место "+ws.код+"?")) return;
  saveGrant({место:ws.код, изменено:new Date().toISOString()});
  renderExchange(); toast("Право выдачи номеров теперь у места "+ws.код);
}
function передатьПраво(){
  if(!правоМоё()){ toast("Передать можно только своё право"); return; }
  const кому=(prompt("Кому передать право выдачи номеров?\nУкажите код места (например М2):","")||"").trim();
  if(!кому) return;
  if(кому===getWS().код){ toast("Это ваше же место"); return; }
  saveGrant({место:кому, изменено:new Date().toISOString()});
  renderExchange();
  alert("Право передано месту "+кому+".\n\nОно получит его после обмена: выгрузите файл и передайте туда.");
}

// ── Акты и протоколы ──────────────────────────────────────
// Раздел отвечает на один рабочий вопрос: по каким записям документ уже
// оформлен, а по каким ещё нет. «Оформлен» = в документе вписано
// заключение (оно и хранится в записи).
let df="акты";                          // акты | без | нужно | готовые | все
function setDF(v){ df=v; renderDocs(); }
function оформлен(z){ return !!String(z.заключение||"").trim(); }
function docsRows(){
  const q=(query||"").toLowerCase();
  return liveJ().filter(z=>{
    if(df==="без" && !ждётНомеров(z)) return false;
    if(df==="готовые" && !(оформлен(z) && !ждётНомеров(z))) return false;
    if(df==="нужно" && (оформлен(z) || ждётНомеров(z))) return false;
    if(q && !((z.объект||"")+(z.акт||"")+(z.заключение||"")).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>String(b.дата||"").localeCompare(String(a.дата||"")));
}
function renderDocs(){
  const rows=docsRows();
  const всего=liveJ().length;
  const гот=liveJ().filter(z=>оформлен(z)&&!ждётНомеров(z)).length;
  const безном=liveJ().filter(ждётНомеров).length;
  const seg=(v,l,n)=>`<button class="btn ${df===v?"on":""}" onclick="setDF('${v}')">${l} <b>${n}</b></button>`;
  const акты=списокАктов();
  const q=(query||"").toLowerCase();
  const актыП=q?акты.filter(g=>(g.ключ+" "+g.записи.map(z=>z.объект).join(" ")).toLowerCase().includes(q)):акты;
  const bodyА=актыП.length?актыП.map(g=>{
    const zs=g.записи, дата=zs.map(z=>z.дата).filter(Boolean).sort();
    const мет=спискиАкта(zs);
    const ждут=zs.filter(ждётНомеров).length;
    return `<tr onclick="renderAkt('${esc(g.ключ)}')">
      <td class="num">${esc(номерАкта(g.ключ))}</td>
      <td class="num">${ru(дата[0])}${дата.length>1&&дата[дата.length-1]!==дата[0]?(" – "+ru(дата[дата.length-1])):""}</td>
      <td class="num">${zs.length}</td>
      <td class="obj">${esc([...new Set(zs.map(именоватьОбъект))].join("; ").slice(0,64))}</td>
      <td class="mets">${мет.map(g2=>`${g2.м}&nbsp;${g2.номера.length}`).join(" · ")||"<span class='muted'>—</span>"}
        ${ждут?`<span class="st work" style="margin-left:6px">${ждут} без номера</span>`:""}</td>
    </tr>`;}).join(""):`<tr><td colspan="5" class="empty">Актов не найдено.</td></tr>`;
  const body=rows.length?rows.map(z=>`
    <tr onclick="renderDoc('${esc(z.id)}')">
      <td class="num">${esc(z.акт)||"—"}</td>
      <td class="num">${ru(z.дата)}</td>
      <td class="obj">${esc(z.объект)}</td>
      <td>${methodsOf(z).map(m=>`<span class="pill">${m}</span>`).join("")||"<span class='muted'>—</span>"}</td>
      <td>${ждётНомеров(z) ? `<span class="st work">ждёт номера</span>`
        : оформлен(z) ? `<span class="st ok">готов</span>`
        : `<span class="st new">нет заключения</span>`}</td>
      <td class="obj muted" style="font-size:12px">${esc(String(z.заключение||"").slice(0,90))}${String(z.заключение||"").length>90?"…":""}</td>
    </tr>`).join(""):`<tr><td colspan="6" class="empty">Ничего не найдено.</td></tr>`;
  document.getElementById("main").innerHTML=`
    ${printHead("Акты и протоколы", df==="акты"?("актов "+актыП.length)
      : (df==="без"?"ждут номера":df==="готовые"?"готовые":df==="нужно"?"без заключения":"все")+" · записей "+rows.length)}
    <div class="head">
      <h2>Акты и протоколы</h2><span class="sub">${df==="акты"?(актыП.length+" актов"):(rows.length+" из "+всего)}</span>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Поиск: объект, № акта, текст заключения…" value="${esc(query)}"></div>
      <div class="spring"></div>

function saveRegRec(kind,id){

// ── Резервная копия ВСЕЙ базы в файл ──────────────────────
// Копия охватывает журнал и все три справочника: с тех пор как
// справочники стали редактируемыми, копия только журнала оставляла бы
// половину работы без страховки. Восстановление — именно замена
// (в этом смысл копии), поэтому спрашивает подтверждение.
// ── База: где живут данные и чем они застрахованы ─────────
// Данных «в файле рядом с программой» не бывает: страница, открытая с
// диска, писать в свою папку сама не может. Поэтому рабочая база лежит
// в памяти браузера, а настоящая страховка — копия в файл.
//
// Замерено в этом браузере: предел памяти ~5 МБ, сейчас занято 236 КБ на
// 315 записей вместе со справочниками (~766 символов на запись) — то есть
// запас примерно на 6500 записей. Далеко, но предел молчаливый: браузер
// не предупреждает, он просто отказывает в записи, и правка пропадает.
// Поэтому ниже и счётчик заполнения, и предупреждение заранее.
const ПРЕДЕЛ_ХРАНИЛИЩА = 5 * 1024 * 1024;   // символов, проверено замером
function объёмХранилища(){
  let занято=0, по={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i), v=localStorage.getItem(k)||"";
      if(k.indexOf("lnk_")!==0) continue;
      по[k]=k.length+v.length; занято+=k.length+v.length;
    }
  }catch(e){}
  // До первой правки память браузера пуста: данные ещё вшиты в файл
  // программы. Считать запас по нулю нельзя — получилась бы бессмыслица
  // вроде «хватит на 103 миллиона записей». Берём то, что реально ляжет
  // в память при первом же сохранении.
  let факт=0;
  try{ факт=(JSON.stringify(J)+JSON.stringify(O)+JSON.stringify(S)+
             JSON.stringify(P)+JSON.stringify(A)).length; }catch(e){}
  const всего=Math.max(занято,факт);
  const наЗапись = liveJ().length ? всего/liveJ().length : 0;
  return { всего:всего, по:по, занято:занято,
           доля: всего/ПРЕДЕЛ_ХРАНИЛИЩА,
           местаНаЗаписей: наЗапись>1 ? Math.round((ПРЕДЕЛ_ХРАНИЛИЩА-всего)/наЗапись) : null };
}

// Папку для копий надо запомнить между запусками, а localStorage хранит
// только строки — «ручку» на папку в него не положить. Для этого есть
// IndexedDB, она в этом браузере из file:// работает (проверено).
const ФС_БД="lnk_fs", ФС_ХР="ручки";
function идб(){
  return new Promise((ок,нет)=>{
    let r; try{ r=indexedDB.open(ФС_БД,1); }catch(e){ return нет(e); }
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore(ФС_ХР); }catch(e){} };
    r.onsuccess=()=>ок(r.result); r.onerror=()=>нет(r.error);
  });
}
function идбЗапись(ключ,знач){
  return идб().then(db=>new Promise((ок,нет)=>{
    const t=db.transaction(ФС_ХР,"readwrite");
    t.objectStore(ФС_ХР).put(знач,ключ);
    t.oncomplete=()=>{db.close();ок(true);}; t.onerror=()=>{db.close();нет(t.error);};
  })).catch(()=>false);
}
function идбЧтение(ключ){
  return идб().then(db=>new Promise((ок)=>{
    const t=db.transaction(ФС_ХР,"readonly"), z=t.objectStore(ФС_ХР).get(ключ);
    z.onsuccess=()=>{db.close();ок(z.result||null);}; z.onerror=()=>{db.close();ок(null);};
  })).catch(()=>null);
}

async function папкаКопий(){ if(!_папка) _папка=await идбЧтение("папкаКопий"); return _папка; }
async function правоНаПапку(спросить){
  const h=await папкаКопий(); if(!h) return "нет папки";

    if(p==="granted") return "есть";
    if(спросить){ p=await h.requestPermission({mode:"readwrite"});
                  if(p==="granted") return "есть"; }
    return "нужно разрешение";
  }catch(e){ return "нужно разрешение"; }
}

function имяКопии(){
  const d=new Date(), дв=n=>(n<10?"0":"")+n;
  return "ЛНК копия "+d.getFullYear()+"-"+дв(d.getMonth()+1)+"-"+дв(d.getDate())+
         " "+дв(d.getHours())+дв(d.getMinutes())+" ("+getWS().код+").json";

// Копий держим несколько поколений: одна-единственная копия бесполезна,
// если испортили данные и записали поверх. Старые сверх ДЕРЖАТЬ удаляются.
const ДЕРЖАТЬ_КОПИЙ=14;
async function чиститьСтарые(){
  const h=await папкаКопий(); if(!h) return 0;
  try{
    const свои=[];
    for await (const [имя,ручка] of h.entries())
      if(/^ЛНК копия .+\.json$/.test(имя) && ручка.kind==="file") свои.push(имя);
    свои.sort();                                   // имя начинается с даты — сортировка хронологическая
    const лишние=свои.slice(0, Math.max(0, свои.length-ДЕРЖАТЬ_КОПИЙ));
    for(const имя of лишние) await h.removeEntry(имя);
    return лишние.length;
  }catch(e){ return 0; }
}
async function копияВПапку(тихо){
  const h=await папкаКопий(); if(!h) return false;
  if(await правоНаПапку(!тихо)!=="есть") return false;
  try{
    const ф=await h.getFileHandle(имяКопии(),{create:true});
    const w=await ф.createWritable();
    await w.write(данныеКопии()); await w.close();
    try{ localStorage.setItem("lnk_last_backup", new Date().toISOString()); }catch(e){}
    await чиститьСтарые();
    if(!тихо) toast("Копия записана в папку");
    return true;
  }catch(e){ if(!тихо) toast("Не удалось записать копию: "+e.name); return false; }
}
// Копия делается сама, но не после каждой правки: раз в 10 минут работы
// достаточно, а чаще — только мешает диску и глазу.
let _когдаКопия=0;
function копияПоСлучаю(){
  const т=Date.now();
  if(т-_когдаКопия < 10*60*1000) return;
  _когдаКопия=т;
  папкаКопий().then(h=>{ if(h) копияВПапку(true); });
}
function когдаКопия(){
  try{ return localStorage.getItem("lnk_last_backup")||""; }catch(e){ return ""; }
}
function днейБезКопии(){
  const t=когдаКопия(); if(!t) return null;
  return Math.floor((Date.now()-new Date(t).getTime())/86400000);
}

  `<div class="head"><h2>${t}</h2></div><div class="placeholder"><div><div class="big">▦</div>${x}</div></div>`;}
// ── Обмен между рабочими местами ──────────────────────────
// Файлами, без сети. Слияние по id записи: новых нет — добавляем;
// есть — берём ту, у кого «изменено» свежее. Код места входит в id
// новых записей, поэтому места не затирают друг друга.
function mergeJournal(incoming){
  let added=0, updated=0, skipped=0;
  const idx={}; J.forEach((z,i)=>{ idx[z.id]=i; });
  incoming.forEach(r=>{
    if(!r||!r.id) return;
    if(idx[r.id]==null){ J.push(r); idx[r.id]=J.length-1; if(!r.удалено) added++; }
    else { const cur=J[idx[r.id]];
      if(lastTs(r) > lastTs(cur)){ J[idx[r.id]]=r; updated++; }
      else skipped++; }
  });
  if(added||updated) saveJournal();
  return {added,updated,skipped};
}
// Два места могли выдать один номер, если оба брали право порознь.
// Молчать об этом нельзя: номер уже мог уйти на подписанный документ.
function проверитьСтолкновения(){
  const карта={}, из=[];
  liveJ().forEach(z=>{ const г=годЗаписи(z); if(!г) return;
    methodsOf(z).forEach(м=>{ const н=номерМетода(z,м); if(!/^\d+$/.test(н)) return;
      const ключ=м+"-"+г+"-"+н; (карта[ключ]=карта[ключ]||[]).push(z); });
    const m=/^АКТ\s+(\d+)-(\d{4})$/.exec(String(z.акт||"").trim());
    if(m){ const ключ="АКТ-"+m[2]+"-"+m[1]; (карта[ключ]=карта[ключ]||[]).push(z); }
  });
  Object.keys(карта).forEach(k=>{
    const сп=карта[k];
    // Акт законно повторяется: один акт охватывает несколько объектов.
    if(k.indexOf("АКТ-")===0) return;
    if(сп.length>1) из.push(k.replace(/^(\S+?)-(\d{4})-(\d+)$/,"$3-$2-$1")+
      ": " + сп.map(z=>(z.объект||"без объекта").slice(0,28)).join(" / "));
  });
  return из;
}

let _exIn;
function exchangeImport(){
  if(!_exIn){
    _exIn=document.createElement("input"); _exIn.type="file"; _exIn.accept=".json"; _exIn.multiple=true; _exIn.style.display="none"; document.body.appendChild(_exIn);
    _exIn.addEventListener("change",e=>{
      const files=[...e.target.files]; if(!files.length) return;
      let done=0, tot={j:0,o:0,s:0,p:0}, отчёт=[];
      files.forEach(f=>{
        const rd=new FileReader();
        rd.onload=()=>{
          try{
            const d=JSON.parse(rd.result);
            const jarr=Array.isArray(d)?d:d.записи;
            if(!Array.isArray(jarr) && !d.объекты && !d.приборы && !d.специалисты)
              throw new Error("не файл обмена");
            const rj=Array.isArray(jarr)?mergeJournal(jarr):{added:0,updated:0,skipped:0};
            // Право выдачи — свежее побеждает, как и всё остальное.
            if(d.право && d.право.изменено && d.право.изменено > getGrant().изменено){
              saveGrant({место:d.право.место||"", изменено:d.право.изменено});
            }
            const ro=mergeInto(O,REG_OBJ,d.объекты);
            const rs=mergeInto(S,REG_SI,d.приборы);
            const rp=mergeInto(P,REG_PPL,d.специалисты);
            mergeInto(A,REG_AKT,d.акты);
            // Названия документов по методам — свежее побеждает.
            if(d.названия && d.названия.изменено && d.названия.изменено > имена().изменено)
              saveИмена({имена:Object.assign({}, имена().имена, d.названия.имена||{}),
                         изменено:d.названия.изменено});
            if(ro.added||ro.updated) rebuildObjIndex();
            tot.j+=rj.added+rj.updated; tot.o+=ro.added+ro.updated; tot.s+=rs.added+rs.updated; tot.p+=rp.added+rp.updated;
            отчёт.push((d.место?("["+d.место+"] "):"")+f.name+
              ": журнал +"+rj.added+"/"+rj.updated+", объекты +"+ro.added+"/"+ro.updated+
              ", СИ +"+rs.added+"/"+rs.updated+", спец. +"+rp.added+"/"+rp.updated);
          }catch(err){ отчёт.push(f.name+": ошибка — "+err.message); }
          if(++done===files.length){
            try{ localStorage.setItem("lnk_last_import", new Date().toISOString()); }catch(e){}
            renderExchange();
            const столк=проверитьСтолкновения();
            if(столк.length) alert("ВНИМАНИЕ: одинаковые номера у разных записей.\n\n"+
              столк.slice(0,12).join("\n")+(столк.length>12?("\n… всего "+столк.length):"")+
              "\n\nТакое бывает, если два места выдавали номера порознь. Исправьте вручную: "+
              "откройте записи и задайте верные номера.");
            alert("Принято файлов: "+files.length+"\n\n"+отчёт.join("\n")+
              "\n\nВсего изменений: журнал "+tot.j+", объекты "+tot.o+", приборы "+tot.s+", специалисты "+tot.p+
              ".\n(в записи «+новых/обновлено»)");
            toast("Обмен принят");
          }
        };
        rd.readAsText(f);
      });
      e.target.value="";
    });
  }
  _exIn.click();
}

function exportCSV(){
  let head,rowsF,name;
  if(curView==="journal"){head=["№ акта","Дата","Объект","Заводской №","Рег. №","Методы","Статус"];
    rowsF=journalRows().map(z=>[z.акт,ru(z.дата),z.объект,z.зав,z.рег,methodsOf(z).join(" "),z.статус]);name="Журнал ЛНК";}
  else if(curView==="objects"){head=["Наименование","Заводской №","Рег. №","Тип","Расположение","Материал"];
    rowsF=live(O).map(o=>[o.наименование,o.зав,o.рег,o.тип,o.место,o.материал]);name="Объекты ЛНК";}
  else if(curView==="si"){head=["Наименование","Тип","Заводской №","Метод","Поверка до","№ свидетельства"];
    rowsF=live(S).map(s=>[s.наименование,s.тип,s.зав,s.метод,ru(s.поверка_до),s.свидетельство]);name="СИ ЛНК";}
  else if(curView==="people"){head=["ФИО","Должность","Функции","Стаж с"];
    rowsF=live(P).map(p=>[p.фио,p.должность,p.функции,p.стаж]);name="Специалисты ЛНК";}
  else{toast("Здесь нечего выгружать");return;}
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const csv="﻿"+[head.map(q).join(";")].concat(rowsF.map(r=>r.map(q).join(";"))).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name+".csv";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
  toast("Выгружено для Excel: "+rowsF.length+" строк");
}

const THEME_KEY="lnk_theme";
function applyTheme(t){
  if(t && t!=="default") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  const sel=document.getElementById("theme"); if(sel) sel.value=t;
}
(function initTheme(){
  let t="default";
  try{ t=localStorage.getItem(THEME_KEY)||"default"; }catch(e){}
  applyTheme(t);
  document.getElementById("theme").addEventListener("change",function(){ applyTheme(this.value); });
})();
