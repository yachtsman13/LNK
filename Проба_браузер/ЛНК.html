<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Система ЛНК — проба</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#1b2430; --muted:#5b6675;
    --line:#d6dbe3; --brand:#1f5c8f; --brand-d:#164668; --brand-soft:#e7f0f8;
    --ok:#1c7a4a; --warn:#b26a00; --danger:#b3261e; --row:#f6f8fb;
    --shadow:0 1px 3px rgba(20,30,50,.12),0 6px 20px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}

  /* ── Каркас приложения ─────────────────────────────── */
  .app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:52px 1fr 30px;
    grid-template-areas:"top top" "side main" "side foot";height:100vh}
  .top{grid-area:top;background:var(--brand);color:#fff;display:flex;align-items:center;
    gap:12px;padding:0 16px;box-shadow:var(--shadow);z-index:3}
  .top .logo{width:26px;height:26px;border-radius:6px;background:#fff;color:var(--brand);
    display:grid;place-items:center;font-weight:800}
  .top h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .top .tag{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px}
  .top .spring{flex:1}
  .top .who{font-size:12px;opacity:.9}

  .side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
    padding:10px 8px;overflow:auto}
  .side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    padding:12px 10px 4px}
  .nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    padding:9px 10px;border-radius:8px;margin:1px 0;display:flex;gap:9px;align-items:center}
  .nav:hover{background:var(--row)}
  .nav.on{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
  .nav .ic{width:18px;text-align:center;opacity:.85}
  .nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--row);
    border-radius:20px;padding:1px 8px}

  .main{grid-area:main;overflow:auto;padding:18px 22px}
  .foot{grid-area:foot;background:var(--panel);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 16px;font-size:11.5px;color:var(--muted)}
  .foot b{color:var(--ink);font-weight:600}

  /* ── Панель инструментов ───────────────────────────── */
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .head h2{margin:0;font-size:19px;font-weight:650}
  .head .spring{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;
    border-radius:8px;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
  .btn:hover{border-color:#b9c2ce}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn .ic{font-size:15px}

  .search{flex:1;min-width:180px;max-width:340px;position:relative}
  .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;
    background:#fff;font:inherit}
  .search .ic{position:absolute;left:10px;top:8px;color:var(--muted)}

  /* ── Таблица ────────────────────────────────────────── */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden}
  .tblwrap{overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f2f5f9;color:var(--muted);font-weight:600;position:sticky;top:0;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.4px}
  tbody tr:nth-child(even){background:var(--row)}
  tbody tr:hover{background:var(--brand-soft)}
  td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
  .pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;display:inline-block}
  .pill.ok{background:#e3f3ea;color:var(--ok)}
  .pill.work{background:#fff2dc;color:var(--warn)}
  .pill.new{background:#e7eef7;color:var(--brand-d)}
  .rowbtn{border:0;background:transparent;color:var(--muted);padding:4px 7px;border-radius:6px}
  .rowbtn:hover{background:#e6ebf1;color:var(--danger)}
  .empty{padding:48px;text-align:center;color:var(--muted)}

  /* ── Модальное окно ─────────────────────────────────── */
  .veil{position:fixed;inset:0;background:rgba(20,30,50,.42);display:none;
    place-items:center;z-index:10;padding:20px}
  .veil.show{display:grid}
  .modal{background:#fff;border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);
    overflow:hidden}
  .modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
  .modal .body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modal .body label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .modal .body .wide{grid-column:1/-1}
  .modal input,.modal select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink)}
  .modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

  .toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;
    transition:.25s;z-index:20;box-shadow:var(--shadow);font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .placeholder{display:grid;place-items:center;height:70%;color:var(--muted);text-align:center}
  .placeholder .big{font-size:44px;margin-bottom:10px;opacity:.5}

  /* ── Печать → PDF ───────────────────────────────────── */
  @media print{
    .app{display:block;height:auto}
    .top,.side,.foot,.head .btn,.head .search,.rowbtn,.veil{display:none!important}
    .main{padding:0;overflow:visible}
    .card{border:0;box-shadow:none}
    th{position:static}
    .print-title{display:block!important}
    @page{margin:14mm}
  }
  .print-title{display:none;font-size:18px;font-weight:700;margin-bottom:6px}
  .print-sub{display:none;color:#555;margin-bottom:14px;font-size:12px}
  @media print{.print-sub{display:block}}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="logo">Л</div>
    <h1>Система ЛНК</h1>
    <span class="tag">проба в браузере</span>
    <div class="spring"></div>
    <div class="who">Рабочее место: <b id="wsName">М1</b></div>
  </div>

  <nav class="side" id="side">
    <div class="grp">Работа</div>
    <button class="nav on" data-view="journal"><span class="ic">▤</span>Журнал<span class="cnt" id="cJournal">0</span></button>
    <button class="nav" data-view="objects"><span class="ic">▢</span>Объекты<span class="cnt" id="cObjects">0</span></button>
    <button class="nav" data-view="devices"><span class="ic">⌗</span>Приборы (СИ)</button>
    <div class="grp">Документы</div>
    <button class="nav" data-view="docs"><span class="ic">▦</span>Акты и протоколы</button>
    <button class="nav" data-view="plan"><span class="ic">◷</span>План работ</button>
    <div class="grp">Обмен</div>
    <button class="nav" data-view="exchange"><span class="ic">⇄</span>Обмен файлами</button>
  </nav>

  <main class="main" id="main"><!-- заполняется из JS --></main>

  <div class="foot">
    <span>Файл: <b id="fileName">не сохранён</b></span>
    <span>Записей: <b id="fRows">0</b></span>
    <span style="margin-left:auto">Проба • данные только для примера</span>
  </div>
</div>

<!-- Окно добавления записи -->
<div class="veil" id="veil">
  <div class="modal">
    <h3 id="mTitle">Новая запись журнала</h3>
    <div class="body">
      <label class="wide">Объект контроля
        <input id="f_obj" placeholder="Напр.: Сосуд, воздухосборник В-1, зав. № 4512"></label>
      <label>Дата
        <input id="f_date" type="date"></label>
      <label>Метод
        <select id="f_method">
          <option>УЗТ</option><option>УЗД</option><option>ВИК</option>
          <option>ТВ</option><option>АЭ</option><option>МК</option>
        </select></label>
      <label>№ акта
        <input id="f_act" placeholder="напр.: 128"></label>
      <label>Специалист
        <input id="f_spec" placeholder="Фамилия И.О."></label>
      <label class="wide">Состояние
        <select id="f_state">
          <option value="new">Черновик</option>
          <option value="work">В работе</option>
          <option value="ok">Зарегистрировано</option>
        </select></label>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn primary" onclick="saveRecord()">Сохранить запись</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";

// ── Данные ────────────────────────────────────────────────
const KEY = "lnk_probe_data_v1";
let state = { file:"", rows:[] };
let editId = null;

const seed = [
  {id:1, obj:"Сосуд, воздухосборник В-1, зав. № 4512", date:"2026-02-11", method:"УЗТ", act:"014", spec:"Иванов И.И.", state:"ok"},
  {id:2, obj:"Котёл паровой ДЕ-10, зав. № 2207",       date:"2026-03-04", method:"ВИК", act:"021", spec:"Петров П.П.", state:"ok"},
  {id:3, obj:"Трубопровод пара, участок ТП-3",          date:"2026-05-19", method:"УЗД", act:"046", spec:"Иванов И.И.", state:"work"},
  {id:4, obj:"Резервуар РВС-700, зав. № 118",           date:"2026-06-02", method:"АЭ",  act:"",    spec:"Сидорова А.А.", state:"new"},
  {id:5, obj:"Сосуд, ресивер аммиачный, зав. № 9031",   date:"2026-07-22", method:"ТВ",  act:"061", spec:"Петров П.П.", state:"ok"},
];

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ state = JSON.parse(raw); }
    else { state = { file:"", rows: seed.slice() }; save(); }
  }catch(e){ state = { file:"", rows: seed.slice() }; }
  if(!Array.isArray(state.rows)) state.rows = [];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  refreshChrome();
}
function nextId(){ return state.rows.reduce((m,r)=>Math.max(m,r.id),0)+1; }

// ── Отрисовка ─────────────────────────────────────────────
const STATE_LABEL = {new:["new","Черновик"], work:["work","В работе"], ok:["ok","Зарегистр."]};
let curView = "journal", query = "";

function refreshChrome(){
  document.getElementById("cJournal").textContent = state.rows.length;
  document.getElementById("cObjects").textContent = new Set(state.rows.map(r=>r.obj)).size;
  document.getElementById("fRows").textContent = state.rows.length;
  document.getElementById("fileName").textContent = state.file || "не сохранён";
}

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderJournal(){
  const rows = state.rows.filter(r=>{
    if(!query) return true;
    const q = query.toLowerCase();
    return (r.obj+r.method+r.act+r.spec).toLowerCase().includes(q);
  });
  const body = rows.length ? rows.map(r=>{
    const [cls,lab] = STATE_LABEL[r.state]||STATE_LABEL.new;
    return `<tr>
      <td class="num">${r.act?esc(r.act):"—"}</td>
      <td>${esc(r.obj)}</td>
      <td>${esc(r.method)}</td>
      <td class="num">${esc(r.date)}</td>
      <td>${esc(r.spec)}</td>
      <td><span class="pill ${cls}">${lab}</span></td>
      <td><button class="rowbtn" title="Изменить" onclick="editRecord(${r.id})">✎</button>
          <button class="rowbtn" title="Удалить" onclick="delRecord(${r.id})">✕</button></td>
    </tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">Записей нет. Нажмите «Добавить запись».</td></tr>`;

  document.getElementById("main").innerHTML = `
    <div class="print-title">Журнал учёта заключений ЛНК</div>
    <div class="print-sub">Сформировано в пробной версии • данные только для примера</div>
    <div class="head">
      <h2>Журнал</h2>
      <div class="search"><span class="ic">⌕</span>
        <input id="q" placeholder="Поиск: объект, № акта, метод…" value="${esc(query)}"></div>
      <div class="spring"></div>
      <button class="btn primary" onclick="addRecord()"><span class="ic">＋</span>Добавить запись</button>
      <button class="btn" onclick="saveFile()"><span class="ic">▼</span>Сохранить в файл</button>
      <button class="btn" onclick="openFile()"><span class="ic">▲</span>Открыть файл</button>
      <button class="btn" onclick="exportCSV()"><span class="ic">▤</span>Экспорт в Excel</button>
      <button class="btn" onclick="window.print()"><span class="ic">⎙</span>Печать / PDF</button>
    </div>
    <div class="card"><div class="tblwrap"><table>
      <thead><tr><th>№ акта</th><th>Объект контроля</th><th>Метод</th><th>Дата</th><th>Специалист</th><th>Состояние</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table></div></div>`;

  const q = document.getElementById("q");
  q.addEventListener("input", ()=>{ query=q.value; const p=q.selectionStart; renderJournal();
    const nq=document.getElementById("q"); nq.focus(); nq.setSelectionRange(p,p); });
}

function renderPlaceholder(title, text){
  document.getElementById("main").innerHTML = `
    <div class="head"><h2>${title}</h2></div>
    <div class="placeholder"><div><div class="big">▢</div>${text}<br>
    <span style="font-size:12px">В пробе показан один рабочий раздел — «Журнал».</span></div></div>`;
}

function renderExchange(){
  document.getElementById("main").innerHTML = `
    <div class="head"><h2>Обмен файлами</h2></div>
    <div class="card" style="padding:20px;max-width:640px">
      <p style="margin:0 0 12px">Так это будет работать без сети:</p>
      <ol style="margin:0;padding-left:20px;line-height:1.7">
        <li><b>Сохранить в файл</b> — программа кладёт обычный файл с понятным именем
            (напр. <code>Данные ЛНК 2026-09-09 (М1)</code>) на флешку или в общую папку.</li>
        <li>На другом месте — <b>Открыть файл</b>, и записи забираются к себе.</li>
        <li>Файл — обычный документ: коллега его не спутает и случайно не испортит.</li>
      </ol>
      <p style="margin:14px 0 0;color:var(--muted);font-size:12.5px">
        Кнопки «Сохранить в файл» и «Открыть файл» уже работают на вкладке «Журнал» —
        попробуйте: это и есть проверка, что обмен файлами у вас проходит.</p>
    </div>`;
}

function switchView(v){
  curView = v;
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on", n.dataset.view===v));
  if(v==="journal") renderJournal();
  else if(v==="exchange") renderExchange();
  else if(v==="objects") renderPlaceholder("Объекты", "Справочник объектов контроля.");
  else if(v==="devices") renderPlaceholder("Приборы (СИ)", "Реестр средств измерений и их поверки.");
  else if(v==="docs") renderPlaceholder("Акты и протоколы", "Готовые документы по записям журнала.");
  else if(v==="plan") renderPlaceholder("План работ", "Плановые и внеплановые работы.");
}

// ── Форма записи ──────────────────────────────────────────
function addRecord(){
  editId = null;
  document.getElementById("mTitle").textContent = "Новая запись журнала";
  f_obj.value=""; f_date.value=new Date().toISOString().slice(0,10);
  f_method.value="УЗТ"; f_act.value=""; f_spec.value=""; f_state.value="new";
  showModal();
}
function editRecord(id){
  const r = state.rows.find(x=>x.id===id); if(!r) return;
  editId = id;
  document.getElementById("mTitle").textContent = "Изменить запись";
  f_obj.value=r.obj; f_date.value=r.date; f_method.value=r.method;
  f_act.value=r.act; f_spec.value=r.spec; f_state.value=r.state;
  showModal();
}
function saveRecord(){
  const obj = f_obj.value.trim();
  if(!obj){ toast("Укажите объект контроля"); f_obj.focus(); return; }
  const rec = {obj, date:f_date.value, method:f_method.value, act:f_act.value.trim(),
               spec:f_spec.value.trim(), state:f_state.value};
  if(editId){ Object.assign(state.rows.find(x=>x.id===editId), rec); }
  else { rec.id = nextId(); state.rows.push(rec); }
  save(); closeModal(); renderJournal();
  toast(editId ? "Запись изменена" : "Запись добавлена");
}
function delRecord(id){
  const r = state.rows.find(x=>x.id===id);
  if(!confirm("Удалить запись?\n\n"+(r?r.obj:""))) return;
  state.rows = state.rows.filter(x=>x.id!==id);
  save(); renderJournal(); toast("Запись удалена");
}
function showModal(){ document.getElementById("veil").classList.add("show"); setTimeout(()=>f_obj.focus(),50); }
function closeModal(){ document.getElementById("veil").classList.remove("show"); }

// ── Файлы: сохранить / открыть / экспорт ──────────────────
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function download(name, text, type){
  const blob = new Blob([text], {type:type||"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 400);
}
function saveFile(){
  const name = "Данные ЛНК "+stamp()+" (М1).json";
  state.file = name;
  download(name, JSON.stringify(state, null, 2), "application/json");
  save(); toast("Файл сохранён: "+name);
}
function openFile(){ document.getElementById("fileIn").click(); }
document.getElementById("fileIn").addEventListener("change", ev=>{
  const file = ev.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const data = JSON.parse(rd.result);
      const incoming = Array.isArray(data) ? data : data.rows;
      if(!Array.isArray(incoming)) throw new Error("нет записей");
      // слияние по (объект+дата+метод): чужие записи добавляются, свои не задваиваются
      const key = r => (r.obj+"|"+r.date+"|"+r.method).toLowerCase();
      const have = new Set(state.rows.map(key));
      let added=0;
      incoming.forEach(r=>{ if(!have.has(key(r))){ r.id=nextId(); state.rows.push(r); have.add(key(r)); added++; }});
      save(); renderJournal();
      toast(added ? ("Добавлено записей: "+added) : "Новых записей нет — всё уже есть");
    }catch(e){ toast("Не удалось прочитать файл: "+e.message); }
  };
  rd.readAsText(file);
  ev.target.value="";
});
function exportCSV(){
  const head = ["№ акта","Объект контроля","Метод","Дата","Специалист","Состояние"];
  const q = s => '"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const lines = [head.map(q).join(";")];
  state.rows.forEach(r=>lines.push([r.act,r.obj,r.method,r.date,r.spec,
    (STATE_LABEL[r.state]||["","?"])[1]].map(q).join(";")));
  // BOM — чтобы Excel открыл кириллицу верно
  download("Журнал ЛНК "+stamp()+".csv", "﻿"+lines.join("\r\n"), "text/csv;charset=utf-8");
  toast("Экспортировано для Excel");
}

// ── Мелочи ────────────────────────────────────────────────
let toastT=null;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}
document.getElementById("side").addEventListener("click", e=>{
  const b=e.target.closest(".nav"); if(b) switchView(b.dataset.view);
});
document.getElementById("veil").addEventListener("click", e=>{ if(e.target.id==="veil") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

load(); refreshChrome(); switchView("journal");
</script>
</body>
</html>
