name: Claude Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.NEUROAPI_KEY }}
        env:
          ANTHROPIC_BASE_URL: https://claude.neuroapi.host
